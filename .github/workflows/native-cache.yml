name: Native cache portability

on:
  push:
    branches: [v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cache:
    name: Native cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Exercise spaces in the cache path, including MSVC's archive tools.
      LK_AGENTS_NATIVE_CACHE_DIR: ${{ runner.temp }}/agents native artifacts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible Rust SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-sdk: 'false'
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test cache publication, locations, archives, and native tokenization
        shell: bash
        run: cargo test --locked --manifest-path rust/Cargo.toml -p lk-agents-media --features blingfire
      - name: Build native debug symbols with the platform compiler
        shell: bash
        env:
          LK_AGENTS_NATIVE_DEBUG: '1'
        run: cargo test --locked --manifest-path rust/Cargo.toml -p lk-agents-media --features blingfire
      - name: Reuse native artifacts with a different Cargo target directory
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/second cargo target
        run: cargo test --locked --manifest-path rust/Cargo.toml -p lk-agents-media --features blingfire
