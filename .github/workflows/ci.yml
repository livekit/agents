name: CI

on:
  push:
    branches: [main, 0.x, v2.0]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-sdk: 'false'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ruff

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: uv sync --locked --only-group lint

      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github .
        continue-on-error: true
        id: ruff-check

      - name: Check format
        run: uv run --no-sync ruff format --check .
        continue-on-error: true
        id: ruff-format

      - name: Report ruff errors
        if: steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure'
        run: |
          echo "::error::Ruff checks failed. Please run 'make fix' locally to automatically fix formatting and linting issues."
          exit 1

  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
        
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ matrix.python-version }}-

      - name: Check Types
        run: uv run python scripts/check_types.py

  storage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-sdk: 'false'
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: storage-tests-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: storage-tests-

      # the staging tests skip without a project in the environment
      - name: Test thread storage on both backends
        working-directory: rust
        run: cargo test --locked -p lk-agents-storage

  # The Rust core and the package over it: the generated files match their declarations (every
  # `_generated/` header says CI regenerates them), the core's provider and voice tests pass, and
  # livekit-agents-next builds and runs its smoke call end to end.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # Codegen and architecture ratchets inspect committed history.

      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: core-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: core-

      - name: Generated files match their declarations
        working-directory: rust
        run: cargo run --locked -q -p lk-agents-codegen -- --check

      # ABI architecture tests invoke Clippy and compare baselines with their full history.
      - name: Prepare architecture checks
        run: |
          rustup component add clippy
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow
          fi

      - name: The core's provider and voice tests
        working-directory: rust
        run: cargo test --locked -q -p lk-agents-abi -p lk-agents-inference -p lk-agents-voice

      - name: Build livekit-agents-next
        run: |
          uv venv -p 3.12 .venv-next
          uv pip install -p .venv-next/bin/python --no-config maturin pytest ruff
          cd livekit-agents-next
          VIRTUAL_ENV=../.venv-next ../.venv-next/bin/maturin develop --uv

      # The plugin base classes are Python the generator writes from `rust/ai_slop/lk-agents-codegen/src/bases.rs`:
      # linted like hand-written code (the repository's ruff excludes `_generated/` otherwise).
      - name: Lint the generated plugin bases
        working-directory: livekit-agents-next/livekit/agents/_generated
        run: |
          ../../../../.venv-next/bin/ruff check llm.py stt.py tts.py vad.py realtime.py
          ../../../../.venv-next/bin/ruff format --check llm.py stt.py tts.py vad.py realtime.py

      - name: Smoke
        run: .venv-next/bin/python livekit-agents-next/scripts/smoke.py
