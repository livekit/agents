name: CI

on:
  push:
    branches: [main, 0.x, v2.0]
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-sdk: 'false'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ruff

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: uv sync --locked --only-group lint

      - name: Ruff
        run: uv run --no-sync ruff check --output-format=github .
        continue-on-error: true
        id: ruff-check

      - name: Check format
        run: uv run --no-sync ruff format --check .
        continue-on-error: true
        id: ruff-format

      - name: Report ruff errors
        if: steps.ruff-check.outcome == 'failure' || steps.ruff-format.outcome == 'failure'
        run: |
          echo "::error::Ruff checks failed. Please run 'make fix' locally to automatically fix formatting and linting issues."
          exit 1

  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Cache mypy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            mypy-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ matrix.python-version }}-

      - name: Check Types
        run: make type-check

  # The Rust core and the package over it: every Rust rule (`make -C rust check`: fmt, Clippy,
  # rust/check, generated drift), and livekit-agents builds and runs its native integration tests.
  # The Rust test suites run once, in the launch gate.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: core-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: core-

      - name: Build livekit-agents
        run: |
          uv venv -p 3.12 .venv-native
          uv pip install -p .venv-native/bin/python --no-config maturin pytest pytest-asyncio pytest-timeout pytest-asyncio-concurrent==0.5.2 requests ruff
          cd python/livekit-agents
          VIRTUAL_ENV=../../.venv-native ../../.venv-native/bin/maturin develop --uv

      # The plugin base classes (hand-written beside their proxies, e.g. `rust/crates/lk-agents-abi/src/tts/tts.py`)
      # merged with their records: linted like hand-written code (the repository's ruff excludes `_generated/`).
      - name: Lint the generated plugin bases
        working-directory: python/livekit-agents/livekit/agents/_generated
        run: |
          ../../../../../.venv-native/bin/ruff check llm.py stt.py tts.py vad.py realtime.py
          ../../../../../.venv-native/bin/ruff format --check llm.py stt.py tts.py vad.py realtime.py

      - name: Native integration tests
        run: .venv-native/bin/python -m pytest python/tests/test_native_smoke.py --unit

      - name: Rust rules
        run: |
          rustup component add clippy rustfmt
          PYO3_PYTHON=$PWD/.venv-native/bin/python make -C rust check CARGO_RUNNER=cargo
