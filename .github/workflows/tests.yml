name: tests

on:
  push:
    branches:
      - main
      - v2.0
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - v2.0
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  blockguard-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build and install blockguard
        run: pip install python/livekit-plugins/livekit-blockguard/

      - name: Install pytest
        run: pip install pytest

      - name: Run blockguard tests
        working-directory: python/livekit-plugins/livekit-blockguard
        run: python -m pytest test_blockguard.py -v

  # The job channel's transport differs per OS (a socketpair on Linux and macOS, a named pipe on
  # Windows): its tests and stress run on each.
  ipc-channel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-sdk: 'false'
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ipc-channel-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ipc-channel-${{ matrix.os }}-

      - name: Test the channel, stress included
        working-directory: rust
        run: cargo test --locked -p lk-agents-worker --test ipc_channel -- --include-ignored

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev --group docs

      - name: Download NLTK data
        run: uv run python -c "import nltk; nltk.download('punkt_tab')"

      # Imports every test module of every category without running any, so a module the
      # unit gate never selects still fails CI when it no longer imports.
      - name: Collect every test category
        run: uv run --no-sync pytest --collect-only -q

      - name: Run tests
        run: make unit-tests

  # Real processes and transport: the IPC, worker, CLI and MCP journeys and a LiveKit server in
  # docker run on every change; the text journeys need AgentDB and a LiveKit project, so they run
  # only where the repository's secrets are available.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Hermetic journeys
        run: uv run --no-sync pytest --ignore=python/tests/e2e/test_text.py --e2e

      - name: Text journeys
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          PYTHONPATH: ${{ github.workspace }}/livekit-agents:${{ github.workspace }}
        run: uv run --no-sync pytest python/tests/e2e --e2e

  evaluation:
    # don't run tests for PRs on forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Checkout compatible SDK sources
        uses: ./.github/actions/checkout-sdks
        with:
          python-ref: ${{ vars.AGENTS_PYTHON_SDKS_REF }}
          rust-ref: ${{ vars.AGENTS_RUST_SDKS_REF }}

      - name: Install native build prerequisites
        uses: ./.github/actions/native-build

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run evals
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

        run: uv run pytest --evals
