name: Telemetry registry

on:
  push:
    branches: [v2.0]
    paths: ['rust/otel/**', '.github/workflows/telemetry-registry.yml']
  pull_request:
    paths: ['rust/otel/**', '.github/workflows/telemetry-registry.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  WEAVER_VERSION: v0.28.0
  WEAVER_SHA256: 9878e2d56ad82ae441b0b527377a4f6001ae19f4af362fb0a4d951884f59ab61

jobs:
  weaver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Weaver
        run: |
          archive=weaver-x86_64-unknown-linux-gnu.tar.xz
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/open-telemetry/weaver/releases/download/$WEAVER_VERSION/$archive"
          echo "$WEAVER_SHA256  $archive" | sha256sum -c -
          tar xf "$archive"
          echo "$PWD/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      # Resolves every reference, each `semconv` constant included, against the registries
      # pinned in rust/otel/manifest.yaml.
      - name: Check the registry
        run: weaver registry check -r rust/otel
