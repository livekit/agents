name: Rust architecture

on:
  push:
    branches: [v2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # Baselines ratchet against every committed version.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install Rust and Clippy
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Install native feature build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopus-dev nasm pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: architecture-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: architecture-${{ runner.os }}-
      - name: Check architecture and its counterexamples
        run: bash rust/architecture/check.sh
