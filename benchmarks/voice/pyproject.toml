[project]
name = "lk-voice-bench"
version = "0.1.0"
description = "LiveKit Agents as the agent under test in voice-agent benchmarks (tau2 voice, EVA-Bench)"
requires-python = ">=3.12"
dependencies = ["livekit-agents", "numpy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lk_voice_bench"]
