<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="768" viewBox="0 0 1600 768"
  role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">Uncertain</title>
  <desc id="description">Uncertain-stage processing from a committed remote turn to a machine stage, human, unavailable, or another uncertain turn.</desc>
