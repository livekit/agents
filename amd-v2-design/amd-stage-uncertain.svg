  <defs>
    <symbol id="icon-circle-question" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <path d="M12 17h.01"/>
    </symbol>
    <symbol id="icon-bot" viewBox="0 0 24 24">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2"/>
      <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>
    </symbol>
    <symbol id="icon-mailbox" viewBox="0 0 24 24">
      <path d="M22 17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.5C2 7 4 5 6.5 5H18c2.2 0 4 1.8 4 4v8Z"/>
      <polyline points="15,9 18,9 18,11"/>
      <path d="M6.5 5C9 5 11 7 11 9.5V17a2 2 0 0 1-2 2"/>
      <line x1="6" x2="7" y1="10" y2="10"/>
    </symbol>
    <symbol id="icon-grid-3x3" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2"/>
      <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
    </symbol>
    <symbol id="icon-user-round" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5"/>
      <path d="M20 21a8 8 0 0 0-16 0"/>
    </symbol>
    <symbol id="icon-ban" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M4.929 4.929 19.07 19.071"/>
    </symbol>
    <symbol id="icon-waveform" viewBox="0 0 24 24">
      <path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>

    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#1C2329"/>
    </marker>
    <marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#3157C8"/>
    </marker>
    <marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#28705A"/>
    </marker>
    <marker id="arrow-unavailable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#A94335"/>
    </marker>

    <style>
      text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .display { font-size: 48px; font-weight: 600; letter-spacing: -0.035em; fill: #1C2329; }
      .subtitle { font-size: 15px; fill: #555C61; }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; fill: #555C61; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #858A8D; }
      .title { font-size: 18px; font-weight: 600; fill: #1C2329; }
      .copy { font-size: 12.5px; fill: #555C61; }
      .code { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; fill: #555C61; }
      .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #1C2329; stroke-width: 1.8; }
      .signal { stroke: #3157C8; stroke-width: 2; }
      .human { stroke: #28705A; stroke-width: 2; }
      .unavailable { stroke: #A94335; stroke-width: 2; }
      .stage { stroke: #77756E; stroke-width: 1.5; }
      .repeat { stroke: #3157C8; stroke-width: 1.7; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1600" height="768" fill="#F3F1EB"/>
  <text x="64" y="85" class="display">Uncertain</text>
  <text x="64" y="117" class="subtitle">The normal Agent path remains available while AMD resolves the remote party.</text>
  <g transform="translate(1450 64)">
    <rect x="0" y="-18" width="86" height="28" rx="14" fill="none" stroke="#ACA79C"/>
    <text x="43" y="1" text-anchor="middle" class="micro" fill="#555C61">ACTIVE</text>
  </g>
  <line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D4CA"/>

  <g>
    <path d="M334 358H414" class="wire signal" marker-end="url(#arrow-signal)"/>
    <path d="M714 358H782" class="wire signal" marker-end="url(#arrow-signal)"/>
    <path d="M824 358H868M868 226V622" class="wire stage"/>
    <path d="M868 226H920" class="wire signal" marker-end="url(#arrow-signal)"/>
    <path d="M868 358H920" class="wire stage" marker-end="url(#arrow-ink)"/>
    <path d="M868 490H920" class="wire human" marker-end="url(#arrow-human)"/>
    <path d="M868 622H920" class="wire unavailable" marker-end="url(#arrow-unavailable)"/>
    <path d="M803 337L824 358 803 379 782 358Z" fill="#FBFAF7" stroke="#1C2329" stroke-width="1.5"/>
    <text x="374" y="294" text-anchor="middle" class="micro" fill="#3157C8">COMMITTED TURN</text>
  </g>

    <g>
      <rect x="64" y="308" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#D8D4CA"/>
      <use href="#icon-circle-question" x="84" y="346" width="24" height="24" class="icon" stroke="#77756E"/>
      <text x="122" y="357" class="title" fill="#1C2329">Uncertain</text>
      <text x="122" y="381" class="copy">No concrete stage yet</text>
    </g>
    
    <g>
      <rect x="414" y="308" width="300" height="100" rx="12" fill="#FFFFFF" stroke="#D8D4CA"/>
      <circle cx="444" cy="358" r="15" fill="#F3F1EB" stroke="#D8D4CA"/><text x="444" y="362" text-anchor="middle" class="code" fill="#3157C8">1</text>
      <text x="472" y="357" class="title" fill="#1C2329">Client-side EOT</text>
      <text x="472" y="381" class="copy">Classify; one ordered result</text>
    </g>
    
    <g>
      <rect x="920" y="176" width="340" height="100" rx="12" fill="#E9EEFC" stroke="#3157C8"/>
      <circle cx="950" cy="226" r="15" fill="#F3F1EB" stroke="#3157C8"/><text x="950" y="230" text-anchor="middle" class="code" fill="#3157C8">2</text>
      <text x="978" y="225" class="title" fill="#1C2329">Enter machine stage</text>
      <text x="978" y="249" class="copy">Screening, voicemail, or IVR</text>
    </g>
    
    <g>
      <rect x="920" y="308" width="340" height="100" rx="12" fill="#FBFAF7" stroke="#ACA79C"/>
      <circle cx="950" cy="358" r="15" fill="#F3F1EB" stroke="#ACA79C"/><text x="950" y="362" text-anchor="middle" class="code" fill="#77756E">2</text>
      <text x="978" y="357" class="title" fill="#1C2329">Stay uncertain</text>
      <text x="978" y="381" class="copy">Release the normal Agent response</text>
    </g>
    
    <g>
      <rect x="920" y="440" width="340" height="100" rx="12" fill="#E6F1EC" stroke="#28705A"/>
      <use href="#icon-user-round" x="940" y="478" width="24" height="24" class="icon" stroke="#28705A"/>
      <text x="978" y="489" class="title" fill="#28705A">Human</text>
      <text x="978" y="513" class="copy">Release the held response</text>
    </g>
    
    <g>
      <rect x="920" y="572" width="340" height="100" rx="12" fill="#F6E9E5" stroke="#A94335"/>
      <use href="#icon-ban" x="940" y="610" width="24" height="24" class="icon" stroke="#A94335"/>
      <text x="978" y="621" class="title" fill="#A94335">Unavailable</text>
      <text x="978" y="645" class="copy">Cancel the held response</text>
    </g>
    
  <line x1="64" y1="704" x2="1536" y2="704" stroke="#D8D4CA"/>
  <text x="64" y="736" class="kicker">STAGE RULE</text>
  <text x="184" y="736" class="copy">Normal conversation may continue while AMD waits for a concrete category.</text>

</svg>
