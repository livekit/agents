<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620"
  role="img" aria-labelledby="title description" shape-rendering="geometricPrecision">
  <title id="title">Unavailable</title>
  <desc id="description">Unavailable completion flow from gateway prediction through response cancellation and AMD completion.</desc>
  <metadata id="lucide-license">
    Icons are derived from Lucide Icons and Contributors.
    ISC License. Copyright (c) 2026 Lucide Icons and Contributors.
    Permission to use, copy, modify, and/or distribute this software for any purpose with or
    without fee is hereby granted, provided that the above copyright notice and this permission
    notice appear in all copies.
  </metadata>

  <defs>
    <symbol id="icon-circle-question" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <path d="M12 17h.01"/>
    </symbol>
    <symbol id="icon-bot" viewBox="0 0 24 24">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2"/>
      <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>
    </symbol>
    <symbol id="icon-mailbox" viewBox="0 0 24 24">
      <path d="M22 17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.5C2 7 4 5 6.5 5H18c2.2 0 4 1.8 4 4v8Z"/>
      <polyline points="15,9 18,9 18,11"/>
      <path d="M6.5 5C9 5 11 7 11 9.5V17a2 2 0 0 1-2 2"/>
      <line x1="6" x2="7" y1="10" y2="10"/>
    </symbol>
    <symbol id="icon-grid-3x3" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2"/>
      <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
    </symbol>
    <symbol id="icon-user-round" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5"/>
      <path d="M20 21a8 8 0 0 0-16 0"/>
    </symbol>
    <symbol id="icon-ban" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M4.929 4.929 19.07 19.071"/>
    </symbol>
    <symbol id="icon-waveform" viewBox="0 0 24 24">
      <path d="M2 10v4M6 6v12M10 3v18M14 8v8M18 5v14M22 10v4"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>

    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#1C2329"/>
    </marker>
    <marker id="arrow-signal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#3157C8"/>
    </marker>
    <marker id="arrow-human" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#28705A"/>
    </marker>
    <marker id="arrow-unavailable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 9 5 1 9Z" fill="#A94335"/>
    </marker>

    <style>
      text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .display { font-size: 48px; font-weight: 600; letter-spacing: -0.035em; fill: #1C2329; }
      .subtitle { font-size: 15px; fill: #555C61; }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; fill: #555C61; }
      .micro { font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; fill: #858A8D; }
      .title { font-size: 18px; font-weight: 600; fill: #1C2329; }
      .copy { font-size: 12.5px; fill: #555C61; }
      .code { font-size: 11px; font-weight: 600; letter-spacing: 0.01em; fill: #555C61; }
      .icon { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .wire { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #1C2329; stroke-width: 1.8; }
      .signal { stroke: #3157C8; stroke-width: 2; }
      .human { stroke: #28705A; stroke-width: 2; }
      .unavailable { stroke: #A94335; stroke-width: 2; }
      .stage { stroke: #77756E; stroke-width: 1.5; }
      .repeat { stroke: #3157C8; stroke-width: 1.7; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1600" height="620" fill="#F3F1EB"/>
  <text x="64" y="85" class="display">Unavailable</text>
  <text x="64" y="117" class="subtitle">AMD reports the outcome and leaves call policy to the application.</text>
  <g transform="translate(1450 64)">
    <rect x="0" y="-18" width="86" height="28" rx="14" fill="none" stroke="#ACA79C"/>
    <text x="43" y="1" text-anchor="middle" class="micro" fill="#555C61">COMPLETE</text>
  </g>
  <line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D4CA"/>

  <path d="M320 298H368" class="wire unavailable" marker-end="url(#arrow-unavailable)"/>
  <path d="M624 298H672" class="wire unavailable" marker-end="url(#arrow-unavailable)"/>
  <path d="M928 298H976" class="wire unavailable" marker-end="url(#arrow-unavailable)"/>
  <path d="M1232 298H1280" class="wire unavailable" marker-end="url(#arrow-unavailable)"/>

    <g>
      <rect x="64" y="248" width="256" height="100" rx="12" fill="#F6E9E5" stroke="#A94335"/>
      <use href="#icon-ban" x="84" y="286" width="24" height="24" class="icon" stroke="#A94335"/>
      <text x="122" y="297" class="title" fill="#A94335">Unavailable detected</text>
      <text x="122" y="321" class="copy">Rejected or cannot continue</text>
    </g>
    
    <g>
      <rect x="368" y="248" width="256" height="100" rx="12" fill="#FBFAF7" stroke="#A94335"/>
      <circle cx="398" cy="298" r="15" fill="#F3F1EB" stroke="#A94335"/><text x="398" y="302" text-anchor="middle" class="code" fill="#A94335">1</text>
      <text x="426" y="297" class="title" fill="#1C2329">Emit prediction</text>
      <text x="426" y="321" class="copy">category = machine-unavailable</text>
    </g>
    
    <g>
      <rect x="672" y="248" width="256" height="100" rx="12" fill="#FBFAF7" stroke="#A94335"/>
      <circle cx="702" cy="298" r="15" fill="#F3F1EB" stroke="#A94335"/><text x="702" y="302" text-anchor="middle" class="code" fill="#A94335">2</text>
      <text x="730" y="297" class="title" fill="#1C2329">Cancel held response</text>
      <text x="730" y="321" class="copy">Do not generate a machine reply</text>
    </g>
    
    <g>
      <rect x="976" y="248" width="256" height="100" rx="12" fill="#FBFAF7" stroke="#A94335"/>
      <circle cx="1006" cy="298" r="15" fill="#F3F1EB" stroke="#A94335"/><text x="1006" y="302" text-anchor="middle" class="code" fill="#A94335">3</text>
      <text x="1034" y="297" class="title" fill="#1C2329">Complete AMD</text>
      <text x="1034" y="321" class="copy">Close stream; reason = finished</text>
    </g>
    
    <g>
      <rect x="1280" y="248" width="256" height="100" rx="12" fill="#F6E9E5" stroke="#A94335"/>
      <use href="#icon-check" x="1300" y="286" width="24" height="24" class="icon" stroke="#A94335"/>
      <text x="1338" y="297" class="title" fill="#A94335">Application decides</text>
      <text x="1338" y="321" class="copy">Choose the next call action</text>
    </g>
    
  <line x1="64" y1="430" x2="1536" y2="430" stroke="#D8D4CA"/>
  <text x="64" y="464" class="kicker">EVENT ORDER</text>
  <text x="184" y="464" class="copy">amd_prediction is emitted before the transition; amd_completed is emitted after the action is active.</text>
  <text x="64" y="514" class="kicker">COMPLETION</text>
  <text x="184" y="514" class="copy">execute() resolves with the same AMDCompletedEvent instance delivered to listeners.</text>

</svg>
