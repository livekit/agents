<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="920"
  viewBox="0 0 1600 920"
  role="img"
  aria-labelledby="title description"
  shape-rendering="geometricPrecision"
>
  <title id="title">AMD lifecycle</title>
  <desc id="description">
    The core answer machine detection lifecycle. AMD begins in an uncertain state. It can detect
    screening, voicemail, or IVR as an interactive machine stage. Every completed machine turn is
    classified. A completion prediction can identify a human or an unavailable call. An idle timeout
    can also complete AMD from any interactive machine state.
  </desc>
  <metadata id="lucide-license">
    Icons are derived from Lucide Icons and Contributors.
    ISC License. Copyright (c) 2026 Lucide Icons and Contributors.
    Permission to use, copy, modify, and/or distribute this software for any purpose with or
    without fee is hereby granted, provided that the above copyright notice and this permission
    notice appear in all copies.
    THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES WITH REGARD TO THIS
    SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL
    THE AUTHOR BE LIABLE FOR ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY
    DAMAGES WHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN ACTION OF
    CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF OR IN CONNECTION WITH THE USE OR
    PERFORMANCE OF THIS SOFTWARE.
  </metadata>

  <defs>
    <!-- Lucide icons, 24 px outline set. -->
    <symbol id="icon-circle-question" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <path d="M12 17h.01"/>
    </symbol>
    <symbol id="icon-bot" viewBox="0 0 24 24">
      <path d="M12 8V4H8"/>
      <rect width="16" height="12" x="4" y="8" rx="2"/>
      <path d="M2 14h2"/>
      <path d="M20 14h2"/>
      <path d="M15 13v2"/>
      <path d="M9 13v2"/>
    </symbol>
    <symbol id="icon-mailbox" viewBox="0 0 24 24">
      <path d="M22 17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9.5C2 7 4 5 6.5 5H18c2.2 0 4 1.8 4 4v8Z"/>
      <polyline points="15,9 18,9 18,11"/>
      <path d="M6.5 5C9 5 11 7 11 9.5V17a2 2 0 0 1-2 2"/>
      <line x1="6" x2="7" y1="10" y2="10"/>
    </symbol>
    <symbol id="icon-grid-3x3" viewBox="0 0 24 24">
      <rect width="18" height="18" x="3" y="3" rx="2"/>
      <path d="M3 9h18"/>
      <path d="M3 15h18"/>
      <path d="M9 3v18"/>
      <path d="M15 3v18"/>
    </symbol>
    <symbol id="icon-user-round" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="5"/>
      <path d="M20 21a8 8 0 0 0-16 0"/>
    </symbol>
    <symbol id="icon-ban" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M4.929 4.929 19.07 19.071"/>
    </symbol>

    <marker
      id="arrow-ink"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#1C2329"/>
    </marker>
    <marker
      id="arrow-signal"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#3157C8"/>
    </marker>
    <marker
      id="arrow-human"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#28705A"/>
    </marker>
    <marker
      id="arrow-unavailable"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#A94335"/>
    </marker>
    <marker
      id="arrow-timeout"
      viewBox="0 0 10 10"
      refX="9"
      refY="5"
      markerWidth="10"
      markerHeight="10"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#77756E"/>
    </marker>

    <style>
      text {
        font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .display {
        font-size: 48px;
        font-weight: 600;
        letter-spacing: -0.035em;
        fill: #1C2329;
      }
      .kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        fill: #555C61;
      }
      .micro {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        fill: #858A8D;
      }
      .caption {
        font-size: 12px;
        fill: #555C61;
      }
      .state-title {
        font-size: 19px;
        font-weight: 600;
        fill: #1C2329;
      }
      .state-copy {
        font-size: 12px;
        fill: #555C61;
      }
      .code {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
        fill: #555C61;
      }
      .stage-icon {
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .wire {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .wire-ink {
        stroke: #1C2329;
        stroke-width: 1.8;
      }
      .wire-signal {
        stroke: #3157C8;
        stroke-width: 2;
      }
      .wire-human {
        stroke: #28705A;
        stroke-width: 2;
      }
      .wire-unavailable {
        stroke: #A94335;
        stroke-width: 2;
      }
      .wire-stage {
        stroke: #77756E;
        stroke-width: 1.4;
      }
      .wire-timeout {
        stroke: #77756E;
        stroke-width: 1.8;
        stroke-dasharray: 6 7;
      }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#F3F1EB"/>

  <!-- Editorial header -->
  <text x="64" y="85" class="display">
    AMD lifecycle
  </text>
  <text x="64" y="117" font-size="15" fill="#555C61">
    Core semantic states only. Gateway transport and failure policies are separate.
  </text>
  <g transform="translate(1455 64)">
    <rect x="0" y="-18" width="81" height="28" rx="14" fill="none" stroke="#ACA79C"/>
    <text x="40.5" y="1" text-anchor="middle" class="micro" fill="#555C61">CORE FSM</text>
  </g>
  <line x1="64" y1="140" x2="1536" y2="140" stroke="#D8D4CA"/>

  <!-- Uncertain can resolve directly to a completion prediction. -->
  <path
    d="M 221 423 V 186 H 1118 V 440"
    class="wire wire-ink"
    marker-end="url(#arrow-ink)"
  />
  <!-- Start -->
  <circle cx="54" cy="472" r="7" fill="#1C2329"/>
  <path d="M 62 472 H 96" class="wire wire-ink" marker-end="url(#arrow-ink)"/>

  <!-- Initial semantic state -->
  <g>
    <rect x="96" y="423" width="250" height="98" rx="13" fill="#FBFAF7" stroke="#ACA79C"/>
    <use href="#icon-circle-question" x="113" y="440" width="24" height="24" class="stage-icon" stroke="#77756E"/>
    <text x="150" y="458" class="state-title">Uncertain</text>
    <text x="120" y="492" class="state-copy">Waiting for a clear category</text>
  </g>

  <!-- Interactive machine stage -->
  <g>
    <rect x="400" y="220" width="650" height="450" rx="18" fill="#FBFAF7" stroke="#ACA79C" stroke-width="1.2"/>
    <text x="426" y="252" class="kicker" fill="#3157C8">INTERACTIVE MACHINE STAGE</text>
    <text x="426" y="276" class="caption">AMD stays active and classifies every completed turn.</text>
    <line x1="426" y1="291" x2="1024" y2="291" stroke="#D8D4CA"/>

    <!-- Entry switchboard -->
    <path d="M 346 472 H 452" class="wire wire-signal"/>
    <path d="M 452 342 V 602" class="wire wire-signal"/>
    <path d="M 452 342 H 490" class="wire wire-signal" marker-end="url(#arrow-signal)"/>
    <path d="M 452 472 H 490" class="wire wire-signal" marker-end="url(#arrow-signal)"/>
    <path d="M 452 602 H 490" class="wire wire-signal" marker-end="url(#arrow-signal)"/>

    <!-- Screening -->
    <g>
      <rect x="490" y="300" width="432" height="84" rx="12" fill="#FFFFFF" stroke="#D8D4CA"/>
      <use href="#icon-bot" x="506" y="330" width="24" height="24" class="stage-icon" stroke="#3157C8"/>
      <text x="540" y="334" class="state-title">Screening</text>
      <text x="540" y="360" class="state-copy">Speak with the platform’s screening agent</text>
      <text x="895" y="329" text-anchor="end" class="code">machine-screening · speech</text>
    </g>

    <!-- Voicemail -->
    <g>
      <rect x="490" y="430" width="432" height="84" rx="12" fill="#FFFFFF" stroke="#D8D4CA"/>
      <use href="#icon-mailbox" x="506" y="460" width="24" height="24" class="stage-icon" stroke="#3157C8"/>
      <text x="540" y="464" class="state-title">Voicemail</text>
      <text x="540" y="490" class="state-copy">Play a message; a person can still pick up</text>
      <text x="895" y="459" text-anchor="end" class="code">machine-vm · voice message</text>
    </g>

    <!-- IVR -->
    <g>
      <rect x="490" y="560" width="432" height="84" rx="12" fill="#FFFFFF" stroke="#D8D4CA"/>
      <use href="#icon-grid-3x3" x="506" y="590" width="24" height="24" class="stage-icon" stroke="#3157C8"/>
      <text x="540" y="594" class="state-title">IVR</text>
      <text x="540" y="620" class="state-copy">Navigate a spoken or keypad menu</text>
      <text x="895" y="589" text-anchor="end" class="code">machine-ivr · speech or DTMF</text>
    </g>

    <!-- Machine-stage transitions -->
    <path
      d="M 706 384 V 430"
      class="wire wire-stage"
      marker-end="url(#arrow-timeout)"
    />
    <text x="718" y="410" class="code">to voicemail</text>

    <path
      d="M 535 514 V 560"
      class="wire wire-stage"
      marker-end="url(#arrow-timeout)"
    />
    <text x="548" y="541" class="code">post-recording menu</text>

    <path
      d="M 875 560 V 514"
      class="wire wire-stage"
      marker-end="url(#arrow-timeout)"
    />
    <text x="861" y="541" text-anchor="end" class="code">record or re-record</text>

    <!-- Every machine turn plugs into one classification rail. -->
    <path d="M 922 342 H 990" class="wire wire-signal"/>
    <path d="M 922 472 H 990" class="wire wire-signal"/>
    <path d="M 922 602 H 990" class="wire wire-signal"/>
    <path d="M 990 342 V 602" class="wire wire-signal"/>

  </g>

  <!-- Active machine states classify through one shared rail. -->
  <path d="M 990 472 H 1087" class="wire wire-signal" marker-end="url(#arrow-signal)"/>
  <text x="1038" y="457" text-anchor="middle" class="micro" fill="#3157C8">ANY TURN</text>

  <!-- Completion prediction switch -->
  <path d="M 1118 440 L 1150 472 L 1118 504 L 1086 472 Z" fill="#FBFAF7" stroke="#1C2329" stroke-width="1.6"/>

  <!-- Human completion category -->
  <path d="M 1150 472 H 1162" class="wire wire-ink"/>
  <path
    d="M 1162 472 V 332 H 1190"
    class="wire wire-human"
    marker-end="url(#arrow-human)"
  />
  <g>
    <rect x="1190" y="292" width="235" height="80" rx="40" fill="#E6F1EC" stroke="#28705A" stroke-width="1.4"/>
    <use href="#icon-user-round" x="1209" y="320" width="24" height="24" class="stage-icon" stroke="#28705A"/>
    <text x="1241" y="327" class="state-title" fill="#1F5F4B">Human</text>
    <text x="1241" y="347" class="code" fill="#28705A">completion category</text>
  </g>

  <!-- Unavailable completion category -->
  <path
    d="M 1162 472 V 600 H 1190"
    class="wire wire-unavailable"
    marker-end="url(#arrow-unavailable)"
  />
  <g>
    <rect x="1190" y="560" width="235" height="80" rx="40" fill="#F6E9E5" stroke="#A94335" stroke-width="1.4"/>
    <use href="#icon-ban" x="1209" y="588" width="24" height="24" class="stage-icon" stroke="#A94335"/>
    <text x="1241" y="595" class="state-title" fill="#92382D">Unavailable</text>
    <text x="1241" y="615" class="code" fill="#A94335">completion category</text>
  </g>

  <!-- Completion categories converge on AMD complete. -->
  <path d="M 1425 332 H 1455 V 472" class="wire wire-ink"/>
  <path d="M 1425 600 H 1455 V 472" class="wire wire-ink"/>
  <path d="M 1455 472 H 1476" class="wire wire-ink" marker-end="url(#arrow-ink)"/>

  <!-- AMD complete -->
  <text x="1476" y="411" class="kicker" fill="#1C2329">AMD COMPLETE</text>
  <text x="1476" y="430" class="micro">RETURN CONTROL</text>
  <circle cx="1502" cy="472" r="23" fill="#F3F1EB" stroke="#1C2329" stroke-width="1.8"/>
  <circle cx="1502" cy="472" r="10" fill="#1C2329"/>

  <!-- Idle timeout is a composite exit from any machine stage. -->
  <path
    d="M 990 670 V 770 H 1502 V 496"
    class="wire wire-timeout"
    marker-end="url(#arrow-timeout)"
  />
  <g transform="translate(1218 770)">
    <rect x="-185" y="-14" width="370" height="27" rx="13.5" fill="#F3F1EB"/>
    <circle cx="-160" cy="0" r="6" fill="none" stroke="#77756E" stroke-width="1.2"/>
    <path d="M -160 -3 V 0 L -157 2" fill="none" stroke="#77756E" stroke-width="1.2" stroke-linecap="round"/>
    <text x="12" y="4" text-anchor="middle" class="micro" fill="#77756E">
      IDLE TIMEOUT FROM ANY MACHINE STAGE
    </text>
  </g>

  <!-- Compact notation legend -->
  <line x1="64" y1="816" x2="1536" y2="816" stroke="#D8D4CA"/>
  <text x="64" y="851" class="kicker">READING THE DIAGRAM</text>

  <g transform="translate(250 880)">
    <circle cx="0" cy="0" r="6" fill="#1C2329"/>
    <text x="15" y="4" class="caption">start</text>
  </g>

  <g transform="translate(400 880)">
    <path d="M 0 0 H 34" class="wire wire-stage" marker-end="url(#arrow-timeout)"/>
    <text x="47" y="4" class="caption">stage change</text>
  </g>

  <g transform="translate(590 880)">
    <path d="M 0 -11 V 11 M 0 0 H 23" class="wire wire-signal"/>
    <text x="35" y="4" class="caption">from any active state</text>
  </g>

  <g transform="translate(830 880)">
    <path d="M 0 -10 L 10 0 L 0 10 L -10 0 Z" fill="#FBFAF7" stroke="#1C2329" stroke-width="1.3"/>
    <text x="22" y="4" class="caption">completion outcome</text>
  </g>

  <g transform="translate(1030 880)">
    <path d="M 0 0 H 36" class="wire wire-timeout" marker-end="url(#arrow-timeout)"/>
    <text x="49" y="4" class="caption">idle timeout</text>
  </g>

  <g transform="translate(1220 880)">
    <circle cx="0" cy="0" r="10" fill="#F3F1EB" stroke="#1C2329" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="4.5" fill="#1C2329"/>
    <text x="17" y="4" class="caption">AMD complete</text>
  </g>

</svg>
