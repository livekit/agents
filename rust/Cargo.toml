[workspace]
resolver = "3"
members = ["crates/*"]
# The Python binding is a member (so `-p lk-agents-py` works from here and shares this lockfile and
# target dir) but NOT a default member. Cargo unifies features across every package one invocation
# builds: `lk-agents-py` turns on the `python` feature of the core crates, which pulls pyo3 (and
# libpython) into them. A plain `cargo build` / `cargo test` / `cargo nextest run` from `rust/`
# therefore builds the host-neutral crates only, and the binding is built in its own invocation:
#
#   cargo build                                   # core crates, no host feature
#   cargo nextest run -p lk-agents-py             # binding tests (links libpython; set
#                                                 # PYO3_PYTHON / PYTHONHOME to the dev venv)
#   (cd ../livekit-agents-next && maturin develop)
default-members = [
    "crates/lk-agents-abi",
    "crates/lk-agents-bindgen",
    "crates/lk-agents-codegen",
    "crates/lk-agents-core",
    "crates/lk-agents-fuzz",
    "crates/lk-agents-host-derive",
    "crates/lk-agents-inference",
    "crates/lk-agents-media",
    "crates/lk-agents-storage",
    "crates/lk-agents-voice",
    "crates/lk-agents-worker",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
# --- dependencies the pure cores may take (no tokio, reqwest, prost, pyo3, no C++) ---
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
# The A2A v1 types, from a2aproject/a2a-rs: they serialize as v1 protobuf JSON.
a2a          = { package = "a2a-lf", version = "=0.4.2" }
thiserror    = "2"
smallvec     = "1"
ordered-float = "5"
indexmap     = "2"
# --- below the purity line ---
tokio        = { version = "1", features = ["rt", "sync", "macros", "time"] }
# The LiveKit protocol: `livekit_protocol::agent` is the generated `livekit.agent` package --
# `AgentSessionEvent`, `SessionRequest`, the EOT inference messages, the thread schema (v1) -- and
# `livekit_protocol::{WorkerMessage, ServerMessage}` the worker's own wire. One source for every
# proto in the workspace; nothing here generates or vendors a `.rs` from a `.proto`.
#
# Path dependencies on the local `rust-sdks` checkout, branch `theo/thread-schema-v1`: `main` with
# the protocol at livekit/protocol `main` plus the thread schema without `lanes.agent_stack`, not
# upstream yet.
livekit-protocol = { path = "../../rust-sdks/livekit-protocol" }
# The access token: `AccessToken`/`TokenVerifier`/`Claims` over HS256. The worker's `/agent`
# credential and a simulated job's participant token need `VideoGrants.agent` and `Claims.kind`.
livekit-token = { path = "../../rust-sdks/livekit-token" }
# Its `ThreadClient` and `DatabaseClient` are the only way to agentstore's threads and databases.
# Its rustls is pinned to `ring`, the workspace's one crypto provider.
livekit-api = { path = "../../rust-sdks/livekit-api", default-features = false, features = ["services", "rustls-tls-native-roots"] }
# `livekit-protocol`'s prost, and therefore the workspace's: prost-derive emits `::prost::` paths,
# so every crate that names a `Message` from that package must see the same major, 0.14 since
# livekit/rust-sdks#1447.
prost        = { version = "0.14", default-features = false, features = ["std", "derive"] }
# The well-known types as `livekit-protocol` generates them (`::pbjson_types::Timestamp`, not
# `::prost_types::`).
pbjson-types = "0.9"
# CPU load and count for the worker's default load calculator, on every platform. `system` only:
# no processes, disks, networks or components.
sysinfo      = { version = "0.39", default-features = false, features = ["system"] }
# The log facade, with structured key-values: a crate logs `log::info!(target: "livekit.agents", job_id = id; "..")`
# and the binding forwards it -- keys included, as `extra` -- into Python's `logging` (`pyo3-log`).
log          = { version = "0.4", features = ["kv"] }
pyo3-log     = { version = "0.13", features = ["kv"] }
# `image`/`base64`: `lk-agents-media` only. Encoding sits below the purity line by design,
# so nothing in tiers 0/1 may pull these -- `cargo-deny` should ban them everywhere else.
# Default features off: no rayon, no decoders, no format probing. JPEG and PNG encode is the whole
# use, and it is the only native-free way to drop the PIL dependency (`utils/images/`).
image        = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64       = "0.22"
async-trait  = "0.1"
pyo3         = "0.29"
# The link-time table `#[lk_agents_abi::export]` submits to, so a binding's host module registers
# every marked item from one call instead of a hand-kept list. Only the bindings may use it, and
# `lk-agents-inference::local_models`, where a native provider of the local models registers.
inventory    = "0.3"
# MCP's SDK owns protocol and session state; runtime supplies HTTP/SSE through lk-agents-net
# and uses the SDK's child-process transport for stdio.
rmcp         = { version = "3.1", default-features = false, features = [
    "client",
    "transport-streamable-http-client",
    "transport-child-process",
] }

[profile.dev]
debug = 1
# NOT "unpacked", which is the macOS default and what this workspace used until it became
# unusable. Unpacked emits one `.o` per codegen unit next to the rlib, names it by a hash of the
# build, and cargo never garbage-collects the previous set -- so every rebuild ADDS a full copy.
# Measured before this change: 1,000,414 orphan `.o` files and 71 GB under target/, ~40 % of them
# belonging to crates that no longer exist (`lk_agents_types`, `lk_agents_eot`, `turn`, ...).
# At that size the directory costs minutes merely to enumerate: a NO-OP `cargo check --workspace`
# took 4m43s wall for 0.19 s of CPU, and `make t0` -- the tier whose whole purpose is to be the
# fast inner loop -- took 4m36s for 12.5 s. "off" embeds the debuginfo in the rlib instead, so
# nothing accumulates; dsymutil still never runs, which is the one thing "packed" would cost us.
split-debuginfo = "off"

# The ~270 third-party crates never need debuginfo: we do not step into them, and their line
# tables are the bulk of both the link input and the artifact size. Our own crates keep the
# `debug = 1` above, so a failing test still names file:line in code we wrote: a hang across
# the FFI boundary is only diagnosable from a readable trace. Dependencies of test targets use this profile too, not `profile.test`.
[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
# Inherited from `profile.dev` in principle, but spelled out: `cargo test`/`nextest` build test
# targets under this profile, and it was the test binaries -- one per integration test, rebuilt
# on every run -- that produced the largest single share of the orphan `.o` files above
# (the driver, then its own crate `lk_agents_driver`, alone: 83,440).
split-debuginfo = "off"
