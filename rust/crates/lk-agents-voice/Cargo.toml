[package]
name = "lk-agents-voice"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# `///` docs on `#[derive(Host)]` records are the reference's Python docstrings, emitted verbatim by
# the generator; their indented examples are Python, not Rust doctests. The crate's Rust examples
# are `ignore`d text.
doctest = false

[dependencies]
regex = "1.13.1"
fancy-regex = "0.19.0"
lk-agents-rtc = { path = "../lk-agents-rtc" }
serde = { workspace = true }
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
# The shared agent execution core: the tool outcome table, approval and AgentRun.
lk-agents-core = { path = "../lk-agents-core" }
# BlingFire supplies sentence boundaries for the TTS leg's batching.
lk-agents-media = { path = "../lk-agents-media", features = ["blingfire"] }
async-trait.workspace = true
# Twilio's basic auth (`workflows::warm_transfer`).
base64.workspace = true
log.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
# `remote_session` (`voice/remote_session.py`): the `livekit.agent` package's
# `AgentSessionEvent`/`SessionRequest`, its prost, and the well-known types as that crate spells
# them.
livekit-protocol.workspace = true
prost.workspace = true
pbjson-types.workspace = true
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
# Paused time (`start_paused`) for the unit tests only.
tokio = { workspace = true, features = ["test-util"] }

[features]
# libsoxr behind the driver's, the input leg's and the pre-connect buffer's rate conversions
# (`lk_agents_media::new_resampler`). Off, every conversion uses `lk-agents-media`'s linear fallback and the
# crate's check closure compiles no resampler C: `cargo check -p lk-agents-voice --no-default-features`
# (blingfire's C++ stays: the TTS leg's sentence batching is not optional).
default = ["native-audio"]
native-audio = ["lk-agents-media/resample"]
# Test-only: `SessionApi::probe`, what a deterministic simulation needs from a session it drives
# through this API (the journal as it is written, the typed host events, and the session's cores
# for a queue owner of its own). Enabled by the fuzzer and runtime conformance tests.
dst = []
# The Python binding, expanded in place: only `lk-agents-py` enables it.
python = ["dep:pyo3", "lk-agents-abi/python", "lk-agents-rtc/python", "lk-agents-media/python"]
