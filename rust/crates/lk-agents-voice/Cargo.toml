[package]
autotests = false
name = "lk-agents-voice"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The crate's Rust examples are `ignore`d text, not doctests.
doctest = false

[dependencies]
serde = { workspace = true }
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
# The shared agent execution core: the tool outcome table, approval and AgentRun.
lk-agents-core = { path = "../lk-agents-core" }
# The spans the session machine owns (`Trace`, `ManualSpan`).
lk-agents-telemetry = { path = "../lk-agents-telemetry" }
# Audio framing, resampling, the endpointing filter and the pre-connect audio decode.
lk-agents-media = { path = "../lk-agents-media" }
log.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `remote_session` (`voice/remote_session.py`): the `livekit.agent` package's
# `AgentSessionEvent`/`SessionRequest`, its prost, and the well-known types as that crate spells
# them.
livekit-protocol.workspace = true
prost.workspace = true
pbjson-types.workspace = true

[features]
# Decodes the checked-in Opus replies of the transcript sync accuracy test.
ffmpeg = ["lk-agents-media/ffmpeg"]

[lints]
workspace = true
