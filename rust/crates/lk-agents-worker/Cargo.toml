[package]
name = "lk-agents-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The WebTransport worker connection.
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
parking_lot.workspace = true
livekit-protocol.workspace = true
prost.workspace = true
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
lk-agents-net = { path = "../lk-agents-net" }
serde_json = { workspace = true, features = ["preserve_order"] }
# The job process channel (`ipc/ipc_channel.rs`): typed messages, postcard-encoded.
serde.workspace = true
postcard = { version = "1", default-features = false, features = ["alloc"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
thiserror.workspace = true
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sysinfo.workspace = true
log.workspace = true
url = "2"
# Hyper owns HTTP parsing and framing for the health and metrics listeners.
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
[target.'cfg(unix)'.dependencies]
# Process signals and waits (`ipc/process.rs`), socket options (`ipc/ipc_channel.rs`).
libc = "0.2"
[target.'cfg(windows)'.dependencies]
# The job channel's named pipe (`ipc/ipc_channel.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
# The pipe's unguessable name (`ipc/ipc_channel.rs`).
getrandom = "0.3"

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }

# Keep the allocation recorder isolated from the library test binary.
[[test]]
name = "ipc_channel"
path = "src/ipc/ipc_channel_tests.rs"
