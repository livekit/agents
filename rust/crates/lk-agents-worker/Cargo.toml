[package]
name = "lk-agents-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
parking_lot.workspace = true
livekit-protocol.workspace = true
prost.workspace = true
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
lk-agents-net = { path = "../lk-agents-net" }
serde_json = { workspace = true, features = ["preserve_order"] }
# The job process channel (`ipc/channel.rs`): typed messages, postcard-encoded.
serde.workspace = true
postcard = { version = "1", default-features = false, features = ["alloc"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
thiserror.workspace = true
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
sysinfo.workspace = true
log.workspace = true
url = "2"
# The endpoint exchange's HTTP/1.1 request head (`endpoint.rs`).
httparse = "1"
# The log lines' timestamps (`cli.rs`).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
[target.'cfg(unix)'.dependencies]
# Process signals and waits (`ipc/process.rs`), socket options (`ipc/channel.rs`).
libc = "0.2"
[target.'cfg(windows)'.dependencies]
# The job channel's named pipe (`ipc/channel.rs`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }
# The pipe's unguessable name (`ipc/channel.rs`).
getrandom = "0.3"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util"] }
