[package]
name = "lk-agents-media"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build/mod.rs"

# Synchronous CPU work; the runtime owns scheduling, admission, I/O and asynchronous delivery.
[features]
default = []
# Compiles the hand-written ffmpeg bindings and the demux/decode + encode/mux loops.
# Cold build is MINUTES when it also builds the vendored source tree. See build/mod.rs.
ffmpeg = []
# The image encoder `to_provider_format` needs (`images/`).
images = ["dep:image"]

[dependencies]
thiserror = { workspace = true }
log.workspace = true

# The same resampling library as `rtc.AudioResampler`, for every build and caller.
soxr-sys = "0.1.3"

lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-telemetry = { path = "../lk-agents-telemetry" }
# Default features off: JPEG and PNG encode only, no decoders and no rayon.
image = { workspace = true, optional = true }

[build-dependencies]
# Compiles the native wrappers when `ffmpeg` is enabled.
cc = "1"
pkg-config = "0.3"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
# Host frames without a host (`utils::video::FakeFrame`).
lk-agents-abi = { path = "../lk-agents-abi", features = ["testkit"] }
sha2 = "0.10"
tempfile = "3"

# The native artifact cache is build-script code; its test sits beside it.
[[test]]
name = "cache"
path = "build/cache_tests.rs"

[lints]
workspace = true
