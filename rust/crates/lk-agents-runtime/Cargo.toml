[package]
name = "lk-agents-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The runtime half of the core/runtime boundary (docs/internals/rust-core.md "Ownership boundaries"):
# Tokio, sockets, real clocks, task ownership, effect execution and the async host bridge. Cores
# never depend on it. Grown from consumers: each module lands with the slice that uses it.
[dependencies]
rmcp.workspace = true
sse-stream = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }
lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-inference = { path = "../lk-agents-inference" }
lk-agents-net = { path = "../lk-agents-net" }
# The shared agent execution core whose `AgentRun` effects `agent_run` executes.
lk-agents-core = { path = "../lk-agents-core" }
lk-agents-voice = { path = "../lk-agents-voice", default-features = false }
lk-agents-worker = { path = "../lk-agents-worker" }
lk-agents-media = { path = "../lk-agents-media" }
# Signs the gateway token (and later every framework credential): no private claims or signer.
livekit-token.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
log.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json", "query"] }
base64.workspace = true
httparse = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
pyo3 = { workspace = true, optional = true }
# Thread storage (all database interaction) and the A2A door's decisions.
lk-agents-storage = { path = "../lk-agents-storage" }
livekit-protocol.workspace = true
pbjson-types.workspace = true
prost.workspace = true
a2a.workspace = true
serde.workspace = true
indexmap.workspace = true
# Threads and databases through public-api-server, the one way to agentstore.
# The AgentDB data plane: the same WebSocket and TLS set as `lk-agents-worker` and
# `lk-agents-inference`, one crypto provider (`ring`).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
url = "2"
# `SQLiteStorage`: one file per thread, executed on its own connection thread.

postcard = { version = "1", default-features = false, features = ["alloc"] }
sysinfo.workspace = true
web-transport-quinn = { version = "0.12", default-features = false, features = ["ring"] }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = "1"
lk-agents-voice = { path = "../lk-agents-voice", default-features = false, features = ["dst"] }
lk-agents-storage = { path = "../lk-agents-storage", features = ["testing"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
lk-agents-inference = { path = "../lk-agents-inference", features = ["testkit"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

[features]
media-ffmpeg = ["lk-agents-media/ffmpeg"]
media-resample = ["lk-agents-media/resample"]
media-images = ["lk-agents-media/images"]
# The async host bridge for the generated pyo3 adapters; only `lk-agents-py` enables it.
# It also gives the cores the features the extension links them with (decision 67: the extension
# reaches them through the runtime).
python = [
    "media-images",
    "dep:pyo3",
    "lk-agents-abi/python",
    "lk-agents-inference/python",
    "lk-agents-inference/native-audio",
    "lk-agents-voice/python",
    "lk-agents-voice/native-audio",
    "lk-agents-media/blingfire",
]

[build-dependencies]
serde.workspace = true
serde_json.workspace = true
