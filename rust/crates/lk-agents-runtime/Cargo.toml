[package]
name = "lk-agents-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The runtime half of the core/runtime boundary (docs/internals/rust-core.md "Ownership boundaries"):
# Tokio, sockets, real clocks, task ownership, effect execution and the async host bridge. Cores
# never depend on it. Grown from consumers: each module lands with the slice that uses it.
[dependencies]
lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-inference = { path = "../lk-agents-inference" }
# The shared agent execution core whose `AgentRun` effects `agent_run` executes.
lk-agents-core = { path = "../lk-agents-core" }
lk-agents-worker = { path = "../lk-agents-worker" }
lk-agents-media = { path = "../lk-agents-media" }
# Signs the gateway token (and later every framework credential): no private claims or signer.
livekit-token.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
log.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json", "query", "multipart"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
pyo3 = { workspace = true, optional = true }
# Thread storage and the A2A door: the cores' plans executed against AgentDB and local SQLite.
lk-agents-storage = { path = "../lk-agents-storage", features = ["sqlite"] }
lk-agents-a2a = { path = "../lk-agents-a2a" }
livekit-protocol.workspace = true
pbjson-types.workspace = true
prost.workspace = true
# Upstream Google RPC records, matching the workspace prost.
tonic-types = { version = "0.14", default-features = false }
a2a.workspace = true
serde.workspace = true
# Threads and databases through public-api-server, the one way to agentstore.
livekit-api.workspace = true
# The AgentDB data plane: the same WebSocket and TLS set as `lk-agents-worker` and
# `lk-agents-inference`, one crypto provider (`ring`).
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
url = "2"
# Lease tokens, task, message and artifact ids: six random bytes as hex.
rand = "0.9"
# `SQLiteStorage`: one file per thread, executed on its own connection thread.
rusqlite = { version = "0.32.1", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

[features]
media-ffmpeg = ["lk-agents-media/ffmpeg"]
media-resample = ["lk-agents-media/resample"]
media-images = ["lk-agents-media/images"]
# The async host bridge for the generated pyo3 adapters; only `lk-agents-py` enables it.
python = ["dep:pyo3", "lk-agents-abi/python", "lk-agents-inference/python", "lk-agents-a2a/python"]
