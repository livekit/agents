[package]
autotests = false
name = "lk-agents-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The runtime half of the core/runtime boundary (docs/internals/rust-core.md "Ownership boundaries"):
# Tokio, sockets, real clocks, task ownership, effect execution and the async host bridge. Cores
# never depend on it. Grown from consumers: each module lands with the slice that uses it.
[dependencies]
lk-agents-cli = { path = "../lk-agents-cli" }
parking_lot.workspace = true
rmcp.workspace = true
sse-stream = "0.2"
tokio-util = "0.7"
lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-inference = { path = "../lk-agents-inference", default-features = false }
lk-agents-net = { path = "../lk-agents-net" }
# The shared agent execution core whose `AgentRun` effects `agent_run` executes.
lk-agents-core = { path = "../lk-agents-core" }
lk-agents-voice = { path = "../lk-agents-voice", default-features = false }
lk-agents-worker = { path = "../lk-agents-worker" }
lk-agents-media = { path = "../lk-agents-media" }
serde_json = { workspace = true, features = ["preserve_order"] }
log.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "json", "query"] }
base64.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Thread storage (all database interaction) and the A2A door's decisions.
lk-agents-storage = { path = "../lk-agents-storage" }
livekit-protocol.workspace = true
prost.workspace = true
a2a.workspace = true
serde.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
lk-agents-abi = { path = "../lk-agents-abi", features = ["testkit"] }
bytes = "1"
lk-agents-storage = { path = "../lk-agents-storage", features = ["testing"] }
lk-agents-inference = { path = "../lk-agents-inference", features = ["testkit"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }

[features]
media-ffmpeg = ["lk-agents-media/ffmpeg", "lk-agents-inference/ffmpeg"]
media-images = ["lk-agents-media/images", "lk-agents-inference/images"]
media-blingfire = ["lk-agents-media/blingfire"]
# Test-only: what a deterministic simulation installs on a session (`VoiceSession::probe`) and
# reads back from it. Enabled by the fuzzer.
dst = []

[[test]]
name = "a2a_attachment_boundary"
path = "src/a2a/attachments_tests.rs"

[[test]]
name = "a2a_door"
path = "src/a2a/door_tests.rs"

[[test]]
name = "a2a_turns"
path = "src/a2a/turns_tests.rs"

[[test]]
name = "eot"
path = "src/eot_tests.rs"

[[test]]
name = "images"
path = "src/images_tests.rs"

[[test]]
name = "mcp_lifecycle"
path = "src/mcp/lifecycle_tests.rs"

[[test]]
name = "media_measurements"
path = "src/media_tests.rs"

[[test]]
name = "tts_gateway_live"
path = "src/tts_live_tests.rs"

[[test]]
name = "tts_speech_text"
path = "src/tts_tests.rs"
