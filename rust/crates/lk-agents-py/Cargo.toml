[package]
autotests = false
name = "lk-agents-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
parking_lot.workspace = true
# `extension-module` is off by default so `cargo test` links libpython; maturin turns it on.
pyo3.workspace = true
log.workspace = true
lk-agents-abi = { path = "../lk-agents-abi" }
# `#[host(interface(..))]`: the binding's own interpreter-local interfaces.
lk-agents-host-derive = { path = "../../ai_slop/lk-agents-host-derive" }
# `ffmpeg` stays this crate's own feature (below): as a dependency feature it would unify across
# the workspace and make every workspace test build compile ffmpeg.
lk-agents-runtime = { path = "../lk-agents-runtime", features = [
    "media-images",
] }

indexmap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-util = "0.7"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
inventory.workspace = true
base64.workspace = true
bytes = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
py-spy = { version = "0.4.3", default-features = false }
[build-dependencies]
pyo3-build-config = "0.29"

[features]
extension-module = ["pyo3/extension-module"]
# Enabled by maturin, never by the workspace build.
ffmpeg = ["lk-agents-runtime/media-ffmpeg"]

# Each target owns one interpreter: fake modules, process-wide exception counts and
# fresh-process initialization stay isolated from the real-package adapter tests.
[[test]]
name = "py_conversions"
path = "src/py_values_tests.rs"

[[test]]
name = "py_references"
path = "src/py_errors_tests.rs"

[[test]]
name = "py_bindings"
path = "src/py_bindings_tests.rs"

[[test]]
name = "py_adapters"
path = "src/py_adapter_tests.rs"

# The host-boundary benchmark, kept with the other benchmarks: `make bench-host`.
[[test]]
name = "host_bench"
path = "../../../bench/host.rs"

[lints]
workspace = true
