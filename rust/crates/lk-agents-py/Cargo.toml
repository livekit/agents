[package]
name = "lk-agents-py"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is deliberately NOT on by default: with it enabled pyo3 does not link
# libpython, so `cargo test` cannot resolve Python symbols and the test binary fails to link on
# macOS (§1.3). maturin turns it on via `features = ["pyo3/extension-module"]` in the pyproject.
pyo3 = { workspace = true }
# Forwards every Rust `log` record -- target, level, message and key-values -- to Python's `logging`.
# Installed once per process by `_core.init`.
pyo3-log.workspace = true
log.workspace = true
# The ABI's declared types (the generated conversions name them) and its Python feature: the
# registration table and the fork guard until the bridge moves to the runtime.
lk-agents-abi = { path = "../lk-agents-abi", features = ["python"] }
# The runtime implements the declared classes the generated adapters (`src/generated/`) call; the
# subject cores are reached through it (decision 67), their registrations linked by it.
# `media-resample`/`python` give the extension's media set; `ffmpeg` is this crate's feature below,
# enabled by maturin from pyproject.toml: a dependency feature unifies across the workspace, and it
# made every workspace test build compile ffmpeg (897 s of a 15 min cold build, 2026-09-06).
lk-agents-runtime = { path = "../lk-agents-runtime", features = ["python", "media-resample"] }

lk-agents-voice = { path = "../lk-agents-voice", features = ["native-audio", "python"] }
# The avatar sink implements an async-trait ABI contract.
async-trait.workspace = true
serde.workspace = true
indexmap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
# `_core` coroutines resolve their asyncio futures through its generic runtime port, polled on the
# process runtime (`host::future_into_py`). Literal version: pyo3's companion, as in lk-agents-abi.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[dev-dependencies]
lk-agents-test-support = { path = "../lk-agents-test-support" }

[features]
extension-module = ["pyo3/extension-module"]
# The audio decoder's ffmpeg path and the ogg/opus recorder. Enabled by maturin (pyproject.toml
# `features`), never by the workspace build.
ffmpeg = ["lk-agents-runtime/media-ffmpeg"]

# `#[derive(Host)]` on a unit enum expands its pyo3 conversions under `cfg(feature = "python")`,
# a feature this crate does not have: name the value so check-cfg does not warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }
