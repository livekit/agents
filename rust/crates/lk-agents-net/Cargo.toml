[package]
name = "lk-agents-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared async transport (decision 77): owned tasks, server-sent events, HTTPS with phase
# deadlines, the WebSocket seam and its tungstenite implementation, LiveKit token signing, the
# delegation A2A client (decision 85) and the Cloud session report upload (decision 87). Used by
# inference, storage backends, the worker and runtime.
[lib]
doctest = false

[dependencies]
parking_lot.workspace = true
lk-agents-abi = { path = "../lk-agents-abi" }
# The worker pool primitive: the blocking I/O pool is one of its instances.
lk-agents-media = { path = "../lk-agents-media" }
# Ephemeral transport and worker operation identifiers.
rand = "0.9"
livekit-token.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# TLS crypto provider: `ring` only (reqwest/tungstenite use `rustls-no-provider`-style builds).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
log.workspace = true
# HTTPS with phase deadlines (`http`), shared by the gateway clients and the A2A client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "multipart"] }
bytes = "1"
url = "2"
serde.workspace = true
# The delegation A2A client (decision 85): the protocol records and the A2A decisions it executes
# (`lk_agents_core::a2a`, sans-IO; this edge is pending owner approval).
a2a.workspace = true
lk-agents-core = { path = "../lk-agents-core" }
# The Cloud session report upload: its protobuf header and Google RPC retry records.
livekit-protocol.workspace = true
prost.workspace = true
pbjson-types.workspace = true
tonic-types = { version = "0.14", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util", "net", "io-util"] }
