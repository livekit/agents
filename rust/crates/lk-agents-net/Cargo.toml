[package]
autotests = false
name = "lk-agents-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared async transport: owned tasks, server-sent events, HTTPS with phase deadlines, the
# WebSocket seam, LiveKit token signing, the delegation A2A client and telemetry's export.
[lib]
doctest = false

[dependencies]
parking_lot.workspace = true
lk-agents-abi = { path = "../lk-agents-abi" }
# The worker pool primitive: the blocking I/O pool is one of its instances.
lk-agents-media = { path = "../lk-agents-media" }
# Ephemeral transport and worker operation identifiers.
rand = "0.9"
livekit-token.workspace = true
# RoomService, SIP and connector calls the framework makes in a job's room (`room_service`).
livekit-api.workspace = true
livekit-protocol.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# TLS crypto provider: `ring` only (reqwest/tungstenite use `rustls-no-provider`-style builds).
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
log.workspace = true
# HTTPS with phase deadlines (`http`), shared by the gateway clients and the A2A client.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "multipart"] }
bytes = "1"
url = "2"
serde.workspace = true
# The delegation A2A client: the protocol records and the A2A decisions it executes
# (`lk_agents_core::a2a`, sans-I/O).
a2a.workspace = true
lk-agents-core = { path = "../lk-agents-core" }
# The span API the transport and the A2A client record through, and whose records `export` sends.
lk-agents-telemetry = { path = "../lk-agents-telemetry" }
# The Cloud session report: its protobuf header and Google RPC retry records.
prost.workspace = true
pbjson-types.workspace = true
tonic-types = { version = "0.14", default-features = false }
# `http::gzip`: miniz's deflate and flate2's CRC32. The OTLP message types are checked in
# (`export/otlp/proto.rs`).
flate2 = "1"
miniz_oxide = "0.8"
# The host name of the default storage lease holder (`env::ProcessEnv::lease_holder`).
sysinfo.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util", "net", "io-util"] }
# Regenerates `export/otlp/proto.rs` (an ignored test); already in the lock through livekit-protocol.
prost-build = "0.14"
