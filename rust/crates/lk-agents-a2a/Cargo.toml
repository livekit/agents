[package]
name = "lk-agents-a2a"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The A2A text door's turn engine: one incoming A2A message through its
# policy, run on a lane of `lk-agents-storage`. Host-neutral: `lk-agents-py/src/turn.rs` is the
# Python face.

[lib]
# The `///` docs on the records are the generated pydantic models' docstrings; no Rust doctests.
doctest = false

[dependencies]
lk-agents-storage = { path = "../lk-agents-storage" }
# `#[host(proxy)]` on `TurnHost` and the stream halves it returns: the host's handler is driven like
# any other host object the core calls.
lk-agents-abi = { path = "../lk-agents-abi" }
pyo3 = { workspace = true, optional = true }
# `Host` for the records the host reads, so their pydantic twins come from `lk-agents-codegen`.
lk-agents-host-derive = { path = "../lk-agents-host-derive" }
# The chat item types the history is made of.
livekit-protocol.workspace = true
a2a.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# `TurnHost` is an object-safe async trait: the host (Python through `_core`, Node) runs the handler.
async-trait.workspace = true

[features]
# The proxy and records' pyo3 conversions. Enabled by `lk-agents-py` only.
python = ["dep:pyo3", "lk-agents-abi/python"]

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
