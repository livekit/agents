[package]
autotests = false
name = "lk-agents-inference"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Async I/O: provider clients, their retry/fallback/reconnect execution, provider-side media
# execution and evaluation judges (docs/internals/rust-core.md). The sans-I/O crates never depend
# on it.
[dependencies]
# The provider traits and records this crate implements.
lk-agents-abi = { path = "../lk-agents-abi" }
# The shared HTTP/WebSocket transport and ProcessEnv.
lk-agents-net = { path = "../lk-agents-net" }
parking_lot.workspace = true
# Chat formatting, strict tool schemas and JSON repair: the gateway LLM's, the realtime model's and
# the judges' request bodies.
lk-agents-core = { path = "../lk-agents-core" }
# Resampling, TTS framing and decoding on the media pool; `blingfire` for a fallback TTS member
# without a duplex path, which streams through its sentences.
lk-agents-media = { path = "../lk-agents-media", features = ["blingfire"] }
serde = { workspace = true }
# `preserve_order`: gateway request bodies are assembled as maps and the reference emits them in
# declaration order.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
async-trait.workspace = true
tokio = { workspace = true }
# The VAD stream's cancellation, shared by its sink, its source and its worker.
tokio-util = { version = "0.7", features = ["rt"] }
# `shortuuid` is `uuid4().hex[:12]`, i.e. six random bytes hex-encoded; `rand` is the whole of it.
rand = "0.9"
base64 = { workspace = true }

# The transport the provider clients drive (not optional: a build without it cannot reach the
# gateway).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
url = "2"
log.workspace = true
# `local_models`: the link-time slot a native provider of the local VAD and end-of-turn models
# registers in.
inventory.workspace = true

# `eot`'s wire protocol -- `livekit.agent.{ClientMessage, ServerMessage}` -- is protobuf over the
# same WebSocket seam this crate already owns, taken from the one protocol crate the workspace shares
# (`livekit_protocol::agent`; the vendored `src/eot/proto.rs` went on 2026-09-09). `prost` is that
# crate's and `pbjson-types` is how it spells `Timestamp`/`Duration`.
livekit-protocol.workspace = true
prost.workspace = true
pbjson-types.workspace = true

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
livekit-token.workspace = true
# The integration tests' fakes (`testkit`).
lk-agents-inference = { path = ".", features = ["testkit"] }
fastrand = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "test-util", "net", "io-util"] }

[target.'cfg(unix)'.dev-dependencies]
# Thread CPU time for the realtime step-budget tests.
libc = "0.2"

[features]
# Container decoding (ogg, mp3, ...) in the TTS emitter and the streaming decoder.
ffmpeg = ["lk-agents-media/ffmpeg"]
# Provider image preparation on the media pool (`images`).
images = ["lk-agents-media/images"]
# The network-reaching, `#[ignore]`d live tests (`src/inference_*live*_tests.rs`).
live = []
# The transport fakes (`testkit`), for tests only.
testkit = []

[[test]]
name = "realtime_ctx_diff_scaling"
path = "src/realtime/context_tests.rs"

[[test]]
name = "inference"
path = "src/inference_tests.rs"
