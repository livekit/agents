[package]
name = "lk-agents-fuzz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The voice behavioural suite: one harness and one runner for every contract, and a generator
# drawn from the production vocabulary (`#[derive(Vocabulary)]` on the driver's boundary enums).
# A library so regression tests and voice campaigns share the same runner and fake room.
# See README.md for the layout.
[lib]
doctest = false

[dependencies]
# The realtime DST executes production bookkeeping over a typed simulated provider.
lk-agents-inference = { path = "../lk-agents-inference", default-features = false }
lk-agents-voice = { path = "../lk-agents-voice", default-features = false }
# The DST's seeded tracer over its record sink.
lk-agents-telemetry = { path = "../lk-agents-telemetry" }
# The camera fakes' frames have no host behind them (`utils::video::FakeFrame`).
lk-agents-abi = { path = "../lk-agents-abi", features = ["testkit"] }
lk-agents-core = { path = "../lk-agents-core" }
lk-agents-runtime = { path = "../lk-agents-runtime", default-features = false, features = ["dst"] }
# The recorder fake writes the session's recording with the real timeline, to check it.
lk-agents-media = { path = "../lk-agents-media" }
# The avatar fake's audio and video frames hold their tag as shared bytes.
bytes = "1"
tokio = { workspace = true, features = ["test-util", "io-util"] }
prost.workspace = true
serde_json.workspace = true
fastrand = "2"
# The voice lane's fake database implements storage's connection trait.
async-trait.workspace = true
parking_lot.workspace = true
# The text driver's clients cancel their runs and drop their turns.
tokio-util = "0.7"

[lints]
workspace = true
