[package]
name = "lk-agents-fuzz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The voice behavioural suite: one harness and one runner for every contract, and a generator
# drawn from the production vocabulary (`#[derive(Vocabulary)]` on the driver's boundary enums).
# A library so the fuzz target and the supervised campaign (`run.py`) share the runner.
# The strategy it implements: ../lk-agents-voice/TEST_STRATEGY.md; the layout is in src/lib.rs.
[lib]
doctest = false

[dependencies]
lk-agents-voice = { path = "../lk-agents-voice", default-features = false, features = ["dst"] }
lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-core = { path = "../lk-agents-core" }
# The recorder trait the recorder fake implements, and the video frame type the video input
# fake's signature names. Both already come in through lk-agents-voice.
lk-agents-media = { path = "../lk-agents-media" }
lk-agents-test-support = { path = "../lk-agents-test-support" }
lk-agents-runtime = { path = "../lk-agents-runtime", default-features = false }
# The avatar fake's video frames hold their tag as shared bytes.
bytes = "1"
# The realtime fake runs the production native session (its wire machine, reconnects and all)
# over a socket whose far end is the simulated OpenAI Realtime server.
lk-agents-inference = { path = "../lk-agents-inference", default-features = false }
lk-agents-net = { path = "../lk-agents-net" }
base64.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }
prost.workspace = true
async-trait.workspace = true
serde_json.workspace = true
fastrand = "2"
livekit-protocol.workspace = true
a2a.workspace = true
