[package]
autotests = false
name = "lk-agents-fuzz"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The voice behavioural suite: one harness and one runner for every contract, and a generator
# drawn from the production vocabulary (`#[derive(Vocabulary)]` on the driver's boundary enums).
# A library so regression tests and voice campaigns share the same runner and fake room.
# See README.md for the layout and ../lk-agents-voice/TEST_STRATEGY.md for the strategy.
[lib]
doctest = false

[dependencies]
lk-agents-voice = { path = "../lk-agents-voice", default-features = false }
lk-agents-abi = { path = "../lk-agents-abi" }
lk-agents-core = { path = "../lk-agents-core" }
lk-agents-runtime = { path = "../lk-agents-runtime", default-features = false, features = ["dst"] }
# The avatar fake's video frames hold their tag as shared bytes.
bytes = "1"
tokio = { workspace = true, features = ["test-util", "io-util"] }
prost.workspace = true
serde_json.workspace = true
fastrand = "2"

[[test]]
name = "build_registration"
path = "build_registration.rs"

[[test]]
name = "pos"
path = "src/pos_tests.rs"

[[test]]
name = "soak"
path = "src/soak_tests.rs"

[[test]]
name = "survey"
path = "src/survey_tests.rs"

[[test]]
name = "regressions"
path = "src/regressions_tests.rs"
