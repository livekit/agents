[package]
autotests = false
name = "lk-agents-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# All database interaction: the AgentDB and local SQLite backends, the thread tables,
# statements, fencing and leases. Every failure is a typed `StorageError`.

[lib]
# The crate's docs hold no Rust doctests.
doctest = false

[dependencies]
# `#[table]` (host-derive `table.rs`): each row record's `COLUMNS`/`SELECT`.
lk-agents-host-derive = { path = "../../ai_slop/lk-agents-host-derive" }
# `StorageError` and the host-visible rows, declared with the host vocabulary.
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
# Owned renewal tasks, and the HTTP transport, WebSocket and SSE decoder AgentDB reaches the
# network through.
lk-agents-net = { path = "../lk-agents-net" }
# Health metrics: lanes held by a dead owner, stuck waits, unresolved writes.
lk-agents-telemetry = { path = "../lk-agents-telemetry" }
parking_lot.workspace = true
# The chat items and the thread schema: `livekit.agent` records; threads through the Cloud API.
livekit-protocol.workspace = true
livekit-api.workspace = true
pbjson-types.workspace = true
prost.workspace = true
a2a.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
thiserror.workspace = true
log.workspace = true
async-trait.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
bytes = "1"
url = "2"
base64.workspace = true
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
percent-encoding = "2"
# Local storage: thread files and the registry; `unixepoch()` reads the injected clock.
rusqlite = { version = "0.32.1", features = ["bundled", "hooks", "functions"] }


[features]
# `testing`: the contract fixtures over both backends and a fault-injecting connection.
testing = []

[dev-dependencies]
lk-agents-storage = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "test-util"] }
httparse = "1"
# The fake AgentDB server's side of the data plane.
tokio-tungstenite = { version = "0.30", default-features = false }

[lints]
workspace = true
