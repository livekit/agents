[package]
name = "lk-agents-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The thread storage core: the thread tables as `#[derive(Host)]` records, every statement a
# thread database sees as a plan, task transitions, fencing and lease decisions. Synchronous and
# host-neutral; `lk-agents-runtime::storage` executes it against AgentDB and local SQLite.

[lib]
# The `///` docs on the records are the generated pydantic models' docstrings; no Rust doctests.
doctest = false

[dependencies]
# `Host` for the row records, so their pydantic twins come from `lk-agents-codegen`, and their
# `COLUMNS`/`SELECT` from `#[table]` (host-derive `table.rs`).
lk-agents-host-derive = { path = "../lk-agents-host-derive" }
# `StorageError`, declared with the host vocabulary where every exported type lives.
lk-agents-abi = { path = "../lk-agents-abi" }
# The chat items and the thread schema: `livekit.agent` records only.
livekit-protocol.workspace = true
pbjson-types.workspace = true
a2a.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
# The `sqlite` feature: statements executed on a caller-owned connection (the local backend's
# files, the simulation's in-memory database).
rusqlite = { version = "0.32.1", features = ["bundled"], optional = true }

[features]
sqlite = ["dep:rusqlite"]

# `#[derive(Host)]` on a unit enum expands its pyo3 conversions under `cfg(feature = "python")`,
# a feature this crate does not have (it is host-neutral): name the value so check-cfg does not
# warn on every such enum.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("python"))'] }

[dev-dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
