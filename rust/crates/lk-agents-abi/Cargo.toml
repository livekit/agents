[package]
name = "lk-agents-abi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Host-neutral export declarations and boundary records. Remaining executor and Python
# dependencies belong to the legacy clock, stream, and host bridges pending their extraction.
[lib]
# The `///` docs on the `#[derive(Host)]` records are the reference's Python docstrings, verbatim,
# because the generator emits them into the Python package. Their indented examples are Python,
# which rustdoc would otherwise compile as Rust. The crate has no Rust doctests.
doctest = false

[dependencies]
livekit-protocol.workspace = true
# The A2A messages and artifacts the typed task records keep (`storage::thread`).
a2a.workspace = true
pbjson-types.workspace = true
# Expands to nothing. It exists so `#[host(..)]` is legal Rust; see `voice/mod.rs`.
lk-agents-host-derive = { path = "../lk-agents-host-derive" }
# `extra` is JSON, not an opaque host payload: the reference reads it for control flow and
# `_provider_format` serialises it onto the wire.
#
# `preserve_order` is required, not an optimisation: `to_dict` reproduces pydantic's *declaration*
# order and `extra` round-trips the host's dict order, and without this feature `Map` is a
# `BTreeMap` that silently sorts both. Named here rather than inherited from whichever crates
# happen to be in the build graph, because `cargo test -p lk-agents-abi` resolves features on its
# own -- the same trap `lk-agents-py`'s manifest writes down.
#
# `to_dict` is a hand-written projection that reproduces pydantic's declaration order and
# `exclude_none` rules -- a `#[derive(Serialize)]` on `ChatItem` would produce a *different*,
# plausible-looking JSON that nothing gates, which is the whole hazard.
# `serde_json::Value` is the output type; no `to_dict` type derives serde.
serde_json = { workspace = true, features = ["preserve_order"] }
# Report admission counts serialized bytes without retaining an unbounded temporary. The
# `serde` feature separately enables derives on the voice command and journal records.
serde.workspace = true
indexmap.workspace = true
thiserror.workspace = true
# Legacy realtime, tool and shutdown adapters report failures through the host logger.
log.workspace = true
# Legacy clocks, task ownership, queues, stream teardown and realtime notifications still use
# `sync` and `time`; their implementations move with the host and runtime service extraction.
tokio = { workspace = true, features = ["sync", "time"] }
# `python` only: the runtime the in-place bindings expand against (`src/python.rs`). Without the
# feature this crate has no pyo3.
pyo3 = { workspace = true, optional = true }
inventory.workspace = true
# `python` only: the host bridge (`src/python/bridge.rs`) awaits host coroutines on their own loop
# (`TaskLocals`, `into_future_with_locals`). Literal version: pyo3's own companion, not advertised
# in the workspace table.
pyo3-async-runtimes = { version = "0.29", optional = true }
# The legacy Python value bridge decodes tagged byte leaves.
base64 = { workspace = true, optional = true }
# `utils::dates`: `datetime.date`/`time` validation, `strftime` and the civil calendar. Already in
# the build graph (pbjson-types, rmcp); no `clock`, the wall clock is `Clock::wall()`.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# `VideoFrame.data`: a frame's buffer shared, not copied, as it moves through the core.
bytes = "1"

[features]
# The Python runtime (`lk_agents_abi::python`): the registration table, the fork guard, the error
# dispatch. Enabled through a core crate's own `python` feature, by `lk-agents-py` only.
# `multiple-pymethods`: a class's generated `#[pymethods]` block (`#[host(object)]`) and the
# hand-written methods beside it that no declaration expresses (a getter building host objects).
python = ["dep:pyo3", "pyo3/multiple-pymethods", "dep:pyo3-async-runtimes", "dep:base64"]
# See the `serde` dependency's note: the derive on the plain enums the voice core carries.
serde = []
# The zeroed metrics records tests fill in field by field (`metrics::testkit`).
testkit = []

[dev-dependencies]
lk-agents-test-support = { path = "../lk-agents-test-support" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "test-util"] }
