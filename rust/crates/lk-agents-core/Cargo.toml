[package]
autotests = false
name = "lk-agents-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shared agent execution core (docs/internals/rust-core.md "Agent execution"): `AgentRun`, the
# tool/approval/output decisions and the outcome table that direct runs, TextSession and
# VoiceSession compose, and the A2A task decisions (`a2a`). Synchronous and pure: no runtime,
# executor, Tokio, futures or pyo3.

[lib]
doctest = false

[dependencies]
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde"] }
# `preserve_order`: a tool schema's property order decides which parameter takes an answer
# (`InputRequired(tool=)`), and history JSON round-trips the host's key order.
serde_json = { workspace = true, features = ["preserve_order"] }
serde.workspace = true

regex = "1.13.1"
# Tool discovery's keyword patterns: Python `re` semantics (backreferences, lookaround).
fancy-regex = "0.19.0"
log.workspace = true
base64.workspace = true
# Report and Langfuse timestamps. No `clock`: time is an input.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
thiserror.workspace = true

[dev-dependencies]
lk-agents-abi = { path = "../lk-agents-abi", features = ["serde", "testkit"] }

[[test]]
name = "a2a"
path = "src/a2a_tests.rs"
