[package]
name = "lk-agents-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# No executor or transport: the sans-I/O crates depend on it.
[lib]
doctest = false

[dependencies]
lk-agents-abi = { path = "../lk-agents-abi" }
parking_lot.workspace = true
# The process tracer's seed (`random_seed`); the DST seeds its own.
rand = "0.9"

[dev-dependencies]
lk-agents-abi = { path = "../lk-agents-abi", features = ["testkit"] }
