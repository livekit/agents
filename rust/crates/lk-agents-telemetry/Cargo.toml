[package]
name = "lk-agents-telemetry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Telemetry's recording (docs/internals/telemetry.md "Span API"): the spans sans-I/O machines own
# through their `Trace`, and the spans, events and measurements of async work under the process
# `Tracer`. Spans are declared in lk-agents-abi; lk-agents-net's `export` sends what they record.
# No executor or transport: the sans-I/O crates depend on it.
[lib]
doctest = false

[dependencies]
lk-agents-abi = { path = "../lk-agents-abi" }
parking_lot.workspace = true
# The process tracer's seed (`random_seed`); the DST seeds its own.
rand = "0.9"

[dev-dependencies]
lk-agents-abi = { path = "../lk-agents-abi", features = ["testkit"] }
