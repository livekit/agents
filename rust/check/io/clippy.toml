# The I/O policy for the crates that run beside the host.

# Tests may unwrap, print and debug (AGENTS.md "Idiomatic Rust").
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

disallowed-types = [
  { path = "std::sync::Mutex", reason = "Use parking_lot::Mutex: it does not poison." },
  { path = "std::sync::RwLock", reason = "Use parking_lot::RwLock: it does not poison." },
  { path = "tokio::fs::File", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::OpenOptions", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::DirBuilder", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::ReadDir", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::sync::Notify", reason = "A waiter on a Notify is woken only if someone remembers to: wait on lk_agents_net::signal, whose producer's drop resolves every waiter." },
  { path = "futures_util::future::Shared", reason = "A wake that lands while another waiter polls is lost: share work through lk_agents_net::signal::Shared, its driver a task its executor polls again." },
  { path = "futures::future::Shared", reason = "A wake that lands while another waiter polls is lost: share work through lk_agents_net::signal::Shared, its driver a task its executor polls again." },
]

# No Tokio blocking pool: blocking work runs on our pools (lk_agents_media::pool::media_pool,
# lk_agents_net::blocking_io), names resolve through lk_agents_net::dns.
disallowed-methods = [
  { path = "tokio::sync::watch::channel", reason = "A watch's sender can outlive its producer: use lk_agents_net::signal, whose Producer is the only writer and ends the signal on drop." },
  { path = "tokio::sync::watch::Sender::new", reason = "A watch's sender can outlive its producer: use lk_agents_net::signal, whose Producer is the only writer and ends the signal on drop." },
  { path = "tokio::task::spawn_blocking", reason = "Run blocking work on lk_agents_net::blocking_io or the media pool." },
  { path = "tokio::runtime::Handle::spawn_blocking", reason = "Run blocking work on lk_agents_net::blocking_io or the media pool." },
  { path = "tokio::runtime::Runtime::spawn_blocking", reason = "Run blocking work on lk_agents_net::blocking_io or the media pool." },
  { path = "tokio::task::JoinSet::spawn_blocking", reason = "Run blocking work on lk_agents_net::blocking_io or the media pool." },
  { path = "tokio::task::block_in_place", reason = "Run blocking work on lk_agents_net::blocking_io or the media pool." },
  { path = "tokio::net::lookup_host", reason = "Resolve with lk_agents_net::dns::lookup (the blocking I/O pool)." },
  { path = "tokio_tungstenite::connect_async", reason = "It resolves on Tokio's blocking pool: use lk_agents_net::websocket::connect_with_limit." },
  { path = "tokio_tungstenite::connect_async_with_config", reason = "It resolves on Tokio's blocking pool: use lk_agents_net::websocket::connect_with_limit." },
  { path = "tokio_tungstenite::connect_async_tls_with_config", reason = "It resolves on Tokio's blocking pool: use lk_agents_net::websocket::connect_with_limit." },
  { path = "tokio::fs::canonicalize", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::copy", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::create_dir", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::create_dir_all", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::hard_link", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::metadata", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::read", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::read_dir", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::read_link", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::read_to_string", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::remove_dir", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::remove_dir_all", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::remove_file", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::rename", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::set_permissions", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::symlink_metadata", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::try_exists", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
  { path = "tokio::fs::write", reason = "Tokio's files run on its blocking pool: use std::fs on lk_agents_net::blocking_io." },
]
