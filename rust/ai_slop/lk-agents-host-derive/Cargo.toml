[package]
name = "lk-agents-host-derive"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Makes `#[host(..)]` legal Rust. The generator reads the attributes; this crate only lets rustc see them."

[lib]
proc-macro = true

[dependencies]
# `Vocabulary` is a real derive: it needs the enum's variant names. `host` parses a whole item --
# struct, fn, const, trait -- which is what `full` is for.
syn = { version = "2", default-features = false, features = ["derive", "full", "parsing", "printing", "proc-macro"] }
quote = "1"
proc-macro2 = "1"
# The attribute language, and the `host_kind` a declared error carries.
lk-agents-bindgen = { path = "../lk-agents-bindgen" }
