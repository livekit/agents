[package]
name = "lk-agents-bindgen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `#[host(..)]` attribute language, read once for the proc macros and the generator."

# A plain library, not a proc-macro: `lk-agents-host-derive` calls it at expansion time, and the
# codegen binary reads the attribute language through the same reader (`meta`). A proc-macro crate
# can export nothing but macros, so the shared half has to live here.
[dependencies]
syn = { version = "2", default-features = false, features = ["derive", "full", "parsing", "printing", "clone-impls"] }
quote = "1"
proc-macro2 = "1"
