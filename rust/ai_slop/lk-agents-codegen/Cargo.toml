[package]
name = "lk-agents-codegen"
default-run = "lk-agents-codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reads the `#[derive(Host)]` declarations and writes every host's view of them."

[[bin]]
name = "lk-agents-codegen"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "parsing", "printing", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# The attribute reader: one parse of the language, shared with the expansions.
lk-agents-bindgen = { path = "../lk-agents-bindgen" }

[[example]]
name = "architecture-fixtures"
path = "../../architecture/fixtures.rs"

[[example]]
name = "io-fixtures"
path = "../../architecture/io/fixtures.rs"

[dev-dependencies]
tokio.workspace = true
futures = "0.3"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
