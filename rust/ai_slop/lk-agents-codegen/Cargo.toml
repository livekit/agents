[package]
name = "lk-agents-codegen"
default-run = "lk-agents-codegen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Resolves ABI declarations and writes language bindings."

[[bin]]
name = "lk-agents-codegen"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits", "parsing", "printing", "visit", "visit-mut"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# `preserve_order`: the generated JSON and Weaver files keep their declared key order.
serde_json = { workspace = true, features = ["preserve_order"] }
# The attribute reader: one parse of the language, shared with the expansions.
lk-agents-bindgen = { path = "../lk-agents-bindgen" }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
