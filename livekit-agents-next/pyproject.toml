# The wheel is built by maturin and carries the Python package together with `livekit.agents._core`,
# the pyo3 extension from `rust/crates/lk-agents-py` (plan 13.1: one wheel). `uv sync` builds it
# through PEP 517 (a Rust toolchain is required); `cache-keys` below rebuilds the editable install
# when a Rust source changes, not only when this file does.
[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "livekit-agents-next"
version = "2.0.0b1"
description = "LiveKit Agents over the Rust core: the developer surface, the session run by `_core`"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
authors = [{ name = "LiveKit", email = "hello@livekit.io" }]
keywords = ["webrtc", "realtime", "audio", "video", "livekit", "agents", "AI"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "certifi>=2025.6.15",
    "livekit==1.1.20",
    "livekit-api>=1.2.0,<2",
    "livekit-local-inference>=0.2.7",
    "livekit-protocol>=1.1.21,<2",
    "protobuf>=3",
    "psutil>=7.0",
    "aiohttp~=3.10",
    "typing-extensions>=4.12",
    "docstring_parser>=0.16",
    "numpy>=1.26.0",
    "pydantic>=2.5,<3",
    "opentelemetry-api>=1.45,<1.46",
    "prometheus-client>=0.22",
    # Python HTTP adapters use httpx2, matching the MCP 2 SDK.
    "httpx2>=2.12,<3",
    "aiofiles>=24",
    # Python serves ASGI over the worker's byte streams.
    "starlette>=0.40",
    "h11>=0.16,<0.17",
    "wsproto>=1.3,<2",
    # the text door, its client and the delegate speak A2A
    "a2a-sdk>=1.1.2,<2",
]

