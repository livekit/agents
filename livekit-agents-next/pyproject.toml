[project.urls]
Documentation = "https://docs.livekit.io"
Website = "https://livekit.io/"
Source = "https://github.com/livekit/agents"

[tool.maturin]
# Keep uv's editable builds on the same development profile as `make build`.
editable-profile = "dev"
module-name = "livekit.agents._core"
python-source = "."
manifest-path = "../rust/crates/lk-agents-py/Cargo.toml"
# abi3: one wheel per platform for every Python from 3.11 (the stable buffer protocol API).
# ffmpeg: the core decodes mp3, ogg/opus, aac and flac (AudioStreamDecoder, AudioEmitter)
features = ["pyo3/extension-module", "pyo3/abi3-py311", "ffmpeg"]
include = [
    { path = "livekit/agents/resources/*", format = "wheel" },
]
exclude = [
    { path = "**/__pycache__/**", format = "wheel" },
    { path = "**/*.pyc", format = "wheel" },
]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../.cargo/config.toml" },
    { file = "../rust/Cargo.toml" },
    { file = "../rust/Cargo.lock" },
    { file = "../rust/crates/**/Cargo.toml" },
    { file = "../rust/crates/**/*.rs" },
    { file = "../rust/crates/lk-agents-media/csrc/**" },
    { file = "../rust/crates/lk-agents-media/vendor/*.pin" },
]
exclude-newer = "7 days"
exclude-newer-package = { livekit = "0 days", livekit-api = "0 days", livekit-protocol = "0 days" }
