[package]
name = "lk-agents-bench-steps"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Measurement needs real clocks; keep them outside the subject cores and their purity policy.
# An independent tooling workspace avoids changing the concurrently maintained Rust workspace.
[workspace]

[dependencies]
lk-agents-abi = { path = "../../../../rust/crates/lk-agents-abi" }
lk-agents-voice = { path = "../../../../rust/crates/lk-agents-voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
