[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-qwen"
dynamic = ["version"]
description = "LiveKit Agents plugin for Qwen models on Alibaba Cloud Model Studio: realtime STT, TTS and LLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "LiveKit", email = "hello@livekit.io" }]
keywords = ["voice", "ai", "realtime", "audio", "livekit", "qwen", "alibaba", "dashscope", "stt", "tts"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "livekit-agents[openai]>=1.8.1",
]

[project.urls]
Documentation = "https://docs.livekit.io"
Website = "https://www.alibabacloud.com/en/product/modelstudio"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/qwen/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
