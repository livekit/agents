[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-nabrah"
dynamic = ["version"]
dependencies = [
    "livekit-agents>=1.5.0",
    "aiohttp"
]

[tool.hatch.version]
path = "livekit/plugins/nabrah/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
