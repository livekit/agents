[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-addisai"
dynamic = ["version"]
description = "AddisAI STT and TTS plugin for LiveKit Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "Addis AI" }]
keywords = [
    "voice",
    "ai",
    "audio",
    "livekit",
    "addisai",
    "amharic",
    "afaan-oromo",
    "stt",
    "tts",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["aiohttp>=3.10", "livekit-agents[codecs]>=1.6.8"]

[project.urls]
Documentation = "https://docs.addisassistant.com/"
Website = "https://addisassistant.com/"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/addisai/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
