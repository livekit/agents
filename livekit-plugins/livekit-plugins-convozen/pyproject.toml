[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-convozen"
dynamic = ["version"]
description = "LiveKit Agents plugin for ConvoZen — Akshara STT & Ragini TTS for Indian languages"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "LiveKit", email = "support@livekit.io" }]
keywords = [
    "webrtc",
    "realtime",
    "audio",
    "livekit",
    "livekit-agents",
    "convozen",
    "akshara",
    "ragini",
    "indian-languages",
    "indic",
    "stt",
    "tts",
    "speech-to-text",
    "text-to-speech",
    "multilingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# [codecs] is required: Ragini returns a RIFF/WAV container, which AudioEmitter
# decodes with AudioStreamDecoder rather than the plugin parsing headers itself.
dependencies = ["livekit-agents[codecs]>=1.8.2"]

[project.urls]
Homepage = "https://convozen.ai"
Documentation = "https://docs.livekit.io"
Website = "https://livekit.io/"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/convozen/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
