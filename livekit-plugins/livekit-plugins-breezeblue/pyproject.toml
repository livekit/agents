[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-breezeblue"
dynamic = ["version"]
description = "LiveKit Agents plugin for BreezeBlue text-to-speech."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
keywords = ["audio", "breezeblue", "livekit", "text-to-speech", "tts"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "livekit-agents>=1.8.13",
    "aiohttp>=3.11",
    "async-timeout>=5",
]

[project.urls]
Documentation = "https://docs.breezeblue.ai/"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/breezeblue/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
