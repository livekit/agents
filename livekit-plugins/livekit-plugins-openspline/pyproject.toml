[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-openspline"
dynamic = ["version"]
description = "OpenSpline avatar plugin for LiveKit Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
dependencies = ["openspline>=0.1.2,<0.2", "livekit-agents>=1.8.9", "livekit-api>=1.2.1,<2"]

[project.urls]
Documentation = "https://docs.openspline.dev/connectors/livekit"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/openspline/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]
