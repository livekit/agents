[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-plugins-alkove"
dynamic = ["version"]
description = "Agent Framework plugin for Alkove: voice isolation (Focus) and VAD (Cue), self-hosted"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10.0"
authors = [{ name = "Eddy Bordi" }]
keywords = [
    "voice",
    "ai",
    "realtime",
    "audio",
    "livekit",
    "webrtc",
    "noise-cancellation",
    "voice-isolation",
    "vad",
    "alkove",
]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["livekit-agents>=1.8.8", "alkove>=0.3.1,<0.4", "numpy>=1.26"]

[project.urls]
Documentation = "https://alkove.ai/docs"
Website = "https://alkove.ai"
Source = "https://github.com/livekit/agents"

[tool.hatch.version]
path = "livekit/plugins/alkove/version.py"

[tool.hatch.build.targets.wheel]
packages = ["livekit"]

[tool.hatch.build.targets.sdist]
include = ["/livekit"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { livekit-agents = "0 days" }
