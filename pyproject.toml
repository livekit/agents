[tool.uv]
default-groups = ["dev", "typing"]
# Universal resolution only checks that a wheel exists for the Python version.
# A release that publishes wheels for one platform and no sdist (bithuman 2.12.2
# is win_amd64-only) would otherwise lock and then fail `uv sync` on the others.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

