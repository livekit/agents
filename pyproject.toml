[tool.ruff]
line-length = 100
# `tests` and `tests_new` sit under python/ and import as first-party packages.
src = [".", "python"]
target-version = "py311"
# `_generated` is written by `cargo run -p lk-agents-codegen -- --write` (in `rust/`): generator
# output is not hand-formatted, and a lint finding there is fixed in the generator, not the file.
exclude = [".github", "python/livekit-agents/livekit/agents/_generated"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "RUF006", # asyncio-dangling-task: the event loop only weakly references a bare task
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A public module star-imports the names the ABI places in it (`_generated/public_<module>.py`) and
# lists them in its `__all__`; mypy and pyright resolve every name, so pyflakes' star guess is noise.
"python/livekit-agents/livekit/agents/**/*.py" = ["F405"]
# The CLI is mid-refactor in the owner's session; its one `asyncio.TimeoutError` goes with it.
"python/livekit-agents/livekit/agents/cli.py" = ["UP041"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["livekit"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--import-mode=importlib",
    "--ignore=python/examples",
]
pythonpath = [".", "python"]
testpaths = ["python/tests"]
# a hung test fails instead of stalling the run (pytest-timeout); slow suites override per test
timeout = 120
markers = [
    "unit: fast tests with no external providers (select with --unit)",
    "audio_eot: hermetic audio end-of-turn / turn-detection tests (select with --audio_eot)",
    "plugin(name): provider integration test for `name` (select with --plugin [name])",
    "realtime(name): realtime-model test, optionally for provider `name` (--realtime [name])",
    "stt(name): speech-to-text test, optionally for provider `name` (--stt [name])",
    "evals: behavioral evals run against the LiveKit inference gateway (--evals)",
    "docs: tests for the docs-build tooling under .github/ (select with --docs)",
    "e2e: real process and transport journeys, requires live services (select with --e2e)",
]


[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/.type_stubs:$MYPY_CONFIG_FILE_DIR/python"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.genai"
follow_imports = "normal"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "boto3"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "aws_sdk_bedrock_runtime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aws_sdk_transcribe_streaming.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "smithy_aws_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "smithy_core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "smithy_http.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "smithy_aws_event_stream.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mistralai.*"
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "speechmatics.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = "bithuman.*"
follow_untyped_imports = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "livekit.plugins"
follow_untyped_imports = true

[tool.pyright]
stubPath = ".type_stubs"
# Strict where code is written as a user writes it: user code passes mypy strict and pyright
# (docs/README.md). The library itself is held to mypy strict; pyright's strict-only rules
# (cross-module private names, unknown types from untyped SDKs) add no check of its API there.
typeCheckingMode = "standard"
strict = ["python/examples", "python/tests/type_checks"]
pythonVersion = "3.11"
executionEnvironments = [
    { root = "python/examples/airline-support", extraPaths = ["python/examples/airline-support"] },
    { root = "python/examples/frontdesk", extraPaths = ["python/examples/frontdesk"] },
    { root = "python/examples/hotel-receptionist", extraPaths = ["python/examples/hotel-receptionist"] },
    { root = "python/examples/livekit-expert", extraPaths = ["python/examples/livekit-expert"] },
    { root = "." },
]
