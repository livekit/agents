[project]
name = "livekit-example-voice-agents"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[openai,cartesia,elevenlabs,deepgram,silero,turn-detector,mcp]>=1.6",
    "python-dotenv>=1.0",
    "duckduckgo-search>=8.0",
]

[tool.uv]
# an example is a script collection, not an installable distribution
package = false

[tool.uv.sources]
livekit-agents = { workspace = true }
