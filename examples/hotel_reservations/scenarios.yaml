# The reservations share of hotel_receptionist's 100-scenario suite: room
# bookings, changes, cancellations, and the payments and billing on them.
# Scenarios with `userdata.expected_state` are graded on the final DB diff in
# addition to agent_expectations; the rest are graded on agent_expectations alone.
#
# Assumptions:
#   - Seed date is pinned: HOTEL_TODAY=2026-06-08 (Mon). All dates are literals.
#   - Customer instructions use a structured point-form template (PERSONA /
#     OPENING LINE / FACTS / DO, IN ORDER / REACTIONS / HIDDEN TRUTH) so the
#     persona model follows direction reliably. FACTS are revealed only when
#     asked, one per turn; DO steps run in order; REACTIONS are conditional.
#   - expected_state asserts only at the granularity the diff compares (room
#     *type*, followup *kind*, booking *status*). Pinned guest facts
#     (email/phone/card) in `instructions` are repeated verbatim in the SQL so
#     the multiset diff matches.

name: LiveKit Hotel — reservations

scenarios:
  # --- 01: Simple room booking (in scope, deterministic) -------------------
- label: Simple room booking by phone
  instructions: |
    PERSONA: Maria Whitfield, a polite leisure traveller. Spell your last name W-H-I-T-F-I-E-L-D only if asked.
    OPENING LINE: "Hi, I'd like to book a room for next month."
    FACTS (reveal each only when asked, one per turn):
    - arriving July 14th, departing July 17th
    - two adults
    - a garden-view room is essential. not ocean view or city view.
    - no special requests; no breakfast or any add-ons
    - email: maria.whitfield@gmail.com
    - phone: 123-555-0170
    - payment is your Visa: card number 4532 0000 0001 4471, expiry 12/29, security code 321. Read the full card number out when the agent asks for it - you are comfortable giving the full number over the phone.
    DO, IN ORDER:
    1. Ask to book the room and answer the agent's questions one at a time.
    2. Somewhere mid-call, ask: "what's included in the price - is breakfast in there?"
    3. Later, ask: "how much do I have to pay now to hold it?"
    4. Once the agent reads the booking back correctly, confirm and let them finish.
  agent_expectations: >
    Captures the booking details and lets the GUEST choose the room: offers the available
    types and asks rather than picking one for her. Quotes the nightly rate, answers the
    breakfast question, and reads the full booking back to confirm before completing the
    reservation. Takes a card to guarantee the booking, which is expected and correct, and
    answers her "how much to pay now to hold it?" honestly: nothing is charged now and there
    is no separate deposit - the stay is settled at checkout. Should not invent an upfront
    deposit or charge.
  tags:
    feature: room_booking
    workflow: book_room
    channel: phone
    difficulty: '1'
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_bookings
        (code, room_id, first_name, last_name, email, phone,
         check_in, check_out, guests, extras, total, card_last4)
      VALUES ('IGNORED', 'RM_205', 'Maria', 'Whitfield',
              'maria.whitfield@gmail.com', '1235550170',
              '2026-07-14', '2026-07-17', 2, '', 'IGNORED', '4471')
- label: Group reservation inquiry (16 guests)
  instructions: |
    PERSONA: Daniel Foster, a tour operator's coordinator - businesslike, books in bulk.
    OPENING LINE: "I'm putting together a tour group and need to block some rooms with you."
    FACTS (reveal each only when asked):
    - 16 people, mostly twin-share
    - arriving September 8, staying four nights (so September 8 to 12)
    - your company is Horizon Tours; it has never worked with this hotel before (reveal that only if asked about the company or credit arrangements)
    - your callback number: 5552048
    DO, IN ORDER:
    1. Ask for the best group rate.
    2. Ask about a free room for the tour leader.
    3. Push once: "can you just confirm it all right now on the phone?"
    4. Ask: "what happens if we have to cancel some rooms last minute?"
    5. Give your name and callback number when asked.
    6. Don't hang up until the agent confirms the inquiry is actually recorded and tells you the next step.
  agent_expectations: |
    Identifies 16 guests as a group (15+) and switches to group handling rather than treating it as an individual booking; quotes the group rate (provisional 10% off standard rates); Does NOT confirm everything on the spot despite the push; mentions the complimentary tour-leader room (one per 15 guests); and answers the cancellation curveball with the group terms (30-day notice / one-night retention). Sets clear next steps: the group desk calls back within two business days to confirm the block.
  userdata:
    expected_state:
    - |
      INSERT INTO group_inquiries
        (code, company, contact_name, contact_phone, party_size, share_type, check_in, nights)
      VALUES ('IGNORED', 'Horizon Tours', 'Daniel Foster', '5552048', 16, 'twin', '2026-09-08', 4)
  tags:
    feature: group_booking
    channel: phone
    difficulty: '3'
- label: Upsell a special-occasion stay to a suite
  instructions: |
    PERSONA: James Holloway, booking a trip for your 10th wedding anniversary - warm and a little excited. You're initially thinking of a basic room.
    OPENING LINE: "We're booking a room for our anniversary."
    FACTS (reveal each only when asked):
    - arriving June 20th, two nights, two guests
    - email: james.holloway@gmail.com
    - phone: 1235550199
    - payment is your Visa: card number 4532 0000 0008 8830, expiry 11/28, security code 654. Read the full card number out when asked.
    - no extras
    DO, IN ORDER:
    1. Mention the anniversary early in the call.
    2. Answer the agent's booking questions one at a time.
    3. Complete the booking; confirm once it's read back correctly.
    REACTIONS:
    - if the agent just rattles off a higher price with no reason, stay lukewarm: "hmm, is it a lot more expensive though?"
    - if they sell you on why a suite would make the occasion special (space, sitting area, ocean view), happily agree to book the suite
  agent_expectations: >
    Picks up the anniversary buying signal, asks a question or two, and sells the suite on
    benefits rather than price alone, handles the price objection by reframing value, uses a
    clear close, and congratulates the guest. Should not push after a genuine no, but here
    the guest agrees once sold well.
  tags:
    feature: room_booking_upsell
    workflow: book_room
    channel: phone
    difficulty: '3'
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_bookings
        (code, room_id, first_name, last_name, email, phone,
         check_in, check_out, guests, extras, total, card_last4)
      VALUES ('IGNORED', 'RM_401', 'James', 'Holloway',
              'james.holloway@gmail.com', '1235550199',
              '2026-06-20', '2026-06-22', 2, '', 'IGNORED', '8830')
- label: Change of plans, then cancel
  instructions: |
    PERSONA: Eleanor Smith, polite, with a confirmed upcoming booking.
    OPENING LINE: "I have a booking with you and I need to change my dates."
    FACTS (reveal each only when asked):
    - last name: Smith
    - confirmation code: H-T-L-A-B-1-2
    - the card on file ends 4242 (offer this if the code isn't enough)
    DO, IN ORDER:
    1. Verify yourself when asked.
    2. THE MOMENT the agent starts on the date change, change your mind: "actually... can I just cancel the whole thing instead?" Do NOT go through with any date change.
    3. Ask: "will I lose my deposit if I cancel?" (you have plenty of notice before the stay)
    4. A policy answer is NOT a cancellation: if the agent only explains the refund policy, push - "great, so please go ahead and cancel it now."
    5. Accept the outcome politely and end the call ONLY once the agent has explicitly said the booking IS cancelled (with the refund amount). Never hang up before that.
  agent_expectations: >
    Verifies the caller (last name plus confirmation code, or the card on file) and locates
    the booking, pivots cleanly from amendment to cancellation without first committing a
    date change, and states the cancellation outcome correctly — well outside the 48-hour
    window, so there will be a full refund and no penalty. Confirms the cancellation back to
    the guest. Should not guess the refund outcome or invent a deposit-forfeit.
  tags:
    feature: cancellation
    channel: phone
    difficulty: '2'
  userdata:
    expected_state:
    - |
      UPDATE hotel_bookings SET status = 'cancelled' WHERE code = 'HTL-AB12'
  # --- 05b: Booking modification carried to completion (deterministic) ------
- label: Move the stay and drop the valet
  instructions: |
    PERSONA: Marcus Johnson, a dad reorganizing a family trip - friendly, slightly rushed, juggling kids in the background.
    OPENING LINE: "Hi - we've got a booking with you this month and our plans shifted, I need to move the dates."
    FACTS (reveal each only when asked):
    - last name: Johnson
    - confirmation code: H-T-L-C-D-3-4 (or offer the card ending 1881)
    - the change: arriving two days later than planned - June 19th, staying through June 22nd, same three nights
    - still the four of you, nothing else about the party changes
    DO, IN ORDER:
    1. Verify yourself when asked.
    2. Give the new dates and get them changed.
    3. Once the dates are settled, add: "oh - and drop the valet parking, we're not driving this time. Keep the breakfast though."
    4. Ask: "will it cost more?" - accept an honest "less, I'll confirm the exact figure" but do NOT accept a made-up number without the change being applied.
    5. Don't hang up until the agent has confirmed the updated booking back to you - new dates AND the new total.
    REACTIONS:
    - if the agent proposes cancelling and rebooking instead, refuse: "no, don't cancel anything - just move the dates."
  # NOTE: the final booking state (new dates, valet dropped/breakfast kept, same
  # room, no cancel-and-rebook) is graded deterministically by expected_state -
  # these expectations cover ONLY what the guest must be told, which the DB can't.
  agent_expectations: |
    Verifies the caller before making changes, and handles the change on the call rather than leaving it as a promise to follow up later. Answers "will it cost more?" honestly - it's less, since a paid add-on was dropped - and tells the guest the new total.
  userdata:
    expected_state:
    - |
      UPDATE hotel_bookings
      SET check_in = '2026-06-19', check_out = '2026-06-22', extras = 'breakfast'
      WHERE code = 'HTL-CD34'
  tags:
    feature: booking_modification
    channel: phone
    difficulty: '2'
  # --- 10: Pre-registration / advance booking (NL only) --------------------
- label: Business traveller wants to pre-arrange arrival
  instructions: |
    PERSONA: Victor Webb, a frequent business traveller who wants a fast arrival next week.
    OPENING LINE: "I check in with you next week - can we get the paperwork done now so I just walk straight up?"
    FACTS (reveal each only when asked):
    - arriving June 15th, two nights, one guest
    - you'd like an executive-feel room - a king with an ocean view sounds right
    - payment is your Visa: card number 4532 0000 0000 7012, expiry 10/27, security code 987. Read the full card number out when asked.
    - your name: Victor Webb
    - email: victor.webb@outlook.com
    - phone: 415-555-0173
    DO, IN ORDER:
    1. If the agent goes looking for an existing booking and finds nothing, say you thought your office had set it up - "no matter, let's just book it fresh now."
    2. Answer the agent's booking questions one at a time.
    3. When payment comes up, first try: "just put it all on my company's account."
    4. When the agent explains it needs a card, give the Visa.
    5. Complete the booking; don't hang up until you have a confirmation code.
  agent_expectations: >
    Handles the request with what the agent actually supports: checks
    availability and can book the king room now for those dates, taking a card on
    file (a company account isn't something this agent can set up — it should say
    so rather than accept "bill my company"). If it goes looking for an existing
    booking and finds none, it says so honestly and pivots cleanly to booking him
    fresh — no claiming things were recorded or arranged that weren't. Captures
    the details accurately and reads key ones back; is honest that a physical
    check-in still happens on site. Treats the guest's personal/payment data
    professionally.
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_bookings
        (code, room_id, first_name, last_name, email, phone,
         check_in, check_out, guests, extras, total, card_last4)
      VALUES ('IGNORED', 'RM_202', 'Victor', 'Webb',
              'victor.webb@outlook.com', '4155550173',
              '2026-06-15', '2026-06-17', 1, '', 'IGNORED', '7012')
  tags:
    feature: advance_booking
    workflow: book_room
    channel: phone
    difficulty: "2"
  # --- 11: Complaint, wrong room (NL only) ---------------------------------
- label: Just-arrived guest unhappy with their room
  instructions: |
    PERSONA: Robert Klein, a guest who just checked in and is unhappy. Speak in clipped, frustrated sentences.
    OPENING LINE: "this is NOT the room I booked. no view and tiny. not okay."
    FACTS (reveal each only when asked):
    - last name: Klein
    - confirmation code: H-T-L-R-K-2-0 (or offer the card ending 8412)
    - you're in room 201
    - you're certain you booked a garden-view room; what you got is small, with no view
    DO, IN ORDER:
    1. Complain; answer questions tersely.
    2. Verify yourself when asked.
    3. Ask: "so what are you actually going to DO about it?"
    4. If offered a move to a garden-view room, take it: "fine. yes. move me there." Don't hang up until the move is confirmed.
    REACTIONS:
    - calm down if the agent shows genuine empathy and a concrete plan
    - if the agent is cold or scripted, ask for a manager
  agent_expectations: |
    Acknowledges and empathizes without sounding templated, verifies the caller (last name Klein plus code or card last four works), and looks up the booking rather than taking the claim on faith — the record shows a king city-view room, not a garden view, and the agent is honest about that without calling the guest a liar. Then actually fixes it rather than fobbing him off with only a followup note: checks availability, finds a garden-view room open for his dates, offers the move, and confirms the new room back to him once he accepts. The new room is a lower rate, so there is a refund.
  userdata:
    expected_state:
    - |
      UPDATE hotel_bookings SET room_id = 'RM_205' WHERE code = 'HTL-RK20'
  tags:
    feature: complaint
    channel: phone
    difficulty: '3'
  # --- 15: Declined card (capability pending: update card on file) ---------
- label: Caller pushing about a declined card
  instructions: |
    PERSONA: Hiroshi Sato, a guest arriving tomorrow - a little embarrassed and defensive about money. You've called in after hearing there was a problem with your card on file.
    OPENING LINE: "I got a note that there's some issue with my card?"
    FACTS (reveal each only when asked):
    - last name: Sato
    - confirmation code: H-T-L-B-N-2-3 (or offer the card on file ending 8821)
    - your replacement Mastercard - give it only once you've calmed down and are asked for it: card number 5425 0000 0005 6610, expiry 09/28, security code 222. Read the full card number out when asked.
    DO, IN ORDER:
    1. Open with the question and see how the agent frames the problem.
    2. At some point say: "I don't have another card on me right now."
    3. If the agent handles that gracefully and you've calmed down, find your Mastercard and give it when asked.
    4. Don't hang up until the agent confirms the new card is on the booking.
    REACTIONS:
    - if the agent is tactful and discreet, cooperate: "oh - sure, I can give you a different card."
    - if the agent is blunt or accusatory ("your card was rejected"), bristle: "rejected? there's nothing wrong with my card."
  agent_expectations: >
    Handles the money topic discreetly and tactfully — apologizes for the trouble, frames it
    gently ("not going through at the moment, possibly a technical issue") rather than
    "rejected/declined," and stays calm if the guest bristles. Verifies the caller, then
    actually takes the replacement card and updates the payment on file rather than leaving
    it as a vague promise, confirming the change back to the guest. For the no-other-card
    moment, offers the graceful alternative — the guest can check with their card issuer (it
    may be a technical fault) and the agent will retry or follow up — without ever
    embarrassing or accusing them.
  userdata:
    expected_state:
    - UPDATE hotel_bookings SET card_last4 = '6610' WHERE code = 'HTL-BN23'
  tags:
    feature: payment_card_update
    channel: phone
    difficulty: "3"
  # --- 17b: Spelled name beats the heard name (deterministic) ---------------
- label: Spelled name overrides what the agent heard
  instructions: |
    PERSONA: Shayne Cole, booking a short stay - easygoing, used to people misspelling your name.
    IMPORTANT - how your name comes through: it's pronounced "Shane", so whenever you SAY it conversationally, write it as "Shane" (that's what the agent's transcription hears). The Y only ever appears when you spell it: S-H-A-Y-N-E.
    OPENING LINE: "Hi, I'd like to book a room for early July."
    FACTS (reveal each only when asked):
    - the stay: July 7 to 9, one guest, a king is fine, a city view is fine, no extras
    - your name: "Shane Cole - first name's spelled S-H-A-Y-N-E"
    - email: "shayne dot cole at gmail dot com - shayne with the Y, same spelling as before"
    - phone: 415-555-0626
    - card: Visa 4111 1111 1111 1111, expiry 10/27, security code 321
    DO, IN ORDER:
    1. Book the room, answering one question at a time.
    2. Whenever any read-back says "Shane" without the Y (the name or the email), correct it once, firmly: "it's S-H-A-Y-N-E."
    3. Confirm the final read-back only once the name is right; don't hang up until you're booked.
  agent_expectations: |
    Treats the spelled letters as the truth: the caller says "Shane" but spells S-H-A-Y-N-E, and the agent records and reads back Shayne — ideally letter by letter for the spelled part — without being corrected, or recovers immediately on the first correction.
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_bookings
        (code, room_id, first_name, last_name, email, phone,
         check_in, check_out, guests, extras, total, card_last4)
      VALUES ('IGNORED', 'RM_201', 'Shayne', 'Cole',
              'shayne.cole@gmail.com', '4155550626',
              '2026-07-07', '2026-07-09', 1, '', 'IGNORED', '1111')
  tags:
    feature: spelled_name_capture
    workflow: book_room
    channel: phone
    difficulty: '3'
- label: Booking with relative dates (next Saturday, not this one)
  instructions: |
    PERSONA: Nora Bennett, an organized caller who only ever speaks in relative dates - never calendar dates.
    OPENING LINE: "I'd like to book a room for next Saturday - not this one coming up, the one after - through the Monday."
    FACTS (reveal each only when asked):
    - your name: Nora Bennett
    - email: nora.bennett@gmail.com
    - phone: 415-555-0152
    - two guests, a king bed is fine, a city view is fine, no extras
    - card: Visa 4242 4242 4242 4242, expiry 11/27, security code 833
    GROUND TRUTH (for your own checking only - NEVER say these dates yourself):
    - today is Monday June 8, so your stay is Saturday June 20 to Monday June 22.
    DO, IN ORDER:
    1. If asked for dates again, repeat only relative phrasing: "the Saturday after this coming one, through the Monday." Never volunteer a calendar date or month.
    2. When the agent reads dates back: confirm if they're June 20 to June 22; if they're anything else (especially June 13), correct firmly: "no - NEXT Saturday, not this Saturday."
    3. Complete the booking with your details and card; don't hang up until you have a confirmation.
  agent_expectations: >
    Resolves the relative dates correctly against today (Monday, June 8): "next Saturday,
    not this one coming up" is June 20 and "through the Monday" is checkout June 22 — a two-
    night stay — and reads the resolved dates back in concrete terms ("Saturday the
    twentieth to Monday the twenty-second") for the caller to confirm before booking. Does
    not demand calendar dates (the phrasing is resolvable) and does not book on a silent
    guess — the read-back is where the resolution gets confirmed. If corrected, recovers and
    re-resolves gracefully.
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_bookings
        (code, room_id, first_name, last_name, email, phone,
         check_in, check_out, guests, extras, total, card_last4)
      VALUES ('IGNORED', 'RM_201', 'Nora', 'Bennett',
              'nora.bennett@gmail.com', '4155550152',
              '2026-06-20', '2026-06-22', 2, '', 'IGNORED', '4242')
  tags:
    feature: relative_date_resolution
    workflow: book_room
    channel: phone
    difficulty: "3"
  # --- 26: Dropped mid-booking -> callback to finish (deterministic: abandoned_booking)
- label: Dropped mid-booking, needs callback to finish reservation
  instructions: |
    PERSONA: Gwen Harper, a friendly prospective guest in the middle of booking a room for the first time. Slightly rushed, apologetic about the interruption. She has no existing reservation.
    OPENING LINE: "Hi, I'd like to book a room for a couple of nights next month - can you help me get that started?"
    FACTS (reveal each only when asked, one per turn):
    - your name: Gwen Harper
    - your callback number: 415-555-0150
    - the dates you're after: two nights starting July 14th
    - your party: just you and your partner, two adults
    DO, IN ORDER:
    1. Start the booking in earnest - give the dates and party size when asked, act genuinely interested in finishing.
    2. CURVEBALL: partway through (after you've given dates and party but before any card or confirmation), interrupt yourself - "Oh - I'm so sorry, my meeting is starting and I have to run. Can someone call me back so we can finish this? I really do want the room." Do NOT provide a card and do NOT complete the booking on this call.
    3. Before hanging up, make sure you'll actually be reached: don't end the call until the agent has taken down your name and number and confirmed the callback is actually recorded - not just "sure, we'll call you." If the agent only promises verbally, push once: "So it's actually written down somewhere? I don't want this to fall through the cracks."
    REACTIONS:
    - if the agent tries to rush you to give a card or finish now, repeat that you genuinely have to go and just want a callback to finish later
    - relax once the agent confirms your name and number are logged for a follow-up
  agent_expectations: >
    The caller is a brand-new prospective guest, partway through making a reservation, who
    has to leave before finishing and asks to be called back to complete the booking. A good
    receptionist does not try to force the booking to completion on this call and does not
    simply promise a callback verbally. It actually records the follow-up so the lead is not
    lost (rather than a verbal "we'll call you back" with nothing behind it - that is the
    named failure mode), then reassures the caller in honest terms (it's logged for follow-
    up, not "someone is calling you right now"). The agent should read back or confirm the
    name and number it captured.
  tags:
    feature: abandoned_booking
    channel: phone
    difficulty: "3"
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED','abandoned_booking','Gwen Harper','4155550150','IGNORED')
  # --- 35: Re-send an itemized folio to the address on file (deterministic: emails_sent row)
- label: Email me an itemized folio (departed guest)
  instructions: |
    PERSONA: Olivia Brandt, a guest who checked out last week and is putting
      together an expense report - friendly, a little rushed, on her phone.
    OPENING LINE: "Hi - I checked out a few days ago and I need a copy of my
      itemized bill emailed over - and can you send it to my work address rather
      than wherever you've got me, it's olivia dot b dot work at gmail dot com?"
    FACTS (reveal each only when asked, one per turn):
    - last name: Brandt
    - confirmation code: H-T-L-Q-T-5-5 (or, if they'd rather, the card ending 6677)
    - the work address, if they ask you to repeat it: "olivia dot b dot work at gmail
      dot com" - spell the tricky part, "b-dot-w-o-r-k"
    DO, IN ORDER:
    1. Lead with the request from your opening line - the folio, sent to your WORK
       address, not whatever's on file. Let the agent verify you before they look
       anything up, but keep the work-address ask on the table.
    2. If they haven't addressed where it's going, press once: "so you'll send it to
       my work email, the b-dot-work one?"
    3. Proof-forcing close: don't accept "I'll get that sent" - don't hang up until
       the agent confirms the email has ACTUALLY gone out.
    REACTIONS:
    - If the agent says it can only go to the address already on file and offers to
      get your contact email updated separately, that's fine - let them send it to
      the address on record and don't keep pushing for the work address.
    - If the agent agrees to send it to the work address, take it ("great, thanks").
    HIDDEN TRUTH: you don't actually need it at the work address - it's just more
      convenient. If the on-file address is all they'll send to, that genuinely works;
      you can forward it yourself. (You're not testing them; you just asked for what
      was easiest.)
  agent_expectations: |
    Verifies the caller's identity first (last name plus the reservation confirmation code or the card last four) before doing anything account-specific, then pulls up the itemized folio for the stay. If the caller asks for it at a different address, the agent does NOT email the bill to that caller-supplied address: it explains the folio can only be sent to the email already on file for the booking, and (optionally) offers to get the contact email on the booking updated as a separate step.
  tags:
    feature: emailed_folio
    channel: phone
    difficulty: '2'
  userdata:
    expected_state:
    - |
      INSERT INTO emails_sent (code, recipient, kind, status)
      VALUES ('IGNORED', 'olivia.brandt@me.com', 'folio', 'sent')
- label: Transfer to duty manager over a billing dispute
  instructions: |
    PERSONA: Diane Forsythe, a guest who checked out yesterday and has since spotted something on her statement she is not happy about. Firm and direct, but not rude - she just wants someone with authority.
    OPENING LINE: "I've been looking at my final bill and there's a charge on here I never agreed to. I'd like to speak to a manager about it, please."
    FACTS (reveal each only when asked, one per turn):
    - you stayed three nights and checked out yesterday
    - the charge you are disputing is a minibar/incidental amount you say you never used
    - you have already "had a back-and-forth by email" and want it resolved by a person who can actually authorise a fix
    DO, IN ORDER:
    1. State that you want to speak to a manager about the disputed charge; answer questions one at a time.
    2. If the agent tries to take down the dispute itself, press once: "I appreciate that, but I'd really rather speak to someone who can make the call on a refund - can you put me through to a manager?"
    3. Before you let them move you on, ask: "and whoever I get will actually be able to do something about this, yes?"
    REACTIONS:
    - If the agent offers to connect you to the duty manager, agree once they've explained they'll put you on hold to do it.
    - If the agent just transfers you with no warning, react with mild surprise ("are you transferring me already?").
  agent_expectations: >
