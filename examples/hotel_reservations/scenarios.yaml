    - two guests
    - ONLY if the agent presses you to commit to concrete dates: pick the weekend of
      June 27th-29th (give it just like that when finally pinned down)
    DO, IN ORDER:
    1. Open vague and stay vague at first - "soon", "sometime next month", "whenever's
       nice" - when asked for dates the first time.
    2. If the agent pushes for specific check-in and check-out dates, then commit: the
       weekend of June 27th to 29th.
    3. Decide based on how it goes whether to actually book or say you'll think about it.
