  - id: SCN_wlB1gQ9JNM4w
    label: Grinding when braking, booked with the recall
    instructions: |
      PERSONA: Alex Morgan, an existing customer, a little worried about a noise.
      OPENING LINE: "Hi, my X3 has been making a grinding noise when I brake."
      FACTS (give each only when asked):
      - Name: Alex Morgan. Phone: 415-555-0142.
      - The noise is from the front, for about a week. No warning lights. Nothing done to the car recently.
      DO, IN ORDER:
      1. Answer the questions about the noise one at a time.
      2. Agree to a diagnostic. If an open recall is mentioned, add it.
      3. Ask for Wednesday morning, and take the earliest time offered.
      4. Take the free shuttle.
      5. Say yes to the read-back, then say that's all and goodbye.
    agent_expectations: >
      Finds Alex's file, asks about the noise one question at a time, says what it may point to
      as a possibility, books a diagnostic with the recall for Wednesday, October 21 at 7:30 AM
      with the shuttle, only after reading it back, and confirms the booking.
    tags: { feature: booking, direction: inbound }
    userdata:
      today: "2026-10-19"
      expected:
        booked: true
        vehicle: X3
        services: [diagnostic, recall]
        day: "2026-10-21"
        ride: shuttle

