[project]
name = "livekit-example-homepage"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=1.6",
    "livekit-plugins-ai-coustics~=0.3",
    "python-dotenv>=1.0.0",
]

[tool.uv]
# an example is a script collection, not an installable distribution
package = false
# No [tool.uv.sources] here: the workspace root repoints the livekit-* deps at
# the in-repo copies for members, and staying free of workspace-only references
# is what lets a copy of this directory resolve on its own, outside the repo.

[tool.pytest.ini_options]
# The fast unit suite runs by default; `pytest -m evals` selects the live evals instead.
addopts = ["-m", "not evals"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Tests import the agent's modules by their top-level names, as `python src/agent.py` does.
pythonpath = ["src"]
markers = [
    "unit: fast, deterministic tests with no external services",
    "evals: live LLM-backed agent behavior evaluations",
]
