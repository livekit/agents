      3. Bone-in wings, if asked. Decline breadsticks.
      4. Name: Chris Patel. Phone: 415-555-0188.
      5. Agree to the read-back only if it has exactly these items, correcting it otherwise, then say goodbye once you have your order number.
    agent_expectations: >
      Captures every item once and keeps the pepperonis at two despite the repeat. Places two large
      pepperonis, a large meat lovers, a dozen hot wings, and two large Cokes at $94.76. Four
      pepperonis is a fail.
    tags: { feature: repeats, direction: inbound }
    userdata:
      expected:
        placed: true
        fulfillment: pickup
        cart:
          - "2 large Pepperoni"
          - "1 large Meat Lovers"
          - "1 dozen Bone-in Wings, hot sauce"
          - "2 large Coke"
        total: "94.76"

