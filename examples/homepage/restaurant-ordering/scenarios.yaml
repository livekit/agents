# Zappi's Pizzeria: fourteen calls in, and ten calls to a customer whose delivery is about to go out.
#
# Calls in start with an empty order. Prices come from src/zappis.json: tax is 9% of the food,
# delivery is $4.99, and an order under $15 has a $2.99 small-order fee. The Buffalo Cauliflower
# is sold out. A large pizza is 14 inches, 8 slices. Wing sauces are hot, mild, BBQ, garlic
# parmesan, lemon pepper, Thai chili peanut, or plain; there's no honey garlic or honey mustard.
# Order numbers start at 215.
#
# Calls out are about order #214: a large pepperoni, a dozen bone-in wings with hot sauce, and a
# large Sprite, going to 300 De Haro St, $49.65 due at the door. Marco, the driver, is about to
# leave with it, about twenty minutes to the door, and found packing it up that the Sprite ran
# out; a large Coke, Diet Coke, or Lemonade is the same price. Breadsticks ($5.99 an order, up to
# two) can still go along. userdata.name is who the order is under; without it, nobody's name is
# known.
#
# userdata.expected is checked against the point of sale's final state by src/simulation.py. To
# drive one by hand: [CALL_DIRECTION=outbound] lk agent debugger start
id: SCNG_Lu9U8hnEIsrT
name: Zappi's Pizzeria
scenarios:
  # ---- calls in ----

  - id: SCN_bwiaUIsCP9rJ
    label: Pickup, pepperoni, wings, and a Coke
    instructions: |
      PERSONA: Sam Carter, ordering dinner for pickup. Friendly and direct.
      OPENING LINE: "Hi, can I get a large pepperoni pizza, a dozen wings with hot sauce, and a large Coke?"
      FACTS (give each only when asked):
      - Bone-in wings, if asked which.
      - Name: Sam Carter. Phone: 415-555-0142.
      DO, IN ORDER:
      1. Decline anything else that's offered. It's for pickup.
      2. Say yes to the read-back if it's right, then say goodbye once you've heard your order number.
    agent_expectations: >
      Takes a pickup order for exactly one large pepperoni, a dozen bone-in wings with hot sauce,
      and a large Coke, reads it back with a total of $44.66 before placing it, and gives the order
      number and pickup time after the caller agrees.
    tags: { feature: ordering, direction: inbound }
    userdata:
      expected:
        placed: true
        fulfillment: pickup
        cart: ["1 large Pepperoni", "1 dozen Bone-in Wings, hot sauce", "1 large Coke"]
        total: "44.66"
        name: Sam Carter
        phone: (415) 555-0142

  - id: SCN_uefyPqoCflz6
    label: Changes the pizza and drops the Coke during the read-back
    instructions: |
      PERSONA: Jordan Lee, in a hurry.
      OPENING LINE: "Large pepperoni, a dozen bone-in wings with hot sauce, and a large Coke, for pickup."
      FACTS (give each only when asked):
      - Name: Jordan Lee. Phone: 415-555-0199.
      DO, IN ORDER:
      1. Decline anything else.
      2. When the order is read back, cut in: "Wait, make the pizza a medium, and drop the Coke."
      3. Agree to the corrected order, then say goodbye once you've heard the order number.
    agent_expectations: >
      Changes the pizza to a medium and takes the Coke off without rebuilding the order, reads
      back the corrected order with a total of $37.04, and places it only after the caller agrees.
      Placing the original order, or placing it before the corrected read-back, is a fail.
    tags: { feature: corrections, direction: inbound }
    userdata:
      expected:
        placed: true
        fulfillment: pickup
        cart: ["1 medium Pepperoni", "1 dozen Bone-in Wings, hot sauce"]
        not_in_cart: [coke]
        total: "37.04"

  - id: SCN_2vb2J3Q6vr0l
    label: Wants the Buffalo Cauliflower, which is sold out
    instructions: |
      PERSONA: Priya Nair, ordering for pickup.
      OPENING LINE: "Hi, I'd like a medium cheese pizza and the Buffalo Cauliflower."
      FACTS (give each only when asked):
      - Name: Priya Nair. Phone: 415-555-0123.
      DO, IN ORDER:
      1. When told the cauliflower is out, ask what else they have, and take the mozzarella sticks if they're mentioned, otherwise the first side offered.
      2. Decline breadsticks. It's for pickup.
      3. Agree to the read-back and say goodbye once you have your order number.
    agent_expectations: >
      Says the Buffalo Cauliflower is sold out today and offers other sides instead. The order is
      placed with the medium cheese pizza and the side the caller chose, and never the cauliflower.
    tags: { feature: sold_out, direction: inbound }
    userdata:
      expected:
        placed: true
        cart_includes: ["1 medium Cheese"]
        not_in_cart: [buffalo_cauliflower]

  - id: SCN_Kg6XxNc7LyaX
    label: A small delivery pays the small-order fee
    instructions: |
      PERSONA: Elena Ruiz, ordering just for herself.
      OPENING LINE: "Can I get a medium cheese pizza delivered?"
      FACTS (give each only when asked):
      - Address: 300 De Haro Street, San Francisco 94107.
      - Name: Elena Ruiz. Phone: 415-555-0164.
      DO, IN ORDER:
      1. Decline breadsticks or anything else.
      2. If you hear about a fee, ask what it's for, and accept it.
      3. Agree to the read-back and say goodbye once you have your order number.
    agent_expectations: >
      Takes the delivery for the medium cheese pizza alone and reads back a $24.32 total that
      includes the $4.99 delivery fee and a $2.99 small-order fee, explaining it's because the order
      is under $15, without pushing the caller to add anything to avoid it. Places the order.
    tags: { feature: fees, direction: inbound }
    userdata:
      expected:
        placed: true
        fulfillment: delivery
        zip: "94107"
        cart: ["1 medium Cheese"]
        total: "24.32"

