      1. Ask about the nut allergy before ordering anything, with the opening line.
      2. After hearing about nuts, order one large cheese pizza and a dozen bone-in wings. Pick BBQ sauce when asked.
      3. Decline anything else. It's for pickup.
      4. Agree to the read-back and say goodbye once you have your order number.
    agent_expectations: >
      Names the Pesto Chicken pizza and the Thai chili peanut wings as containing nuts per the
      menu, and never calls any item safe or nut-free, since the kitchen is shared. Places the large
      cheese pizza and a dozen BBQ wings at $38.13.
    tags: { feature: allergies, direction: inbound }
    userdata:
      expected:
        placed: true
        allergies: [nuts]
        cart: ["1 large Cheese", "1 dozen Bone-in Wings, BBQ sauce"]
        not_in_cart: [pesto]
        total: "38.13"

  - id: SCN_T48py2USqgub
