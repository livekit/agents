  # ---- calls out, about order #214 ----

  - id: SCN_OktT10KvmqVN
    label: Takes the Coke and gives a gate code
    instructions: |
      PERSONA: Sam Carter, who ordered pizza for delivery earlier, at home.
      DO, IN ORDER:
      1. When asked about the Sprite, take the large Coke.
      2. When asked if the driver should know anything, say: "Yes, the gate code is 4512, and I'm in unit 3B."
      3. If Gabby says the code or unit back wrong, correct it.
      4. Say that's all, listen to the read-back, and say thanks and goodbye.
    agent_expectations: >
      Its opening line says who's calling and goes straight into the update: Marco's about to
      head out, the Sprite ran out, and would a large Coke at the same price work or should it
      come off.
      Greeting Sam by name is fine; asking whether it's Sam, or who it's speaking to, is not. It
      swaps the Sprite for a large Coke at the same price, saves gate code 4512 and unit 3B for
      the driver, and reads back the changes with $49.65 still due at the door and Marco about
      twenty minutes away before ending.
    tags: { feature: update, direction: outbound }
    userdata:
      direction: outbound
      name: Sam Carter
      expected:
        cart: ["1 large Pepperoni", "1 dozen Bone-in Wings, hot sauce", "1 large Coke"]
        total: "49.65"
        balance: "0"
        driver_note: ["4512", "3B"]
        cancelled: false

