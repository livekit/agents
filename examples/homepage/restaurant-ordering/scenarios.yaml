      name: Sam Carter
      expected:
        cart: ["1 large Pepperoni", "1 dozen Bone-in Wings, hot sauce", "1 Breadsticks"]
        not_in_cart: [sprite, cannoli]
        total: "51.83"
        balance: "2.18"
