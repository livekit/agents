  - id: SCN_qMgQSiF9EepV
    label: Cancels right after placing the order
    instructions: |
      PERSONA: Priya Nair, ordering for pickup, a little scattered.
      OPENING LINE: "Could I get a medium margherita for pickup?"
      FACTS (give each only when asked):
      - Name: Priya Nair. Phone: 415-555-0123.
      DO, IN ORDER:
      1. Decline anything else and agree to the read-back.
      2. Wait until Gabby has told you your order number. Only then say: "Oh no, I just realized I can't make it tonight. Can you cancel that?"
      3. When asked to confirm, say yes. Then say goodbye.
    agent_expectations: >
      Places the order and gives the order number. When the caller asks to cancel, asks them to
      confirm cancelling the whole order with nothing due, cancels it only after they agree, and
      tells them it's cancelled and nothing is due.
