id: SCNG_tg9a4T72JWx5
name: Juniper Health front desk
scenarios:
  - id: SCN_isN8gYw2Tu2o
    label: Existing patient moves their appointment
    instructions: |
      PERSONA: Taylor Smith, a patient on file, born March 14, 1988, calling from work.
      OPENING LINE: "Hi, it's Taylor Smith."
      If asked for your date of birth, say "March 14th, 1988."
      If asked to spell your name, spell it letter by letter: T, A, Y, L, O, R, then S, M, I, T, H.
      DO, IN ORDER:
      1. When told about your upcoming appointment, ask to move it to a morning later in the week.
      2. Accept the first time offered.
      3. Say that's all and hang up.
    agent_expectations: >
      Asks Taylor to spell their name and for their date of birth before sharing anything from the chart, then finds it and mentions the upcoming knee pain follow-up. Checks the
      calendar and offers morning times later in the week, then moves the appointment to
      the time Taylor picked without asking for a second confirmation. Replies are
      one or two short spoken sentences.
    tags:
      feature: reschedule

  - id: SCN_HvBf5sWfckDt
    label: New patient books a first visit
    instructions: |
      PERSONA: Casey Morgan, a new patient with a sore throat, born June 1, 1995.
      If asked for your date of birth, say "June 1st, 1995."
      If asked to spell your name, spell it letter by letter: C, A, S, E, Y, then M, O, R, G, A, N.
      If the letters are read back to you correctly, say "Yep, that's right."
      OPENING LINE: "Hi, I'm Casey Morgan, I'm a new patient."
      DO, IN ORDER:
      1. Say the visit is for a sore throat and ask for something tomorrow afternoon.
      2. Accept the first time offered.
      3. Say that's all and hang up.
    agent_expectations: >
      Asks Casey to spell their name and reads the letters back before registering
      them, then checks tomorrow afternoon, offers an open time, and books it once
      Casey picks it. Confirms the booking with the same day and time it offered.
      Never invents times that the calendar didn't return.
    tags:
      feature: new-patient

  - id: SCN_5hTDSQUoFHzR
    label: First-time caller isn't told they're being pulled up
    instructions: |
      PERSONA: Sam Rivera, who has never been to the clinic, with a sore knee, born August 17, 1990.
      OPENING LINE: "Hey, my knee's really sore. I've never been to the clinic before, but I'm hoping to make an appointment."
      Your first reply must say you've never been to the clinic before. Don't give your name until you're asked for it.
      If asked for your date of birth, say "August 17th, 1990."
      If asked for your name or its spelling, spell it letter by letter: S, A, M, then R, I, V, E, R, A.
      If the letters are read back to you correctly, say "Yep, that's right."
      DO, IN ORDER:
      1. When asked about timing, ask for the earliest morning appointment.
      2. Accept the first time offered.
      3. Say that's all and hang up.
    agent_expectations: >
      Asks Sam to spell their name before looking anything up. Never talks as if
      it expects to find a chart for Sam, like saying it's pulling Sam up, since
      Sam said they've never been in. Reads the letters back and registers Sam
      once they confirm, then books the morning opening Sam picks and confirms it
      with the same day and time it offered.
    tags:
      feature: new-patient

  - id: SCN_WhQ6yVjG6RAe
    label: Spelling finds the chart behind a misheard name
    instructions: |
      PERSONA: Jordan Lee, a patient on file, born July 8, 1992, just checking their appointment.
      If asked for your date of birth, say "July 8th, 1992."
      If asked to spell your name, spell it letter by letter: J, O, R, D, A, N, then L, E, E.
      OPENING LINE: "Hi, this is Jordan Leigh."
      DO, IN ORDER:
      1. Ask when your next appointment is.
      2. Once Riley has told you when it is, say thanks and hang up. Don't say goodbye before that.
    agent_expectations: >
      Asks Jordan to spell their name, finds Jordan Lee's chart from the spelling,
      and tells Jordan about the upcoming annual physical. Does not register a new
      patient.
    tags:
      feature: lookup
