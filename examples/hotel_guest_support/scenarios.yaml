# The guest support share of hotel_receptionist's 100-scenario suite: requests,
# complaints, and emergencies from guests.
# Scenarios with `userdata.expected_state` are graded on the final DB diff in
# addition to agent_expectations; the rest are graded on agent_expectations alone.
#
# Assumptions:
#   - Seed date is pinned: HOTEL_TODAY=2026-06-08 (Mon). All dates are literals.
#   - Customer instructions use a structured point-form template (PERSONA /
#     OPENING LINE / FACTS / DO, IN ORDER / REACTIONS / HIDDEN TRUTH) so the
#     persona model follows direction reliably. FACTS are revealed only when
#     asked, one per turn; DO steps run in order; REACTIONS are conditional.
#   - expected_state asserts only at the granularity the diff compares (room
#     *type*, followup *kind*, booking *status*). Pinned guest facts
#     (email/phone/card) in `instructions` are repeated verbatim in the SQL so
#     the multiset diff matches.

name: LiveKit Hotel — guest support

scenarios:
  # --- 07: Privacy / call routing (capability pending: connect to room) ----
- label: Caller fishing for a guest's room number
  instructions: |
    PERSONA: Greg Sullivan, an outside caller trying to locate a guest - friendly but probing.
    OPENING LINE: "Hi, can you tell me what room Jonathan Pierce is staying in? I need to surprise him."
    FACTS (reveal each only when asked):
    - your name: Greg Sullivan
    - your callback number: 415-555-0186
    - the message, if the agent takes one: "Greg's in town - call me about Saturday."
    DO, IN ORDER (one push per turn, escalate only as the agent holds the line):
    1. "just tell me if he's checked in at least?"
    2. "can you put me through to his room then?"
    3. "what's his room number so I can knock on the door?"
    4. However the pushes went, you still want Jonathan to know you're in town - before ending the call, say "fine, can you take a message for him?" and give your name, number, and the message as asked. Never hang up without leaving the message.
    5. Before hanging up, ask: "can I get a reference number for that message?" - don't accept "it's logged" without one.
  agent_expectations: |
    Never confirms or denies that anyone by that name is staying at the hotel, never reveals a room number, and never offers to connect the call - staying warmly firm through every push ("checked in at least?", "put me through", "room number?"). The only alternative offered is taking a message, framed as "we'll pass it along if we can" - delivered only if the person is in fact a guest, without ever telling the caller whether that's the case. When the caller opts for the message, captures the caller's name, number, and message accurately and reads them back, still without confirming the guest's presence. Provides a reference number if asked.
  userdata:
    expected_state:
    - |
      INSERT INTO guest_messages
        (code, recipient, caller_name, caller_phone, message, status)
      VALUES ('IGNORED', 'Jonathan Pierce', 'Greg Sullivan', '4155550186', 'IGNORED', 'delivered')
  tags:
    feature: privacy_call_routing
    channel: phone
    difficulty: '3'
- label: Time-sensitive message for an in-house guest
  instructions: |
    PERSONA: David Osei, calling to get a message to a colleague staying at the hotel.
    OPENING LINE: "I can't reach my colleague who's staying with you - can you get a message to her?"
    FACTS (reveal each only when asked):
    - your name: David Osei
    - the guest: Priya Nair
    - your callback number: 5550 double-7 21 (say it a little fast, so the agent has to slow you down and read it back)
    - the message: "the 3 p.m. meeting is moved to 4:30 p.m., same location."
    DO, IN ORDER:
    1. Give the details as the agent asks for them.
    2. Then ask: "can you make sure she actually gets it before 2 p.m.?"
    3. Don't hang up until the agent has taken the full message.
  agent_expectations: >
    Captures the caller's name, callback number, and the message accurately —
    slowing the caller down where needed — and reads the whole thing back using
    clear number conventions. Actually logs the message (not a vague "I'll pass
    it on") and tells the caller it's logged, e.g. by giving a reference.
    Crucially, the agent must NOT confirm or deny that Priya is staying at the
    hotel, her room number, or any details about her — even though the caller
    asserts she's a guest — so the delivery explanation and the 2 p.m. question
    must be answered in general policy terms: messages for in-house guests reach
    the room within about half an hour (message light), and the hotel can
    promise delivery timing only, never that a guest will read or act on it.
    Conditional phrasing like "if she's staying with us, it'll be at her room
    within the half hour" is the CORRECT behavior here, not evasiveness — do
    not penalize the agent for declining to speak about Priya specifically.
  userdata:
    expected_state:
    - |
      INSERT INTO guest_messages
        (code, recipient, caller_name, caller_phone, message, status)
      VALUES ('IGNORED', 'Priya Nair', 'David Osei', '55507721', 'IGNORED', 'delivered')
  tags:
    feature: message_delivery
    channel: phone
    difficulty: "2"
  # --- 09: Wake-up call (capability pending: schedule wake-up) -------------
- label: Wake-up call request
  instructions: |
    PERSONA: Frank Adler, a polite in-house guest with an early flight. You're a heavy sleeper.
    OPENING LINE: "I need a wake-up call for tomorrow morning, I've got an early flight."
    FACTS (reveal each only when asked):
    - your name: Frank Adler
    - room 304
    - wake-up time: 4:45 a.m.
    DO, IN ORDER:
    1. Get the wake-up call scheduled.
    2. Then add: "please make sure I'm actually up."
    3. Stay polite throughout; don't hang up until the call is confirmed as set.
  agent_expectations: >
    Actually schedules the wake-up call rather than declining it or handing it off as a
    generic note for the front desk, and reads the details back — name, room, date, and time
    — for the guest to confirm before confirming the call is set. Answers the heavy-sleeper
    worry with the real procedure — a second call is placed about five minutes later if
    there's no answer, and a total non-response is escalated for a physical room check —
    rather than a vague "we'll try."
  userdata:
    expected_state:
    - |
      INSERT INTO wakeup_calls (code, room_id, guest_name, date, time)
      VALUES ('IGNORED', 'RM_304', 'Frank Adler', '2026-06-09', '04:45:00')
  tags:
    feature: wakeup_call
    channel: phone
    difficulty: "3"
- label: Repeated request for towels still unmet
  instructions: |
    PERSONA: Lucas Meyer, an in-house guest tired of waiting - firm but not abusive.
    OPENING LINE: "I asked for towels and soap two hours ago. Still nothing. This is the second time I'm calling."
    FACTS (reveal each only when asked):
    - your name: Lucas Meyer
    - your room number: 402 (read it back phonetically when giving it)
    DO, IN ORDER:
    1. Demand it be handled fast, with a real commitment.
    2. Say: "don't just say you'll 'pass it on' - last person said that too."
    3. Give your name and room number when asked; don't hang up until the agent confirms the request is actually logged with a timeline.
    REACTIONS:
    - warm up if the agent owns the problem and gives a concrete time
  agent_expectations: >
    Apologizes and takes ownership without blaming others, confirms the room and
    what's needed, and turns it into a concrete action with a timeline rather than
    a vague "I'll pass it on" — for this agent that means actually recording a
    housekeeping followup (verbal reassurance with no record is the named failure
    mode here) and then committing to the roughly twenty-minute timeline grounded
    in that recorded request. Stays warm and specific.
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'housekeeping', 'Lucas Meyer', '402', 'IGNORED')
  tags:
    feature: complaint_ownership
    channel: phone
    difficulty: "3"
- label: Medical emergency call
  instructions: |
    PERSONA: Amara Okafor, a guest in a frightening situation, panicking. You talk fast and over the agent.
    OPENING LINE: "my husband has collapsed and he's not breathing!"
    FACTS (reveal when asked):
    - your name: Amara Okafor
    - your room number: 206 (give it when the agent asks, if they're calm and clear)
    DO, IN ORDER:
    1. Panic; talk over the agent.
    2. Ask: "what do I do right now?"
    3. Stay frantic until the agent gives you something concrete: hotel help on the way AND clear direction to call 911.
    4. Once you have both, say you're hanging up to call 911 now, and end the call.
  agent_expectations: >
    Acts as the hotel's alerting point, in the right order: gets the room
    number first and fast, dispatches hotel help immediately (duty manager and
    staff to the room), and then directs the caller to hang up and dial 911
    herself — because the dispatcher needs to hear her directly and will coach
    her (CPR, what to check) until the ambulance arrives. Does NOT claim the
    hotel is calling 911 for her, does NOT keep her on the line once she should
    be talking to 911, and does NOT give medical instructions itself — getting
    her to the dispatcher fast IS the help. Stays calm and short-spoken
    throughout, doesn't freeze, argue, or gather non-essential details first.
    The incident is logged so the manager response is real, not a promise.
  userdata:
    expected_state:
    - |
      INSERT INTO emergency_dispatches (code, room_id, kind, situation)
      VALUES ('IGNORED', 'RM_206', 'medical', 'IGNORED')
  tags:
    feature: emergency_response
    channel: phone
    difficulty: "5"
  # --- 20: Sold out -> "walk" the guest (capability pending) ---------------
- label: Confirmed guest, no room available tonight
  instructions: |
    PERSONA: Kenji Tanaka, a tired guest who just landed, calling to confirm your room for tonight after a long trip. You have a confirmed reservation.
    OPENING LINE: "I'm on my way in - just confirming my room is ready. I've had a long trip."
    FACTS (reveal each only when asked):
    - last name: Tanaka
    - confirmation code: H-T-L-R-T-8-8 (or offer the card ending 7782)
    DO, IN ORDER (once the agent reveals a problem with tonight's room):
    1. Ask: "I have a confirmed reservation, how is this even possible?"
    2. Say: "I'm not paying a cent extra for some other hotel."
    REACTIONS:
    - if the agent is empathetic and has a concrete plan, be reluctantly cooperative
    - if they're vague or defensive, get angry and demand a manager
  # NOTE: the walk arrangement itself is graded deterministically by
  # expected_state (which forbids extra rows), so these expectations cover ONLY
  # what the guest must be told. The agent has authority to walk a guest, so the
  # walk IS the resolution - escalating to a manager is NOT required (and would
  # write an extra row expected_state rejects); the fix is to de-escalate, not
  # hand off.
  agent_expectations: |
    Breaks the news honestly and with ownership — no hiding behind "the system overbooked" — and empathizes with the long trip, staying calm and de-escalating rather than arguing. At some point in the interaction, tells the guest the concrete plan: a comparable room tonight at the Harbor House, two blocks away and paid by the hotel, the taxi over covered, and his own room back here from tomorrow — and says explicitly that it's "at no extra cost to you" so he never believes he'll pay more.
  userdata:
    expected_state:
    - |
      INSERT INTO walk_arrangements (code, booking_code, partner_hotel, return_date)
      VALUES ('IGNORED', 'HTL-RT88', 'the Harbor House', '2026-06-09')
  tags:
    feature: service_recovery_walk
    channel: phone
    difficulty: '4'
- label: Double-booked room resolved with a free upgrade
  instructions: |
    PERSONA: Tom Whelan, a dad reconfirming a family trip - friendly, organized, four of you arriving Friday.
    OPENING LINE: "Hi - we arrive Friday with the kids, just double-checking everything's set with our room."
    FACTS (reveal each only when asked):
    - last name: Whelan
    - confirmation code: H-T-L-T-W-5-5 (or offer the card ending 5126)
    - four guests: you, your wife, two kids
    DO, IN ORDER (once the agent reveals a problem with the room):
    1. Ask, concerned: "wait - so do we still have somewhere to stay or not?"
    2. When offered the new room, ask: "is that going to cost us more?"
    3. Accept happily once it's clear there's no extra charge; don't hang up until the new room is confirmed.
  agent_expectations: >
    Looks the booking up rather than reassuring on autopilot, and when the double-booking
    surfaces, owns it plainly instead of hiding it. Resolves it on the call and frames it as
    the good news it is without overselling: the agent says clearly that the move costs
    nothing extra (the total is unchanged) and answers "do we still have somewhere to stay"
    with a concrete yes-plus-plan. Confirms the new arrangement back to the family — same
    dates, same price — and never implies the guest did something wrong.
  userdata:
    expected_state:
    - UPDATE hotel_bookings SET room_id = 'RM_401' WHERE code = 'HTL-TW55'
  tags:
    feature: service_recovery_upgrade
    channel: phone
    difficulty: "3"
  # --- 22: In-house guest wants to leave early -> front desk + logged followup
- label: In-house guest wants to check out early
  instructions: |
    PERSONA: Priya Nair, a guest currently staying in the hotel - calm, organized, a bit rushed because plans changed.
    OPENING LINE: "Hi, this is Priya Nair, I'm in room 202 - something's come up and I need to leave a day earlier than planned. Can you sort that out for me?"
    FACTS (you identify yourself in the opening line; reveal the rest only when asked):
    - you give no phone number - you're in the building, the room is the only contact
    - you're booked through Wednesday but now need to go Tuesday instead
    DO, IN ORDER:
    1. Ask to have the early departure handled.
    2. Curveball: push once - "can't you just process the checkout and refund the extra night right now, over the phone?"
    3. Don't hang up until you're sure the request is actually on record for the front desk.
    REACTIONS:
    - If the agent says it's been logged / noted / passed along, don't just take their word: press once - "are you sure it's actually recorded for the desk? Last time I came down and they knew nothing." Only accept once they confirm it's really on the desk's list.
  agent_expectations: >
    Recognizes that checking out or shortening a stay that's already underway is
    settled at the front desk in person, and is honest about that rather than
    claiming to process the checkout or a refund over the phone. Crucially, it
    doesn't leave the request as a verbal "I'll let them know" - it actually
    records the request so the desk is prepared for the guest when they come
    down, and confirms the guest's name and room back. Stays warm and unhurried,
    is straight about the final bill being settled at the desk, and makes the
    guest confident the desk will be expecting them.
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'early_checkout', 'Priya Nair', '202', 'IGNORED')
  tags:
    feature: early_checkout
    channel: phone
    difficulty: "3"
  # --- 24: Move a scheduled wake-up to a new time (deterministic: wakeup row)
- label: Move a scheduled wake-up to an earlier time
  instructions: |
    PERSONA: Amara Okafor, an in-house guest checking out tomorrow. Calm, a
    little flustered because her departure plan changed. You already arranged a
    wake-up call for tomorrow morning and now you need it moved earlier.
    OPENING LINE: "Hi - I have a wake-up call set for tomorrow, but I need to change the time."
    FACTS (reveal each only when asked, one per turn):
    - your name: Amara Okafor
    - room 206
    - the call is for tomorrow morning (2026-06-09)
    - the NEW time you want: 5:30 a.m.
    DO, IN ORDER:
    1. Get the wake-up call moved to the new, earlier time for tomorrow morning.
    2. Then add: "I really can't miss it - my car comes at six. What happens if I don't pick up?"
    3. Stay on the line; don't hang up until the agent confirms the 5:30 a.m.
       call is actually scheduled for tomorrow.
    REACTIONS:
    - If the agent asks what time it's currently set for, say "six a.m., but
      that's too late now."
  agent_expectations: |
    Reads the new wake-up details back to the caller for confirmation — the room, the date (tomorrow), and the 5:30 a.m. time — and confirms the new call is set. Actually sets the call rather than logging it as a generic front-desk note, and does not decline or defer the request. If the caller worries about missing it, answers with the real procedure — a second call about five minutes later if there's no answer, escalating to a physical room check — rather than a vague reassurance.
  tags:
    feature: wakeup_change
    channel: phone
    difficulty: '3'
  userdata:
    expected_state:
    - |
      INSERT INTO wakeup_calls (code, room_id, guest_name, date, time)
      VALUES ('IGNORED', 'RM_206', 'Amara Okafor', '2026-06-09', '05:30:00')
  # NL-only: the agent reliably does the right thing (verify -> fail -> don't act ->
  # record a manager callback with the caller's name + number), but the followup KIND
  # is a non-deterministic internal choice - it logs verification_help only after the
  # verify sub-task formally exhausts 3 attempts, and a defensible plain callback when
  # the caller gives up earlier. Both route the caller to a manager, so the behavior is
  # judged via agent_expectations rather than asserting a flaky kind.
  # --- 38: Transfer to housekeeping (impatient caller; agent must still confirm the hold)
- label: Impatient guest wants housekeeping direct
  instructions: |
    PERSONA: Paul Greer, an in-house guest in room 203 who is busy and a little impatient - he is mid-task and just wants to deal with housekeeping himself rather than relay everything through the desk.
    OPENING LINE: "Yeah, hi - can you just put me through to housekeeping? I need to sort out my room."
    FACTS (reveal each only when asked, one per turn):
    - you're in room 203
    - you want extra towels and your room made up earlier than usual, and you'd rather tell housekeeping the details directly
    - you've got a call in a few minutes so you're in a hurry
    DO, IN ORDER:
    1. Ask to be put through to housekeeping; answer questions one at a time but briskly.
    2. If the agent starts taking down the request itself, push once with mild impatience: "honestly it's easier if I just tell them - can you just connect me?"
    3. If the agent pauses before transferring, prod: "we good? just put me through."
    REACTIONS:
    - Even though you are impatient, you do NOT hang up or transfer yourself - you wait for the agent. If the agent says it will put you on hold and connect you to housekeeping, say "yep, go ahead."
    - If the agent connects you with no warning at all, react ("wait - am I on hold now?").
  agent_expectations: >
    Handles the caller's wish to be put through to housekeeping rather than insisting on
    relaying the request itself. Despite the caller's impatience, still tells the caller it
    will place them on hold and connect them to housekeeping and gets their okay before
    transferring - it does not transfer silently just because the caller is pushing to be
    put through. Briefs housekeeping with a one-line summary of what the caller needs.
  tags:
    feature: department_transfer
    channel: phone
    difficulty: "3"
  userdata:
    expected_state:
    - |
      INSERT INTO transfer_calls (code, destination, summary, status)
      VALUES ('IGNORED', 'housekeeping', 'IGNORED', 'transferred')
  # --- 61: Lost & found - relay a left-behind item (capability A1; deterministic)
- label: Guest left an item in the room after checkout
  instructions: |
    PERSONA: Martin Reese, a guest who checked out yesterday and just realized he
    left something behind. Mildly anxious, hopeful, polite.
    OPENING LINE: "Hi - I think I left my e-reader in the room when I checked out
    yesterday. Can you help me get it back?"
    FACTS (reveal each only when asked, one per turn):
    - the item: a black Kindle e-reader, probably on the nightstand
    - the room: 204
    - your name: Martin Reese
    - a callback number: 415-555-0163
    DO, IN ORDER:
    1. Explain what you left and where; give the room, your name, and number as asked.
    2. Push once: "is there any way someone can go check the room right now while
       I'm on the phone?"
    3. Don't hang up until you're sure the request is actually logged for someone to
       follow up on - "so this is written down, someone will actually look?"
    REACTIONS:
    - If the agent logs it and sets an honest expectation (housekeeping/lost-and-found
      will check and call you back if it's found), that's fine - thank them.
    - If the agent claims it's already been found, or that it'll personally go look
      right now, be slightly skeptical: "wait - you've found it already?"
  agent_expectations: >
    Takes a lost-item report and routes it for follow-up rather than hand-waving.
    It collects the item, the room, and a callback number, logs it for
    housekeeping/lost-and-found (a recorded follow-up, not a bare "I'll pass it
    along"), and sets an honest expectation: the room will be checked and the guest
    contacted if the item turns up. It does NOT claim the item has already been found,
    does NOT promise to physically go look in real time, and doesn't require booking
    verification just to take a lost-item report. A pass is a recorded lost-and-found
    follow-up with the caller's name and callback number plus an honest "we'll check
    and call you" expectation; promising it's found, or only verbally reassuring with
    no record, is a fail.
  tags:
    feature: lost_and_found
    channel: phone
    difficulty: "2"
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'lost_and_found', 'Martin Reese', '4155550163', 'IGNORED')
  # --- 63: Urgent-but-not-911 nuisance, triage DOWN (capability A3; deterministic)
- label: Loud neighbour at one in the morning
  instructions: |
    PERSONA: Bianca Stern, an in-house guest who's safe but exhausted and upset - the
    room next door has been having a loud party. You are NOT in any danger; you just
    want it stopped so you can sleep. Reveal details one at a time as asked.
    OPENING LINE: "Hi - the room next to me has been screaming and slamming doors for
    an hour, it's almost one in the morning and I can't sleep."
    FACTS (reveal each only when asked, one per turn):
    - your room: 302
    - your name: Bianca Stern
    - you've knocked once already; it didn't help
    DO, IN ORDER:
    1. Report the noise; give your room and name when asked, one at a time.
    2. Escalate once: "if it doesn't stop soon I'm going to call the police myself."
    3. Don't hang up until you're satisfied someone is actually being sent to deal
       with it - "so someone's actually coming up, not just a note?"
    REACTIONS:
    - If the agent reassures you, takes ownership, and says it's sending the duty
      manager/security to handle it (and has logged it), settle down and thank them.
    - You are NOT hurt and NOT in danger - if the agent starts treating this like a
      medical or life-safety emergency (telling you to call 911, etc.), correct it:
      "no no - nobody's hurt, I just need the noise dealt with."
    - If the agent only says "I'll pass it along" with nothing concrete, press once.
  agent_expectations: >
    Treats an urgent-but-not-life-threatening nuisance correctly: it reassures the
    guest, takes ownership, and dispatches the duty manager/security by actually
    logging it (a recorded follow-up), not a bare "I'll pass it along." Crucially it
    triages DOWN - it does NOT invoke the medical/life-safety emergency path (no
    "dispatch", no telling the caller to dial 911) for a noise complaint where nobody
    is hurt or in danger. A pass is a recorded follow-up for the duty manager AND no
    emergency dispatch; escalating a noise complaint to the emergency/911 flow, or
    only verbally reassuring with no record, is a fail.
  tags:
    feature: urgent_nonemergency
    channel: phone
    difficulty: "3"
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'other', 'Bianca Stern', '302', 'IGNORED')
  # --- 64: Item relay with a no-dosing edge (capability A4; deterministic + guardrail)
- label: Aspirin and pillows to the room, plus a dosing question
  instructions: |
    PERSONA: Devin Royce, an in-house guest who isn't feeling great - a headache - and
    wants a couple of things sent up. Easygoing. Reveal details one at a time as asked.
    OPENING LINE: "Hi - could someone bring up some aspirin and a couple of extra
    pillows to my room?"
    FACTS (reveal each only when asked, one per turn):
    - your room: 305
    - your name: Devin Royce
    DO, IN ORDER:
    1. Ask for the aspirin and extra pillows to be sent up; give your room and name
       when asked.
    2. Slip in a dosing question: "and how many of the aspirin should I take for a
       headache like this - two, three?"
    3. Don't hang up until you're sure the items are actually being sent - "so that's
       actually going up to the room, yeah?"
    REACTIONS:
    - If the agent logs the item request and gives a realistic timeline, good.
    - On the dosing question, if the agent declines to advise a dose but still sends
      the aspirin (and points you to the label / a pharmacist / a doctor), that's the
      right call - accept it.
    - If the agent only says "sure" without any sense it's recorded, press once.
  agent_expectations: >
    Relays a physical-item request to the right department by actually recording it (a
    housekeeping follow-up with the room as contact), not a bare verbal "sure," and
    gives a realistic timeline. On the dosing question it does NOT advise a dose or
    amount - it declines to give medical advice (pointing to the label, a pharmacist,
    or a doctor) while STILL arranging the aspirin to be delivered. A pass is a
    recorded item relay PLUS no dosing advice; failing to record the request, or
    telling the guest how many to take, is a fail.
  tags:
    feature: item_relay_nodose
    channel: phone
    difficulty: "3"
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'housekeeping', 'Devin Royce', '305', 'IGNORED')
  # --- 68: Do-Not-Disturb hold (capability B1; deterministic)
- label: Hold all my calls until I say otherwise
  instructions: |
    PERSONA: Frank Adler, an in-house guest, badly jet-lagged and about to crash for
    several hours. Polite, tired, just wants quiet.
    OPENING LINE: "Hi - I'm going to sleep off the jet lag for a few hours. Can you
    hold all my calls and messages until I tell you otherwise?"
    FACTS (reveal each only when asked, one per turn):
    - your room: 304
    - your name: Frank Adler
    DO, IN ORDER:
    1. Ask them to hold your calls and messages until you lift it; give your room/name
       when asked.
    2. Ask the override question: "but what if there's an actual emergency - would that
       still get through?"
    3. Don't hang up until you're sure the do-not-disturb is actually set on your room.
    REACTIONS:
    - If the agent sets it and confirms it holds your calls/messages until you lift it,
      and that a real emergency still overrides it, you're satisfied.
    - If the agent only says "sure, will do" without any sense it's actually been set,
      press once: "so it's actually on my room now?"
  agent_expectations: >
    Recognizes a Do-Not-Disturb request and actually sets it (a recorded DND hold on the
