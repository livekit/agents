    a restaurant table. It does not confirm or "pencil in" the event itself, and sets the
    expectation that the sales/events team follows up. A pass is a recorded sales-lead
    follow-up with the caller's name and number; confirming the event, or only verbally
    promising a callback with no record, is a fail.
  tags:
    feature: sales_lead_event
    channel: phone
    difficulty: "2"
  userdata:
    expected_state:
    - |
      INSERT INTO hotel_followups (code, kind, caller_name, caller_phone, summary)
      VALUES ('IGNORED', 'sales_lead', 'Patricia Vance', '4155550173', 'IGNORED')
