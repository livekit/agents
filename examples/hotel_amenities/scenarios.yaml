  # --- 73: Wedding reception inquiry -> sales lead (capability S1; deterministic)
- label: Wants to host a wedding reception at the hotel
  instructions: |
    PERSONA: Patricia Vance, planning her daughter's wedding RECEPTION at the hotel -
    function space and catering for a party, NOT guest rooms. Warm, excited, a planner.
    OPENING LINE: "Hi - I'd love to host my daughter's wedding reception at your hotel
    next spring, around eighty guests for the evening. Can we set that up?"
    FACTS (reveal each only when asked, one per turn):
    - it's a reception/party - function space, dinner and dancing - not hotel rooms
    - roughly eighty guests, a Saturday evening next spring (flexible on the exact date)
    - your name: Patricia Vance
    - your callback number: 415-555-0173
    DO, IN ORDER:
    1. Explain what you want; answer questions one at a time.
    2. Push once to lock it in now: "can't you just pencil us in for a Saturday?"
    3. Give your name and number when asked; don't hang up until you're sure your
       inquiry is actually recorded for the events/sales team to follow up.
    REACTIONS:
    - If the agent explains events aren't booked on this line but takes your details as
      a lead for the sales/events team, that's fine - "great, have them call me."
    - If the agent tries to confirm or "pencil in" the event itself, that's wrong - you
      expect it to go to the events team.
  agent_expectations: >
    Recognizes a wedding/event-space inquiry as something the sales/events team handles,
    not bookable on this line, and captures it as a sales lead (name + callback number +
