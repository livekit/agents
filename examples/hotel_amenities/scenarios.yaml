# The amenities share of hotel_receptionist's 100-scenario suite: the
# restaurant, spa, business centre, florist, tours, and the hotel car.
# Scenarios with `userdata.expected_state` are graded on the final DB diff in
# addition to agent_expectations; the rest are graded on agent_expectations alone.
#
# Assumptions:
#   - Seed date is pinned: HOTEL_TODAY=2026-06-08 (Mon). All dates are literals.
#   - Customer instructions use a structured point-form template (PERSONA /
#     OPENING LINE / FACTS / DO, IN ORDER / REACTIONS / HIDDEN TRUTH) so the
#     persona model follows direction reliably. FACTS are revealed only when
#     asked, one per turn; DO steps run in order; REACTIONS are conditional.
#   - expected_state asserts only at the granularity the diff compares (room
#     *type*, followup *kind*, booking *status*). Pinned guest facts
#     (email/phone/card) in `instructions` are repeated verbatim in the SQL so
#     the multiset diff matches.

name: LiveKit Hotel — amenities

scenarios:
  # --- 16: Concierge — restaurant (in scope) + tour (capability pending) ---
- label: Book a dinner table and a sightseeing tour
  instructions: |
    PERSONA: Olivia Carter, a guest calling to plan your evening and next day.
    OPENING LINE: "can you help me book a nice dinner tonight and a sightseeing tour tomorrow?"
    FACTS (reveal each only when asked):
    - dinner: for two, 7:30 p.m. tonight if available, no dietary restrictions
    - tour: tomorrow, a half-day of city sights with an English-speaking guide; fine to join a group; the same two of you
    - your name: Olivia Carter
    - your phone: 415-555-0419
    DO, IN ORDER:
    1. Get the dinner table booked.
    2. Get the tour arranged.
    3. Ask: "what time will the tour pick us up, and how much?"
    4. Don't hang up until you have a confirmation or reference number for BOTH the dinner and the tour - if the tour wasn't given one, ask: "and what's the reference for the tour booking?"
  agent_expectations: >
    Gathers the specifics before booking anything (party size and time for dinner; group vs
    private and half vs full day for the tour). Confirms the dinner table back to the
    caller, and answers the tour curveball with concrete confirmed details — pickup at 9:00
    AM at the hotel lobby, sixty-five dollars per person (one hundred thirty total), entry
    fees included — rather than leaving the tour as an open question or a handoff. Actually
    places both bookings rather than promising to pass them along, and confirms both back
    clearly with their reference numbers.
  userdata:
    expected_state:
    - |
      INSERT INTO restaurant_reservations
        (code, table_id, first_name, last_name, phone, party_size, date, time, notes)
      VALUES ('IGNORED', 1, 'Olivia', 'Carter', '4155550419', 2,
              '2026-06-08', '19:30:00', NULL)
    - |
      INSERT INTO tour_bookings
        (code, tour_id, guest_name, guest_phone, date, party_size, total)
      VALUES ('IGNORED', 'half_day_city', 'Olivia Carter', '4155550419',
              '2026-06-09', 2, 13000)
  tags:
    feature: concierge_dinner_and_tour
    channel: phone
    difficulty: "2"
  # --- 16b: Cancel a dinner reservation (deterministic) --------------------
- label: Cancel a dinner reservation
  instructions: |
    PERSONA: Hannah Kowalski, a polite guest whose evening plans fell through. You booked a table and now need to cancel it.
    OPENING LINE: "Hi - I need to cancel a dinner reservation I have with you tonight."
    FACTS (reveal each only when asked):
    - last name: Kowalski. Spell it K-O-W-A-L-S-K-I only if asked.
    - the reservation confirmation code: "RES-L-M-1-2" (the code printed when the table was booked - give the whole thing including the RES)
    - the table was for two, tonight (reveal only if asked)
    DO, IN ORDER:
    1. Ask to cancel the table; give your last name and the confirmation code when the agent asks to verify you.
    2. Once it's looked up, ask: "there's no cancellation fee for the table, is there?"
    3. Don't hang up until the agent confirms the reservation is actually cancelled.
  agent_expectations: >
    Recognizes this as a restaurant-table cancellation, not a room booking, and verifies the
    caller the way the restaurant does — last name plus the printed RES confirmation code,
    no card or email — then actually cancels the reservation rather than leaving it as a
    vague "I'll pass it on," and confirms the cancellation back to the caller. Answers the
    fee question honestly without inventing a charge or a refund: cancelling a dinner table
    carries no fee. Does not confuse the request with the caller's (nonexistent) room
    booking.
  userdata:
    expected_state:
    - |
      UPDATE restaurant_reservations SET status = 'cancelled' WHERE code = 'RES-LM12'
  tags:
    feature: restaurant_cancellation
    channel: phone
    difficulty: "2"
  # --- 17: Concierge flight + transport (capability pending) ---------------
- label: Flight reconfirmation and airport car
  instructions: |
    PERSONA: Sofía García, an in-house guest flying home this week, a bit anxious about logistics.
    OPENING LINE: "I fly home Thursday. Can you reconfirm my flight and sort out a car to the airport?"
    FACTS (reveal each only when asked):
    - your name: Sofía García, staying in room 401
    - the flight: Iberia flight IB 6174, Thursday June 11th at 5:40 p.m., booking reference Q-X-4-R-7-T
    - you want the car at 2:30 p.m. - about three hours before departure
    - two passengers, with luggage
    DO, IN ORDER:
    1. Hand over the flight details as the agent asks for them.
    2. Ask: "hotel car or a taxi - what's the difference in cost?"
    3. Ask: "can you double-check my seat is okay too?"
    4. Don't hang up until the car is booked and the reconfirmation is in motion.
  agent_expectations: >
    Captures the full travel details — airline, flight number, date, booking reference — and
    reads the booking reference back, since it's useless if misheard. Handles the
    reconfirmation honestly: logs it with the concierge, who calls the carrier and rings the
    room with the result; never claims the flight is already confirmed. For the transport,
    explains hotel car (flat eighty-five dollars, bookable, front entrance) vs taxi (metered
    roughly fifty-five to seventy, hailed at the door, not reservable). Sanity-checks the
    2:30 p.m. pickup against the 5:40 p.m. departure (about three hours before) and confirms
    the time, pickup spot, and cost back to the guest. Answers the seat-check curveball
    honestly: it rides along in the same carrier call, no fabricated seat confirmation.
    Closes by confirming the whole plan.
  userdata:
    expected_state:
    - |
      INSERT INTO flight_reconfirmations
        (code, room_id, airline, flight_number, flight_date, booking_reference, seat_check)
      VALUES ('IGNORED', 'RM_401', 'Iberia', 'IB6174', '2026-06-11', 'QX4R7T', 1)
    - |
      INSERT INTO airport_cars
        (code, room_id, pickup_date, pickup_time, passengers)
      VALUES ('IGNORED', 'RM_401', '2026-06-11', '14:30:00', 2)
  tags:
    feature: concierge_travel
    channel: phone
    difficulty: "3"
  # --- 28: Modify an existing restaurant reservation (deterministic: time shift)
- label: Move a dinner reservation - caller first names a past date
  instructions: |
    PERSONA: Marcus Bennett, an easygoing guest who needs to push his dinner reservation to a different night. You're glancing at a calendar and at first you read off the wrong week, landing on a date that has already passed - you don't realize it's in the past until the agent points it out.
    OPENING LINE: "Hi - I've got a dinner reservation and I need to move it to a different night."
    FACTS (reveal each only when asked, one per turn):
    - last name: Bennett. Spell it B-E-N-N-E-T-T only if asked.
    - the reservation confirmation code: "RES-J-K-9-0" (give the whole thing including the RES)
    - the new date you THINK you want, at first: "the thirtieth of May" (this is in the past)
    - the time you want: seven o'clock in the evening (7:00 PM)
    - it's still the same party of four (reveal only if asked)
    REACTIONS:
    - If the agent says the 30th of May is in the past / already happened / can't be booked: react naturally - "oh, you're right, I'm looking at the wrong month - sorry." Then give the date you actually meant: "next Monday, the fifteenth of June."
    - If the agent simply books the past date without flagging it: you are mildly confused but go along with it ("uh, sure") - do NOT correct them. (This is the failure case the agent must avoid.)
    DO, IN ORDER:
    1. Ask to move the reservation to a different night; give your last name and the confirmation code when the agent asks to verify you.
    2. When the agent asks for the new date, give the past date first (the 30th of May).
    3. Only after the agent flags it as being in the past, correct yourself and give the real date (Monday the 15th of June) and the time (7:00 PM).
    4. Don't hang up until the agent confirms the reservation has actually been moved to June 15th and reads the new date and time back to you with a reference.
  agent_expectations: |
    Recognizes this as a change to an existing restaurant table, not a new booking or a cancellation, and verifies the caller the way the restaurant does - last name plus the printed RES confirmation code, no card or email. Critically, when the caller first gives a date that has already passed (May 30th, before today), the agent does NOT accept or book it: it points out that the date is in the past and asks for a valid future date, rather than silently moving the reservation backward in time. Once the caller corrects to June 15th, completes the move and confirms the change back to the caller, citing the reservation reference and the new date and time. Does not leave the request as something to "pass on," and does not narrate a confirmation it did not actually make. Keeps the existing reservation under its confirmation code rather than creating a second one or cancelling the table outright.
  userdata:
    expected_state:
    - |
      UPDATE restaurant_reservations SET date = '2026-06-15', time = '19:00:00'
      WHERE code = 'RES-JK90' AND status = 'confirmed'
  tags:
    feature: restaurant_modification
    channel: phone
    difficulty: '2'
  # --- 32: Spa / health-club booking (deterministic: spa_bookings row)
- label: Book a spa massage for two
  instructions: |
    PERSONA: Daniel Foster, a relaxed guest planning a treat with his partner. You're easygoing and a little chatty, happy to slow down for the agent.
    OPENING LINE: "Hi - I'd like to book a couples massage at your spa while we're here."
    FACTS (reveal each only when asked, one per turn):
    - your name: Daniel Foster
    - a callback number: 415-555-0182
    - the day you want: this Thursday, June 11th
    - the time you want: 3 in the afternoon
    - it's for the two of you
    DO, IN ORDER:
    1. Ask for a couples deep-tissue massage for the two of you; let the agent walk you through the spa's options and pricing.
    2. Curveball (a question, not a change): ask "is there a limit on how many people can book the deep-tissue massage together?" - you just want to know the policy; you're still booking for the two of you.
    3. Give your details one at a time as the agent asks.
    4. Don't hang up until the agent gives you a reference number for the booking.
    GROUND TRUTH (never spoken): this Thursday is 2026-06-11; 3 in the afternoon is 15:00.
  agent_expectations: >
    Treats this as a spa booking and looks the spa catalog up rather than answering from
    memory, presenting the service's price, duration, and party limit before booking.
    Answers the party-limit question from the catalog (the deep-tissue massage is for up to
    two) rather than guessing. Reads the key details back to the caller, and only confirms
    once it has actually booked the appointment, producing one real reference number (not
    two bookings, not a promise to set it up). Quotes the duration and price as concrete
    facts from the catalog.
  tags:
    feature: spa_booking
    channel: phone
    difficulty: "2"
  userdata:
    expected_state:
    - |
      INSERT INTO spa_bookings
        (code, service_id, guest_name, guest_phone, date, time, party_size, total)
      VALUES ('IGNORED', 'deep_tissue_massage', 'Daniel Foster', '4155550182',
              '2026-06-11', '15:00:00', 2, 0)
  # --- 33: Business-centre booking (deterministic: business_center_bookings row)
- label: Book a business-centre meeting room
  instructions: |
    PERSONA: Marcus Bell, a guest who needs space to run a working session and is in a hurry.
    OPENING LINE: "I need to book a meeting room in your business centre for tomorrow."
    FACTS (reveal each only when asked, one per turn):
    - tomorrow, starting at 2 in the afternoon
    - you need the room for three hours
    - your name: Marcus Bell
    - your phone: 415-555-0288
    DO, IN ORDER:
    1. Ask to book a meeting room for tomorrow afternoon; give the start time and the three hours when asked.
    2. Curveball: ask "what is that going to cost me?" - you want the concrete figure, not "the centre will tell you".
    3. Do not hang up until you have a reference number - if you do not get one, ask: "and what is the booking reference?"
    GROUND TRUTH (never spoken): tomorrow is Tuesday, 2026-06-09; 2 in the afternoon is 14:00.
  agent_expectations: >
    Looks up the business-centre catalog before quoting anything and narrows the request
    with the caller: which service, the date and start time, and how long. Answers the cost
    question with the concrete figure from the catalog (forty dollars per hour, so one
    hundred twenty dollars for three hours) rather than leaving it open or handing it off.
    Reads back a real reference number that only exists because the booking tool actually
    ran; never narrates a confirmation it did not make.
  tags:
    feature: business_center_booking
    channel: phone
    difficulty: "2"
  userdata:
    expected_state:
    - |
      INSERT INTO business_center_bookings
        (code, service_id, guest_name, guest_phone, date, time, duration_hours, total)
      VALUES ('IGNORED', 'meeting_room', 'Marcus Bell', '4155550288',
              '2026-06-09', '14:00:00', 3, 12000)
  # --- 34: Florist order (deterministic: florist_orders row; card message denylisted)
- label: Order flowers to a room with a gift-card message
  instructions: |
    PERSONA: Marcus Webb, warm and a little rushed, arranging a surprise for his wife.
    OPENING LINE: "Hi - I'd like to send some flowers up to a room at your hotel."
    FACTS (reveal each only when asked, one per turn):
    - your name: Marcus Webb
    - your callback number: 415-555-0182
    - which arrangement: the dozen long-stem roses
    - where it goes: room 412
    - the delivery day: this Friday, June 12th
    - the gift-card message: "Happy ten years, my love. Yours always, Marcus."
    DO, IN ORDER:
    1. Ask what flower options they have and let them walk you through it; then pick the roses.
    2. Curveball: ask "can you guarantee it's there before noon, while she's still in the room?"
       - you want a real answer about the delivery window, not a vague "sure".
    3. Give the room, the day, and the card message as the agent asks; let them read the message back.
    4. Don't hang up until the agent confirms the order is placed and gives you a reference number.
    GROUND TRUTH (never spoken): this Friday is 2026-06-12.
  agent_expectations: >
    Looks up the florist catalog and presents the arrangements with their prices, letting
    the caller choose rather than choosing for them. Reads the gift-card message back so
    it's exactly right, and confirms the caller's name and the destination. Answers the
    delivery-window question with the real policy (the florist delivers between 10 AM and 6
    PM, and same-day delivery needs the order placed before the 2 PM cutoff) rather than
    promising a guaranteed before-noon slot it can't commit to. Actually places the order
    (not a vague "I'll get that arranged") and confirms it with a reference number, reading
    back the arrangement, where it's going, the date, and the total.
  tags:
    feature: florist_order
    channel: phone
    difficulty: "2"
  userdata:
    expected_state:
    - |
      INSERT INTO florist_orders
        (code, arrangement_id, guest_name, guest_phone, deliver_to, date, message, total, status)
      VALUES ('IGNORED', 'roses', 'Marcus Webb', '4155550182', '412', '2026-06-12',
              'IGNORED', 'IGNORED', 'confirmed')
- label: Transfer to restaurant for a large private dinner
  instructions: |
    PERSONA: Greg Holloway, organising a milestone birthday dinner for his extended family. Warm, a bit chatty, knows what he wants but assumes the front desk can just "sort it out".
    OPENING LINE: "Hi - I want to organise a big family dinner at your restaurant, can you help me set that up?"
    FACTS (reveal each only when asked, one per turn):
    - it's for fourteen people, possibly sixteen
    - you'd want a Saturday evening, a few weeks out
    - you're hoping for a private or semi-private space, and maybe a set menu
    - you'd want to talk through wine and any cake/dessert arrangements
    DO, IN ORDER:
    1. Explain you want to arrange the big dinner and answer questions one at a time.
    2. When it becomes clear this is beyond a normal table booking (party of 14+, private room, set menu, wine), ask: "is that something you can actually arrange, or should I be talking to the restaurant?"
    3. Before you let them move you on, ask: "and they'll have all this - the numbers, the private room idea - they won't make me start over?"
    REACTIONS:
    - If the agent offers to connect you to the restaurant, agree once they've explained they'll put you on hold to do it.
    - If the agent just transfers you with no warning, react with mild surprise ("oh - okay, you're putting me through now?").

    If the agent transfers you to the restaurant, your interaction is complete.
  # NOTE: that a transfer to the restaurant (and not a guest's room) actually
  # happened is graded deterministically by expected_state - these expectations
  # cover ONLY the conversation: warning the caller before the transfer and not
  # over-promising, neither of which the DB can see.
  agent_expectations: |
    Recognises that a large private-dining request (set menu, wine, private room, party of 14+) belongs with the restaurant directly rather than being booked at the desk as an ordinary table, and doesn't promise to arrange it itself. Before transferring, tells the caller it will place them on hold and connect them to the restaurant and waits for their okay - rather than transferring with no warning.
  tags:
    feature: department_transfer
    channel: phone
    difficulty: '2'
  userdata:
    expected_state:
    - |
      INSERT INTO transfer_calls (code, destination, summary, status)
      VALUES ('IGNORED', 'restaurant', 'IGNORED', 'transferred')
  # --- 39: VIP pre-arrival -> flowers via order_flowers (deterministic florist_orders row)
