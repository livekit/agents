# Zappi's Pizzeria. Each run is graded on the POS's final state by grade.py, from
# `userdata.expect`. Cart lines are written the way the POS describes them:
# "<quantity> × <size> <item>, <modifiers>". `direction: outbound` runs the delivery-update call.
name: Restaurant phone ordering
scenarios:
  - label: Pickup, pepperoni, wings, and a Coke
    instructions: |-
      You are Sam Carter, phone 415 555 0142, calling Zappi's Pizzeria for pickup.
      Order exactly one large pepperoni pizza, one dozen bone-in wings with hot sauce, and
      one large Coke. Decline any extras or suggestions. Give your name and phone when
      asked, confirm the read-back if it's right, and once you've heard your order number,
      say thanks and goodbye.
    agent_expectations: The agent takes a pickup order for exactly one large pepperoni, a
      dozen hot wings, and a large Coke, reads back the order with a total of $44.66 before
      submitting, then tells the caller the order number and pickup time.
    tags:
      id: ro-01
      suite: smoke
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × large Coke
        total: "44.66"
        name: Sam Carter
        phone: (415) 555-0142

  - label: Corrections during the read-back
    instructions: |-
      You are Jordan Lee, phone 415 555 0199, in a hurry, ordering for pickup.
      Order one large pepperoni pizza, one dozen bone-in wings with hot sauce, and one
      large Coke, all in one breath. Decline any extras. Give your name and phone when
      asked. When the agent starts reading the order back, cut in: "Wait, make the pizza a
      medium, and drop the Coke." Then confirm the corrected order, and once you've heard
      your order number, say goodbye.
    agent_expectations: The agent changes the pizza to medium and removes the Coke without
      rebuilding the order, reads back only the change and the new total of $37.04, gets a
      yes, submits, and gives the order number.
    tags:
      id: ro-02
      suite: smoke
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        cart:
          - 1 × medium Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
        total: "37.04"
        not_in_cart: [coke]

  - label: Buffalo cauliflower is 86'd
    instructions: |-
      You are Priya Nair, phone 415 555 0123, ordering for pickup.
      Order one medium cheese pizza and the Buffalo cauliflower. When you're told the
      cauliflower is out, ask what else they have, and take mozzarella sticks if they're
      mentioned, otherwise take the first side suggested. Decline breadsticks. Give your
      name and phone when asked, confirm the read-back, and say goodbye once you have your
      order number.
    agent_expectations: The agent says the Buffalo cauliflower is unavailable today and
      offers another side instead; the cauliflower never goes in the order, and the order is
      submitted with the medium cheese pizza and the substitute.
    tags:
      id: ro-03
      suite: full
    userdata:
      expect:
        submitted: true
        cart_includes: [1 × medium Cheese]
        not_in_cart: [buffalo_cauliflower]

  - label: Delivery outside San Francisco
    instructions: |-
      You are Marcus Bell, phone 415 555 0177. Order one large Hawaiian pizza, nothing else,
      for delivery to 45 Rideau Street, Ottawa, Ontario. Decline extras. Give your name and
      phone when asked, confirm the read-back, and say goodbye once you have your order
      number.
    agent_expectations: The agent takes the delivery to the Ottawa address without saying
      it's out of range, adds the delivery fee, and submits a delivery order for one large
      Hawaiian at $27.87.
    tags:
      id: ro-04
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: delivery
        cart: [1 × large Hawaiian]
        total: "27.87"

  - label: A small delivery order pays the small-order fee
    instructions: |-
      You are Elena Ruiz, phone 415 555 0164. Order one medium cheese pizza, nothing else,
      for delivery to 300 De Haro St, San Francisco 94107. Say no to breadsticks or anything
      else. If you hear about a fee, ask what it's for, and accept it. Give your name and phone
      when asked, confirm the read-back, and say goodbye once you have your order number.
    agent_expectations: The agent takes the delivery for the medium cheese pizza alone, with no
      delivery minimum, and reads back a $24.32 total that includes the $4.99 delivery fee and
      a $2.99 small-order fee because the order is under $15. It mentions the small-order fee
      without pushing the caller to add items to avoid it, and submits the order.
    tags:
      id: ro-05
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: delivery
        zip: "94107"
        cart:
          - 1 × medium Cheese
        total: "24.32"

  - label: Pickup with a tip, and asks how to pay
    instructions: |-
      You are Sam Carter, phone 415 555 0142, ordering for pickup. Order one large pepperoni
      pizza and nothing else; decline breadsticks. Give your name and phone when asked. When
      the order is read back, say: "Can I add a five dollar tip? And can I just give you my
      card number now?" Confirm the new total, and say goodbye once you have your order
      number.
    agent_expectations: The agent adds a $5 tip, reads back the new total of $26.79 with the
      tip, and says payment is in person at pickup, cash or card, without asking for or taking
      any card details. It submits the order and gives the order number.
    tags:
      id: ro-tip
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        cart: [1 × large Pepperoni]
        tip: "5"
        total: "26.79"

  - label: Delivery with drop-off details
    instructions: |-
      You are Jordan Lee, phone 415 555 0199. Order one large pepperoni pizza and nothing
      else, for delivery to 123 Market Street, San Francisco 94105, and in the same breath
      say: "Leave it at the door and don't ring the bell, the baby's asleep." Decline
      breadsticks. Give your name and phone when asked, check the read-back mentions the
      note, confirm it, and say goodbye once you have your order number.
    agent_expectations: The agent saves the drop-off note (leave it at the door, don't ring
      the bell) for the driver, includes it in the read-back with the $26.78 total, and
      submits the delivery order.
    tags:
      id: ro-note
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: delivery
        zip: "94105"
        cart: [1 × large Pepperoni]
        total: "26.78"
        driver_note: ["door", "bell"]

  - label: Cancels the order after placing it
    instructions: |-
      You are Priya Nair, phone 415 555 0123, ordering for pickup. Order one medium margherita
      and nothing else; decline breadsticks. Give your name and phone when asked, confirm the
      read-back. Once you've heard your order number, say: "Oh no, I just realized I can't make
      it tonight. Can you cancel that?" When asked to confirm, say yes. Then say goodbye.
    agent_expectations: The agent submits the order and gives the order number; when the caller
      asks to cancel, it asks to confirm that the whole order should be cancelled with nothing
      due, cancels it only after the yes, and tells the caller it's cancelled and nothing is
      due. It doesn't offer to transfer the caller or pass them to anyone.
    tags:
      id: ro-cancel
      suite: full
    userdata:
      expect:
        submitted: true
        cancelled: true
        cart: [1 × medium Margherita]

  - label: Kid with a nut allergy
    instructions: |-
      You are Dana Kim, phone 415 555 0110, ordering for pickup with kids in the background.
      Start with: "My kid has a nut allergy, what's safe to order?" It's a regular allergy,
      not severe. Then order one large cheese
      pizza and one dozen bone-in wings; when asked for a sauce, pick BBQ. Decline extras.
      Give your name and phone when asked, confirm the read-back, and say goodbye once you
      have your order number.
    agent_expectations: The agent names the pesto pizza and the Thai chili peanut wings as
      containing nuts per the menu, never calls any item safe or nut-free, and submits the
      large cheese pizza and dozen BBQ wings.
    tags:
      id: ro-06
      suite: smoke
    userdata:
      expect:
        submitted: true
        allergy: nuts
        cart:
          - 1 × large Cheese
          - 1 × dozen Bone-in Wings, BBQ sauce
        not_in_cart: [pesto]
        total: "38.13"

  - label: Order for four, in bursts and repeats
    instructions: |-
      You are Chris Patel, phone 415 555 0188, ordering for four people for pickup, talking
      fast and in bursts. Keep each message short and send the order in pieces, interrupting
      the agent's confirmations:
      - "Okay so two large pepperonis, and, uh, wings, a dozen, hot."
      - "Oh and a large meat lovers."
      - "Yeah the two pepperonis, right? And two large Cokes."
      Send all three messages, in that order, even if the agent moves on: the meat lovers is
      part of your order. Restating the pepperonis is a repeat, not an extra order. If the
      read-back is missing anything, correct it before confirming. Decline breadsticks. Give
      your name and phone when asked, confirm the read-back if it has exactly these items,
      and say goodbye once you have your order number.
    agent_expectations: The agent captures every item once, keeps the pepperonis at two
      despite the repeat, and submits two large pepperonis, one large meat lovers, a dozen
      hot wings, and two large Cokes at $94.76.
    tags:
      id: ro-07
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        cart:
          - 2 × large Pepperoni
          - 1 × large Meat Lovers
          - 1 × dozen Bone-in Wings, hot sauce
          - 2 × large Coke
        total: "94.76"

  - label: Corrects the first pizza late in a long call
    instructions: |-
      You are Taylor Brooks, phone 415 555 0133, ordering a delivery dinner to
      455 Natoma St, San Francisco 94103. Order one at a time, chatting a little between
      items: first a small margherita with mushrooms, then a half dozen boneless wings with
      lemon pepper, then a Caesar salad, then a tiramisu. Decline breadsticks. After giving
      your address, name, and phone, and before agreeing to the read-back, say: "Oh, that
      first pizza, can you make it a large, and no mushrooms?" Confirm the corrected order,
      and say goodbye once you have your order number.
    agent_expectations: The agent changes the margherita from a small with mushrooms to a
      plain large, keeps every other item as ordered, reads back the change and the new
      total of $51.82 including delivery, and submits after the caller agrees.
    tags:
      id: ro-long
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: delivery
        zip: "94103"
        cart:
          - 1 × large Margherita
          - 1 × half dozen Boneless Wings, lemon pepper sauce
          - 1 × Caesar Salad
          - 1 × Tiramisu
        total: "51.82"

  - label: Asks what's gluten-free
    instructions: |-
      You are Morgan Diaz, phone 415 555 0145, ordering for pickup. Start with: "Do you have
      anything gluten-free? I'm celiac." It's not severe.
      Then order one house salad and one dozen bone-in wings with BBQ sauce.
      Decline extras. Give your name and phone when asked, confirm the read-back, and say
      goodbye once you have your order number.
    agent_expectations: The agent looks up gluten in the menu data instead of saying it can't
      check, names items that contain gluten (such as the pizzas and breadsticks), never
      calls any item gluten-free or safe because the kitchen is shared, and submits the
      house salad and dozen BBQ wings at $27.23.
    tags:
      id: ro-08
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        allergy: gluten
        cart:
          - 1 × House Salad
          - 1 × dozen Bone-in Wings, BBQ sauce
        total: "27.23"

  - label: Two allergies in one order
    instructions: |-
      You are Alex Moreno, phone 415 555 0156, ordering for pickup. Start with: "I'm allergic
      to nuts, and my partner is lactose intolerant. What should we avoid?" Neither is
      severe. Then order one large cheese pizza
      and one house salad. If told the pizza contains dairy, say that's fine, the pizza is for
      you. Decline extras. Give your name and phone when asked, confirm the read-back, and say
      goodbye once you have your order number.
    agent_expectations: The agent looks up both nuts and dairy in the menu data, names the
      items with each, never calls anything safe or allergen-free, points out that the cheese
      pizza contains dairy when it's ordered, and submits the large cheese pizza and house
      salad at $28.32.
    tags:
      id: ro-09
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        allergy: [nuts, dairy]
        cart:
          - 1 × large Cheese
          - 1 × House Salad
        total: "28.32"

  - label: Garden veggie, no olives
    instructions: |-
      You are Jamie Fox, phone 415 555 0167, ordering for pickup. Order one large garden
      veggie pizza with no olives, and a small Coke. Decline extras. Give your name and phone
      when asked, check the read-back says no olives, confirm it, and say goodbye once you
      have your order number.
    agent_expectations: The agent takes the garden veggie pizza with the olives left off at
      the regular price, includes "no olives" in the read-back, and submits it with the small
      Coke at $23.96.
    tags:
      id: ro-10
      suite: full
    userdata:
      expect:
        submitted: true
        fulfillment: pickup
        cart:
          - 1 × large Garden Veggie, no black olives
          - 1 × small Coke
        total: "23.96"

  # ---- the delivery-update call (outbound): order #214 is out with Marco, the Sprite ran out.
  # Seeded: 1 large pepperoni, 1 dozen hot wings, 1 large Sprite, delivery to 94107, $49.65
  # due at the door (cash or card to the driver). `balance` is how much more (+) or less (-)
  # is due at the door than that.

  - label: Delivery update, swap the Sprite and leave a gate code
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. When asked about the Sprite, take the large Coke. When asked if the
      driver should know anything, say: "Yes, the gate code is 4512, and I'm in unit 3B."
      Then say that's all, listen to the read-back, and say thanks and goodbye.
    agent_expectations: The agent introduces herself and Zappi's Pizzeria, gives the ETA,
      swaps the Sprite for a large Coke at the same price, saves the gate code and unit as
      a driver note, reads back the changes with the same $49.65 due at the door, and repeats
      the ETA before ending the call.
    tags:
      id: ro-ob-swap
      suite: smoke
    userdata:
      direction: outbound
      expect:
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × large Coke
        total: "49.65"
        balance: "0"
        driver_note: ["4512", "3B"]
        cancelled: false

  - label: Delivery update, take off the Sprite and add breadsticks
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. When asked about the Sprite, say you don't want a replacement: just take
      it off. Then ask: "Can you also add a cannoli?" When told that can't be added,
      ask: "What about breadsticks?" and take one order if that works. When asked about
      drop-off, say: "Just leave it at the door." Listen to the read-back and say goodbye.
    agent_expectations: The agent takes the Sprite off and says that's $4.35 less at the door
      (not a refund to a card), explains the cannoli can't be added because the order is on its
      way, adds one order of breadsticks, saves "leave at the door" as the driver note, reads
      back the changes with $51.83 now due at the door, and gives the ETA before ending.
    tags:
      id: ro-ob-refund
      suite: full
    userdata:
      direction: outbound
      expect:
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × Breadsticks
        not_in_cart: [sprite, cannoli]
        total: "51.83"
        balance: "2.18"
        driver_note: ["door"]

  - label: Delivery update, customer cancels the order
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. You're annoyed the Sprite ran out. Say: "Honestly, just cancel the whole
      order." When asked to confirm the cancellation, say: "Yes, cancel it." Listen to what
      the agent says and say goodbye.
    agent_expectations: The agent doesn't refuse; it asks the customer to confirm cancelling
      the whole order, saying the driver will turn back and nothing will be due, and cancels
      only after the yes. It then says the order is cancelled and nothing is due, without
      giving an ETA, offering to transfer the customer, or leaving a note for anyone, and ends
      the call.
    tags:
      id: ro-ob-cancel
      suite: full
    userdata:
      direction: outbound
      expect:
        cancelled: true
        balance: "-49.65"

  - label: Delivery update, a complaint and a tip
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. You're unhappy: say "This is the second time something's been missing. I
      want something for my trouble." Listen to what's offered. Then take the large Coke
      instead of the Sprite, and say: "Fine. Add a five dollar tip for the driver, it's not
      his fault." Nothing for the driver's note. Listen to the read-back and say goodbye.
    agent_expectations: The agent apologizes sincerely and offers only what it can do (the
      same-price swap, taking the Sprite off, or cancelling), promising no discount, credit,
      free item, refund, call back, or manager. It swaps the Sprite for a large Coke, adds the
      $5 tip for the driver, and reads back $54.65 now due at the door, $5 more than before,
      then the ETA before ending.
    tags:
      id: ro-ob-complaint
      suite: full
    userdata:
      direction: outbound
      expect:
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × large Coke
        tip: "5"
        total: "54.65"
        balance: "5"
        cancelled: false

  - label: Delivery update, take off the Sprite, then take the Coke
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. When asked about the Sprite, say: "Just take it off." Once you hear what
      that comes to, change your mind: "Actually, I'll take the Coke instead." Nothing for
      the driver. Listen to the read-back and say goodbye.
    agent_expectations: The agent first takes the Sprite off, $4.35 less at the door, then,
      when the customer changes their mind, puts a large Coke on the order at the same price;
      the read-back has the Coke swap and the same $49.65 due at the door, then the ETA before
      ending.
    tags:
      id: ro-ob-rechoose
      suite: full
    userdata:
      direction: outbound
      expect:
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × large Coke
        not_in_cart: [sprite]
        total: "49.65"
        balance: "0"

  - label: Delivery update, breadsticks, then make it two
    instructions: |-
      You are Sam Carter. You ordered pizza for delivery earlier, and Zappi's Pizzeria is
      calling you. When asked about the Sprite, take the large Coke. Then ask to add an
      order of breadsticks. Once it's added, say: "Actually, make it two orders of breadsticks."
      Nothing for the driver. Listen to the read-back and say goodbye.
    agent_expectations: The agent swaps the Sprite for a large Coke, adds breadsticks,
      then changes them to two orders instead of refusing, says how much more that is, and
      reads back $62.71 now due at the door, $13.06 more than before, then the ETA before
      ending.
    tags:
      id: ro-ob-breadsticks
      suite: full
    userdata:
      direction: outbound
      expect:
        cart:
          - 1 × large Pepperoni
          - 1 × dozen Bone-in Wings, hot sauce
          - 1 × large Coke
          - 2 × Breadsticks
        total: "62.71"
        balance: "13.06"

  - label: Delivery update, wrong number
    instructions: |-
      You didn't order anything and you don't know anyone named Sam Carter: Zappi's Pizzeria
      has the wrong number. Once the agent has finished the opening, say: "Sorry, I think
      you've got the wrong number. There's no Sam here." If asked anything else, say again
      it's the wrong number. Say goodbye once the agent does.
    agent_expectations: After hearing it's the wrong number, the agent apologizes and ends the
      call without changing the order and without saying anything more about it, such as the
      items, the delivery address, or the customer's name, and without asking who they are.
    tags:
      id: ro-ob-wrong
      suite: full
    userdata:
      direction: outbound
      expect:
        ended_early: wrong_person
        unchanged: true
        cancelled: false
