[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-agents"
dynamic = ["version"]
description = "A powerful framework for building realtime voice AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.15"
authors = [{ name = "LiveKit", email = "hello@livekit.io" }]
keywords = ["webrtc", "realtime", "audio", "video", "livekit", "agents", "AI"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "certifi>=2025.6.15",
    "livekit==1.1.20",
    "livekit-api>=1.2.0,<2",
    "livekit-local-inference>=0.2.7",
    "livekit-protocol>=1.1.21,<2",
    "livekit-blingfire~=1.1,<2",
    "protobuf>=3",
    "pyjwt>=2.0",
    "types-protobuf>=4",
    "psutil>=7.0",
    "aiohttp~=3.10",
    "typing-extensions>=4.12",
    "docstring_parser>=0.16",
    "eval-type-backport",
    "colorama>=0.4.6",
    "av>=14.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.5,<3",
    "nest-asyncio>=1.6.0",
    "opentelemetry-api>=1.45,<1.46",
    "opentelemetry-sdk>=1.45,<1.46",
    "opentelemetry-exporter-otlp>=1.45,<1.46",
    "prometheus-client>=0.22",
    "openai>=3.19,<4",
    # Direct HTTP clients (inference, MCP) use httpx2, matching the OpenAI 3 / MCP 2 SDKs.
    "httpx2>=2.12,<3",
    "aiofiles>=24",
    "json-repair==0.63.5",
    "pyyaml>=6.0.3",
    # Required by the deprecated rich CLI (`cli.run_app`); drop when it is removed.
    "typer>=0.15.1",
    "click~=8.1",
    "sounddevice>=0.5",
    "watchfiles>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.2, <3"]
codecs = ["numpy>=1.26.0"]
images = ["pillow>=10.3.0"]
anam = ["livekit-plugins-anam>=1.8.6"]
anthropic = ["livekit-plugins-anthropic>=1.8.6"]
assemblyai = ["livekit-plugins-assemblyai>=1.8.6"]
asyncai = ["livekit-plugins-asyncai>=1.8.6"]
avatario = ["livekit-plugins-avatario>=1.8.6"]
avatartalk = ["livekit-plugins-avatartalk>=1.8.6"]
aws = ["livekit-plugins-aws>=1.8.6"]
azure = ["livekit-plugins-azure>=1.8.6"]
baseten = ["livekit-plugins-baseten>=1.8.6"]
bey = ["livekit-plugins-bey>=1.8.6"]
bithuman = ["livekit-plugins-bithuman>=1.8.7"]
bland = ["livekit-plugins-bland>=1.8.6"]
boson-avatar = ["livekit-plugins-boson-avatar>=1.8.6"]
browser = ["livekit-plugins-browser>=0.4.6"]
cambai = ["livekit-plugins-cambai>=1.8.6"]
cartesia = ["livekit-plugins-cartesia>=1.8.6"]
cerebras = ["livekit-plugins-cerebras>=1.8.6"]
clova = ["livekit-plugins-clova>=1.8.6"]
deepgram = ["livekit-plugins-deepgram>=1.8.6"]
elevenlabs = ["livekit-plugins-elevenlabs>=1.8.6"]
