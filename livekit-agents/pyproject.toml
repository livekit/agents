boson-avatar = ["livekit-plugins-boson-avatar>=1.8.11"]
browser = ["livekit-plugins-browser>=0.4.11"]
cambai = ["livekit-plugins-cambai>=1.8.11"]
cartesia = ["livekit-plugins-cartesia>=1.8.11"]
cerebras = ["livekit-plugins-cerebras>=1.8.11"]
