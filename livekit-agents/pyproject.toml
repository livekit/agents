microsoft-ai = ["livekit-plugins-microsoft-ai>=1.8.11"]
minimax = ["livekit-plugins-minimax-ai>=1.8.11"]
mistralai = ["livekit-plugins-mistralai>=1.8.11"]
murf = ["livekit-plugins-murf>=1.8.11"]
nabrah = ["livekit-plugins-nabrah>=1.8.11"]
neuphonic = ["livekit-plugins-neuphonic>=1.8.11"]
