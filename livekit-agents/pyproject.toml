langchain = ["livekit-plugins-langchain>=1.8.11"]
lemonslice = ["livekit-plugins-lemonslice>=1.8.11"]
liveavatar = ["livekit-plugins-liveavatar>=1.8.11"]
lmnt = ["livekit-plugins-lmnt>=1.8.11"]
