hume = ["livekit-plugins-hume>=1.8.6"]
inworld = ["livekit-plugins-inworld>=1.8.6"]
keyframe = ["livekit-plugins-keyframe>=1.8.6"]
langchain = ["livekit-plugins-langchain>=1.8.6"]
lemonslice = ["livekit-plugins-lemonslice>=1.8.6"]
liveavatar = ["livekit-plugins-liveavatar>=1.8.6"]
lmnt = ["livekit-plugins-lmnt>=1.8.6"]
meta = ["livekit-plugins-meta>=1.8.6"]
microsoft-ai = ["livekit-plugins-microsoft-ai>=1.8.6"]
minimax = ["livekit-plugins-minimax-ai>=1.8.6"]
mistralai = ["livekit-plugins-mistralai>=1.8.6"]
murf = ["livekit-plugins-murf>=1.8.6"]
nabrah = ["livekit-plugins-nabrah>=1.8.6"]
neuphonic = ["livekit-plugins-neuphonic>=1.8.6"]
nltk = ["livekit-plugins-nltk>=1.8.6"]
nvidia = ["livekit-plugins-nvidia>=1.8.6"]
openai = ["livekit-plugins-openai>=1.8.6"]
palabra = ["livekit-plugins-palabra>=1.8.6"]
perplexity = ["livekit-plugins-perplexity>=1.8.6"]
